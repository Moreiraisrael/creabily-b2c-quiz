    // =========================================================
    // 2. SEÇÃO DE GRÁFICOS MODERNOS (Restaurada conforme versão anterior)
    // =========================================================
    function renderAnalytics(list) {
      // 1. Dados dos últimos 7 dias
      const days = [];
      const now = Date.now();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now - i * 86400000);
        const isoKey = localIsoDate(d);
        const shortDay = d.toLocaleDateString('pt-BR', { weekday: 'short', timeZone: 'America/Sao_Paulo' }).replace('.', '').slice(0, 3).toUpperCase();
        const count = list.filter(l => localIsoDate(l.created_at) === isoKey).length;
        days.push({ isoKey, shortDay, count });
      }
      const maxCount = Math.max(...days.map(d => d.count), 4);

      // SVG Bar Chart
      const chartWidth = 280;
      const barWidth = 22;
      const gap = (chartWidth - (7 * barWidth)) / 8;
      
      let barsSvg = '';
      days.forEach((d, idx) => {
        const x = gap + idx * (barWidth + gap);
        const h = Math.max(4, Math.round((d.count / maxCount) * 52));
        const y = 62 - h;
        const isTodayDay = idx === 6;
        const fill = isTodayDay ? 'url(#barGradToday)' : 'url(#barGrad)';
        barsSvg += `
          <g class="bar-group">
            <title>${d.isoKey}: ${d.count} leads</title>
            <rect x="${x}" y="10" width="${barWidth}" height="52" rx="4" class="bar-track"></rect>
            <rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${fill}"></rect>
            <text x="${x + barWidth/2}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${d.count > 0 ? (isTodayDay ? 'var(--teal)' : 'var(--brand)') : 'var(--text-3)'}">${d.count}</text>
            <text x="${x + barWidth/2}" y="78" text-anchor="middle" font-size="9" font-weight="${isTodayDay ? '700' : '500'}" fill="${isTodayDay ? 'var(--teal)' : 'var(--text-3)'}">${d.shortDay}</text>
          </g>
        `;
      });

      // 2. Especialidades mais procuradas
      const specCounts = {};
      list.forEach(l => {
        const s = service(l);
        specCounts[s] = (specCounts[s] || 0) + 1;
      });
      const topSpecs = Object.entries(specCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);
      const totalSpecs = list.length || 1;

      let specsHtml = '';
      if (topSpecs.length) {
        topSpecs.forEach(([specName, count]) => {
          const pct = Math.round((count / totalSpecs) * 100);
          specsHtml += `
            <div class="metric-row">
              <div class="metric-row-info">
                <span class="metric-name">${esc(specName)}</span>
                <span class="metric-val">${count} <small>(${pct}%)</small></span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        });
      } else {
        specsHtml = '<div class="empty-mini">Nenhum lead com especialidade registrada</div>';
      }

      // 3. Origem e Unidade
      let googleCount = 0, instaCount = 0, siteCount = 0, outrosCount = 0;
      let paulistaCount = 0, granjaCount = 0;
      list.forEach(l => {
        const o = origin(l);
        if (o?.cls === 'google') googleCount++;
        else if (o?.cls === 'insta') instaCount++;
        else if (o?.cls === 'site') siteCount++;
        else outrosCount++;

        if (l.preferred_unit === 'granja_viana') granjaCount++;
        else paulistaCount++;
      });
      const totalOrigin = list.length || 1;

      return `
      <section class="analytics-section">
        <div class="analytics-head">
          <div class="analytics-title">
            <span class="analytics-icon">${ic('chart', 'icon-sm')}</span>
            <h4>Inteligência &amp; Desempenho</h4>
          </div>
          <span class="analytics-sub">Panorama visual baseado nos filtros e no período atual</span>
        </div>
        <div class="analytics-grid">
          <!-- Card 1: Volume 7 dias -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Novos Leads (Últimos 7 dias)</span>
              <span class="badge-total">${days.reduce((acc, d) => acc + d.count, 0)} leads</span>
            </div>
            <svg class="bar-chart-svg" viewBox="0 0 280 88">
              <defs>
                <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#8a42b1"></stop>
                  <stop offset="100%" stop-color="#6b308b"></stop>
                </linearGradient>
                <linearGradient id="barGradToday" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f9f8f"></stop>
                  <stop offset="100%" stop-color="#097a6d"></stop>
                </linearGradient>
              </defs>
              ${barsSvg}
            </svg>
          </div>

          <!-- Card 2: Especialidades -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Top Tratamentos / Especialidades</span>
              <span class="badge-total">${Object.keys(specCounts).length} áreas</span>
            </div>
            <div class="metric-list">
              ${specsHtml}
            </div>
          </div>

          <!-- Card 3: Origem & Unidade -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Origem dos Leads &amp; Unidade</span>
              <span class="badge-total">${list.length} total</span>
            </div>
            <div class="channel-distribution">
              <div class="channel-item">
                <span class="chip google">Google Ads: ${googleCount}</span>
                <span class="chip insta">Instagram: ${instaCount}</span>
                <span class="chip site">Site: ${siteCount}</span>
              </div>
              <div class="unit-ratio" style="margin-top:14px">
                <div class="unit-ratio-labels">
                  <span>Paulista: <b>${paulistaCount}</b></span>
                  <span>Granja Viana: <b>${granjaCount}</b></span>
                </div>
                <div class="unit-ratio-bar">
                  <div class="unit-ratio-seg paulista" style="width:${Math.round((paulistaCount / totalOrigin) * 100)}%" title="Paulista"></div>
                  <div class="unit-ratio-seg granja" style="width:${Math.round((granjaCount / totalOrigin) * 100)}%" title="Granja Viana"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      `;
    }

    // =========================================================
    // 3. ABA MARKETING (Central de Leads, Aquisição e Prioridades Operacionais do Dia)
    // =========================================================

      const agendadasHoje = b.agendadas.filter(l => l.appointment_at && isToday(l.appointment_at));

        return `<div class="row row-today" onclick="openDrawer('${esc(l.id)}')">

    function isEligibleForRecovery(l) {
      // 1. Se já subiu na Agenda do Sistema Ágil ou já realizou consulta, sai do Remarketing
      if (isAlreadyInAgil(l)) return false;
      // 2. Se já foi cancelado definitivamente da agenda (sem interesse / opt-out), não entra na fila de disparo
      if (isCancelledFromAgenda(l)) return false;
      return true;
    }

    function getRecoveryQueues(list) {
      // Filtra contatos de dias anteriores que foram guardados fora do Funil Diário
      const storedLeads = list.filter(l => !isInDailyFunnel(l));

      // 1. Guardados Recentes / Em Cadência da Beatriz (Contatos de dias anteriores em Follow-up ou Pré-Agendados aguardando subir no Ágil)
      const posQuiz = storedLeads.filter(l => {
        if (!isEligibleForRecovery(l)) return false;
        if (['no_show', 'perdido'].includes(l.status)) return false;
        const h = hoursSince(l.created_at);
        return h === null || h <= 96; // Até 4 dias
      }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      // 2. Contatos Há Mais Tempo (> 4 dias) — Consultar se ainda têm interesse ou Cancelar da Agenda
      const retomada = storedLeads.filter(l => {
        if (!isEligibleForRecovery(l)) return false;
        if (['no_show', 'perdido'].includes(l.status)) return false;
        const h = hoursSince(l.created_at);
        return h !== null && h > 96;
      }).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      // 3. Frios / No-Show Antigos para Triagem Final (Consultar Interesse ou Cancelar Definitivamente da Agenda)
      const frios = storedLeads.filter(l => {
        if (!isEligibleForRecovery(l)) return false;
        return ['no_show', 'perdido'].includes(l.status);
      }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      return { posQuiz, retomada, frios };
    }

    async function cancelLeadFromAgenda(id, ev) {
      if (ev) ev.stopPropagation();
      const l = findLead(id);
      if (!l) return;
      toast(`🚫 Cancelando ${firstName(l)} da agenda (Sem interesse)...`);
      const r = await api('manage-lead', {
        action: 'cancel_lead_agenda',
        id: l.id,
        reason: '🚫 Cancelado da Agenda — Cliente informou não ter mais interesse no tratamento'
      });
      if (!r.ok) {
        toast(r.error || 'Erro ao cancelar contato da agenda', true);
        return;
      }
      l.status = 'perdido';
      l.ai_paused = true;
      l.opted_out_at = new Date().toISOString();
      l.lost_reason = '🚫 Cancelado da Agenda — Cliente informou não ter mais interesse no tratamento';
      l.appointment_at = null;
      l.agendamento_resumo = null;
      render();
      toast(`🚫 ${firstName(l)} cancelado(a) da agenda e movido(a) para Cancelados!`);
    }

    async function bringLeadToTodayFunnel(id, ev) {
      if (ev) ev.stopPropagation();
      const l = findLead(id);
      if (!l) return;
      toast(`🔥 Reativando ${firstName(l)} no Funil de Giro Diário de Hoje...`);
      const r = await api('manage-lead', {
        action: 'bring_to_today_funnel',
        id: l.id
      });

        toast(r.error || 'Erro ao trazer contato para o funil de hoje', true);

      const nowIso = new Date().toISOString();
      l.status = 'conversando';

              <p>Todos os contatos de dias anteriores ficam guardados aqui para manter o <b>Funil de Hoje 100% limpo</b>. Consulte se o cliente ainda tem interesse ou <b>cancele da agenda</b> com 1 clique.</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <span class="badge-total" style="font-size:12.5px;padding:6px 12px;background:var(--brand-50);color:var(--brand);font-weight:800;">📦 ${total} guardados para remarketing</span>
              <span class="badge-total" style="font-size:12.5px;padding:6px 12px;background:#DCFCE7;color:#166534;font-weight:800;cursor:pointer;" onclick="setView('agente')" title="Ver na Agenda do Sistema Ágil">📅 ${agilExited.length} subiram p/ Agenda Ágil (Baixados)</span>
              <span class="badge-total" style="font-size:12.5px;padding:6px 12px;background:#FEE2E2;color:#991B1B;font-weight:800;cursor:pointer;" onclick="setView('cold')" title="Ver contatos cancelados da agenda">🚫 ${cancelledExited.length} cancelados da agenda</span>
            </div>
          </div>

          <div class="recovery-grid">
            <!-- FILA 1: GUARDADOS DE DIAS RECENTES (ATÉ 4 DIAS) -->
            <div class="recovery-col col-urgent">
              <div class="recovery-col-head">
                <div>
                  <h4>⏳ Guardados Recentes (Dias Anteriores)</h4>
                  <div class="sub">Entraram nos últimos dias e saíram do giro diário para não poluir o Funil</div>
                </div>
                <span class="pill red">${queues.posQuiz.length}</span>
              </div>
              <div class="rows">
                ${queues.posQuiz.length ? queues.posQuiz.map(l => renderRecoveryCard(l, 'pos_quiz')).join('') : `<div class="empty">${ic('party')}<div>Nenhum contato recente pendente!</div></div>`}
              </div>
            </div>

            <!-- FILA 2: CONTATOS HÁ MAIS TEMPO (> 4 DIAS) — CONSULTAR INTERESSE OU CANCELAR -->
            <div class="recovery-col col-resume">
              <div class="recovery-col-head">
                <div>
                  <h4>🎯 Contatos Antigos (Consultar Interesse)</h4>
                  <div class="sub">Estão há bastante tempo sem fechar — pergunte se ainda têm interesse ou cancele da agenda</div>
                </div>
                <span class="pill orange">${queues.retomada.length}</span>
              </div>
              <div class="rows">
                ${queues.retomada.length ? queues.retomada.map(l => renderRecoveryCard(l, 'retomada')).join('') : `<div class="empty">${ic('party')}<div>Nenhum contato antigo aguardando triagem!</div></div>`}
              </div>
            </div>

            <!-- FILA 3: PARADOS / NO-SHOW PARA REpescagem OU CANCELAMENTO DEFINITIVO -->
            <div class="recovery-col col-cold">
              <div class="recovery-col-head">
                <div>
                  <h4>❄️ Sem Resposta / Faltaram (Triagem Final)</h4>
                  <div class="sub">Última verificação de interesse antes de cancelar definitivamente da agenda</div>
                </div>
                <span class="pill slate">${queues.frios.length}</span>
              </div>
              <div class="rows">
                ${queues.frios.length ? queues.frios.map(l => renderRecoveryCard(l, 'frios')).join('') : `<div class="empty">${ic('party')}<div>Nenhum contato pendente na triagem final!</div></div>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================
    // 5. TELA SATISFAÇÃO & NPS (Score Oficial e Mural de Avaliações Reais do Google)
    // =========================================================
    let npsSearchQuery = '';
    function setNpsCategoryFilter(cat) {
      npsCategoryFilter = cat;
      renderNpsView();
    }
    function setNpsUnitFilter(u) {
      npsUnitFilter = u;
      renderNpsView();
    }
    function setNpsSearchQuery(q) {
      npsSearchQuery = String(q || '');
      renderNpsView(true);
    }

    function renderNpsView(preserveSearchFocus = false) {
      const container = document.getElementById('view-nps');
      if (!container) return;

      const allFeedbacks = npsFeedbacks || [];
      const total = allFeedbacks.length;

      // Promotores (9-10 / 5★), Neutros (7-8 / 4★), Detratores (0-6 / 1-3★)
      const promoters = allFeedbacks.filter(f => f.score >= 9);
      const passives = allFeedbacks.filter(f => f.score >= 7 && f.score <= 8);
      const detractors = allFeedbacks.filter(f => f.score <= 6);
      const withComments = allFeedbacks.filter(f => f.feedback_text && String(f.feedback_text).trim().length > 0);

      const pCount = promoters.length;
      const nCount = passives.length;
      const dCount = detractors.length;
      const cCount = withComments.length;

      const pPct = total > 0 ? Math.round((pCount / total) * 100) : 0;
      const nPct = total > 0 ? Math.round((nCount / total) * 100) : 0;
      const dPct = total > 0 ? Math.round((dCount / total) * 100) : 0;

      // NPS = % Promotores - % Detratores (-100 a +100)
      const npsScore = total > 0 ? Math.round(((pCount - dCount) / total) * 100) : 0;

      // Média de estrelas do Google
      const starsOf = f => Number(f.google_stars || (f.score >= 9 ? 5 : (f.score >= 7 ? 4 : (f.score >= 5 ? 3 : 1))));
      const avgGoogleStars = total > 0
        ? (allFeedbacks.reduce((acc, f) => acc + starsOf(f), 0) / total).toFixed(1).replace('.', ',')
        : '5,0';

      // Classificação da zona
      let zoneClass = 'zone-excellence';
      let zoneLabel = '🌟 Zona de Excelência';
      let zoneSub = 'Satisfação de padrão ouro (> 75)';
      if (npsScore < 0) {
        zoneClass = 'zone-danger';
        zoneLabel = '🚨 Zona Crítica';
        zoneSub = 'Mais detratores que promotores';
      } else if (npsScore < 50) {
        zoneClass = 'zone-warning';
        zoneLabel = '⚠️ Zona de Aperfeiçoamento';
        zoneSub = 'Oportunidade de correção clínica';
      } else if (npsScore < 75) {
        zoneClass = 'zone-quality';
        zoneLabel = '👍 Zona de Qualidade';
        zoneSub = 'Bom desempenho, expansão de promotores';
      }

      // Segmentação por Unidade
      const paulistaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('paulista'));
      const granjaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('granja'));

      const calcUnitNps = (arr, officialGoogleRating) => {
        if (!arr.length) return { score: '–', total: 0, promPct: 0, comments: 0, rating: officialGoogleRating };
        const pr = arr.filter(f => f.score >= 9).length;
        const dt = arr.filter(f => f.score <= 6).length;
        const cm = arr.filter(f => f.feedback_text && String(f.feedback_text).trim().length > 0).length;
        return {
          score: Math.round(((pr - dt) / arr.length) * 100),
          total: arr.length,
          promPct: Math.round((pr / arr.length) * 100),
          comments: cm,
          rating: officialGoogleRating
        };
      };
      const paulistaStats = calcUnitNps(paulistaFeedbacks, '4,7');
      const granjaStats = calcUnitNps(granjaFeedbacks, '5,0');

      // Filtragem dos feedbacks do mural
      let filteredList = [...allFeedbacks];
      if (npsCategoryFilter === 'comments') filteredList = filteredList.filter(f => f.feedback_text && String(f.feedback_text).trim().length > 0);
      else if (npsCategoryFilter === 'promoter') filteredList = filteredList.filter(f => f.score >= 9);
      else if (npsCategoryFilter === 'passive') filteredList = filteredList.filter(f => f.score >= 7 && f.score <= 8);
      else if (npsCategoryFilter === 'detractor') filteredList = filteredList.filter(f => f.score <= 6);

      if (npsUnitFilter === 'paulista') filteredList = filteredList.filter(f => (f.unit || '').includes('paulista'));
      else if (npsUnitFilter === 'granja_viana') filteredList = filteredList.filter(f => (f.unit || '').includes('granja'));

      if (npsSearchQuery.trim()) {
        const q = npsSearchQuery.trim().toLowerCase();
        filteredList = filteredList.filter(f =>
          String(f.patient_name || '').toLowerCase().includes(q) ||
          String(f.feedback_text || '').toLowerCase().includes(q) ||
          String(f.service || '').toLowerCase().includes(q) ||
          (Array.isArray(f.improvement_tags) && f.improvement_tags.some(t => String(t).toLowerCase().includes(q)))
        );
      }

      // Priorizar avaliações que possuem comentários escritos reais no topo do mural
      filteredList.sort((a, b) => {
        const hasA = a.feedback_text && String(a.feedback_text).trim().length > 0 ? 1 : 0;
        const hasB = b.feedback_text && String(b.feedback_text).trim().length > 0 ? 1 : 0;
        if (hasA !== hasB) return hasB - hasA;
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });

      // Render Cards
      const renderFeedbackCard = f => {
        const isProm = f.score >= 9;
        const isPass = f.score >= 7 && f.score <= 8;
        const stars = starsOf(f);
        const starsVisual = '⭐'.repeat(Math.max(1, Math.min(5, stars)));
        const chipCls = isProm ? 'promoter' : (isPass ? 'passive' : 'detractor');
        const chipText = isProm ? `⭐ ${stars}/5 (${f.score}/10 Promotor)` : (isPass ? `⚡ ${stars}/5 (${f.score}/10 Neutro)` : `⚠️ ${stars}/5 (${f.score}/10 Crítica)`);
        const isGranja = (f.unit || '').includes('granja');
        const unitLabel = isGranja ? 'Granja Viana' : 'Av. Paulista';
        const unitCls = isGranja ? 'granja' : 'paulista';

        const phone = f.phone ? String(f.phone).replace(/\D/g, '') : '';
        const name = f.patient_name || 'Avaliador do Google';
        const tempoRelativo = f.relative_date || (f.created_at ? dateFmt(f.created_at, false) : '');
        const metaInfo = f.author_meta || (phone ? phone : 'Avaliação Verificada no Google Maps');

        const avatarHtml = f.author_avatar
          ? `<img src="${esc(f.author_avatar)}" alt="${esc(name)}" referrerpolicy="no-referrer" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;flex-shrink:0;" onerror="this.outerHTML='<div class=\\'avatar\\'>${esc(name.slice(0, 2).toUpperCase())}</div>'">`
          : `<div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>`;

        const tagsHtml = Array.isArray(f.improvement_tags) && f.improvement_tags.length ? `
          <div class="nps-card-tags">
            ${f.improvement_tags.map(t => `<span class="nps-tag-pill">${esc(t)}</span>`).join('')}
          </div>
        ` : '';

        const commentHtml = f.feedback_text ? `
          <div class="nps-card-comment" style="white-space:pre-line; line-height:1.55; font-size:13.5px; color:var(--text);">“${esc(f.feedback_text)}”</div>
        ` : `
          <div style="font-size:12.5px; color:var(--text-3); font-style:italic; margin:8px 0;">Avaliação de ${stars} estrelas no Google Maps (sem comentário em texto).</div>
        `;

        const ownerReplyHtml = f.owner_response ? `
          <details style="margin-top:10px; background:#F8FAFC; border:1px solid #E2E8F0; border-left:3px solid #7C3AED; border-radius:8px; padding:8px 12px; font-size:12px;">
            <summary style="cursor:pointer; font-weight:700; color:#5B21B6; user-select:none;">
              💬 Ver resposta oficial da Creabily no Google ${f.owner_response_date ? `<span style="font-weight:400; color:var(--text-3);">(${esc(f.owner_response_date)})</span>` : ''}
            </summary>
            <div style="margin-top:8px; color:var(--text-2); white-space:pre-line; line-height:1.5;">${esc(f.owner_response)}</div>
          </details>
        ` : '';

        const googleBadge = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
            <div class="nps-google-badge" style="margin:0;">${starsVisual} Avaliação Real do Google Maps</div>
            ${tempoRelativo ? `<span style="font-size:11.5px; font-weight:600; color:var(--text-3);">🕒 ${esc(tempoRelativo)}</span>` : ''}
          </div>
        `;

        const mapsUrl = f.google_unit_url || (isGranja
          ? 'https://www.google.com.br/maps/place/Creabily+Fisioterapia+e+Terapias+Integradas+Unidade+Granja+Viana/@-23.5580278,-46.8842785,17z/data=!3m1!4b1!4m6!3m5!1s0x94cf019c06bc8b71:0xabdfec52ee94e0de!8m2!3d-23.5580278!4d-46.8842785!16s%2Fg%2F11vd75f_pc'
          : 'https://www.google.com.br/maps/place/Creabily+Fisioterapia+e+Terapias+Integradas+Unidade+Paulista/@-23.5646644,-46.6536337,17z/data=!3m1!4b1!4m6!3m5!1s0x94ce59c7d5f1bb8d:0x4842e657c207bf2b!8m2!3d-23.5646644!4d-46.6536337!16s%2Fg%2F11bt_grtl9');

        let actionBtn = `<a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" style="font-size:11.5px; font-weight:700; color:var(--brand); text-decoration:none;">Ver no Google ↗</a>`;
        if (phone) {
          const waMsg = isProm
            ? `Olá, ${name}! Tudo bem? Passando para te agradecer com muito carinho pela sua avaliação e pelo carinho com a nossa equipe da Creabily ${unitLabel}. Muita saúde para você! 🙏`
            : `Olá, ${name}! Tudo bem? Aqui é da coordenação clínica da Creabily ${unitLabel}. Recebemos sua avaliação e gostaríamos de te ouvir com muita atenção para garantir que sua experiência com a gente seja nota 10. Como podemos te ajudar?`;
          const waUrl = `https://wa.me/${phone.startsWith('55') ? phone : '55' + phone}?text=${encodeURIComponent(waMsg)}`;
          actionBtn = `<a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-nps-wa" title="Conversar no WhatsApp">${ic('wa', 'icon-sm')}Responder no WhatsApp</a>`;
        }

        return `
          <div class="nps-card">
            <div class="nps-card-head">
              <div class="nps-card-who">
                ${avatarHtml}
                <div>
                  <div class="nps-card-name">${esc(name)}</div>
                  <div class="nps-card-meta">${esc(metaInfo)}</div>
                </div>
              </div>
              <span class="nps-score-chip ${chipCls}">${chipText}</span>
            </div>

            ${googleBadge}
            ${tagsHtml}
            ${commentHtml}
            ${ownerReplyHtml}

            <div class="nps-card-foot" style="margin-top:12px;">
              <div>
                <span class="unit-tag ${unitCls}">📍 ${unitLabel}</span>
                <span style="margin-left: 6px; color: var(--text-3); font-weight:600;">${esc(f.service || 'Fisioterapia & Pilates')}</span>
              </div>
              ${actionBtn}
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <!-- HERO NPS & GOOGLE MAPS OFICIAL -->
        <div class="nps-hero">
          <div class="nps-hero-grid">
            <div class="nps-score-badge ${zoneClass}">
              <div class="nps-score-val">${total > 0 ? (npsScore > 0 ? '+' : '') + npsScore : '–'}</div>
              <div class="nps-score-label">NPS Real Google (${avgGoogleStars} ★)</div>
              <div class="nps-score-sub">${zoneLabel}</div>
              <div style="font-size:11px; opacity:0.85; margin-top:2px;">${total} avaliações reais do Google Maps (${cCount} com depoimento)</div>
            </div>

            <div class="nps-breakdown">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <h3 style="margin:0; font-size:16px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px;">
                  ${ic('star')} Resultados Reais do Google Meu Negócio — Creabily
                </h3>
                <span style="font-size:12.5px; font-weight:700; color:#0D9488; background:#CCFBF1; padding:4px 10px; border-radius:999px;">
                  🟢 Sincronizado com Google Maps (${total} avaliações reais)
                </span>
              </div>

              <div class="nps-bar-container" title="5 Estrelas (Promotores): ${pPct}% | 4 Estrelas (Neutros): ${nPct}% | 1-3 Estrelas: ${dPct}%">
                <div class="nps-bar-seg promoters" style="width: ${pPct}%"></div>
                <div class="nps-bar-seg passives" style="width: ${nPct}%"></div>
                <div class="nps-bar-seg detractors" style="width: ${dPct}%"></div>
              </div>

              <div class="nps-stats-row">
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#0D9488;">🌟 5 Estrelas / Promotores</div>
                  <div class="nps-stat-number">${pCount} <span class="nps-stat-pct">(${pPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#D97706;">⚡ 4 Estrelas / Neutros</div>
                  <div class="nps-stat-number">${nCount} <span class="nps-stat-pct">(${nPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#DC2626;">⚠️ 1 a 3 Estrelas</div>
                  <div class="nps-stat-number">${dCount} <span class="nps-stat-pct">(${dPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#7C3AED;">💬 Depoimentos Escritos</div>
                  <div class="nps-stat-number">${cCount} <span class="nps-stat-pct">(de ${total})</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- COMPARATIVO POR UNIDADE NO GOOGLE MAPS -->
        <div class="nps-unit-grid">
          <div class="nps-unit-card">
            <div class="nps-unit-info">
              <h4>🏙️ Unidade Av. Paulista — Nota Google: ⭐ ${paulistaStats.rating} / 5,0</h4>
              <p>${paulistaStats.total} avaliações oficiais no Google • <strong>${paulistaStats.comments} comentários reais</strong> • ${paulistaStats.promPct}% 5 estrelas</p>
              <div style="margin-top: 8px;">
                <a href="https://www.google.com.br/maps/place/Creabily+Fisioterapia+e+Terapias+Integradas+Unidade+Paulista/@-23.5646644,-46.6536337,17z/data=!3m1!4b1!4m6!3m5!1s0x94ce59c7d5f1bb8d:0x4842e657c207bf2b!8m2!3d-23.5646644!4d-46.6536337!16s%2Fg%2F11bt_grtl9" target="_blank" rel="noopener noreferrer" style="font-size:12px; color:var(--brand); text-decoration:none; font-weight:700;">Abrir Ficha Oficial no Google Maps ↗</a>
              </div>
            </div>
            <div class="nps-unit-score" style="color:${paulistaStats.score >= 75 ? '#0D9488' : '#D97706'};" title="NPS da Unidade Paulista">
              ${paulistaStats.score !== '–' ? (paulistaStats.score > 0 ? '+' : '') + paulistaStats.score : '–'}
              <div style="font-size:10px; font-weight:700; color:var(--text-3); text-align:center;">NPS</div>
            </div>
          </div>

          <div class="nps-unit-card">
            <div class="nps-unit-info">
              <h4>🌿 Unidade Granja Viana — Nota Google: ⭐ ${granjaStats.rating} / 5,0</h4>
              <p>${granjaStats.total} avaliações oficiais no Google • <strong>${granjaStats.comments} comentários reais</strong> • ${granjaStats.promPct}% 5 estrelas (Nota Máxima!)</p>
              <div style="margin-top: 8px;">
                <a href="https://www.google.com.br/maps/place/Creabily+Fisioterapia+e+Terapias+Integradas+Unidade+Granja+Viana/@-23.5580278,-46.8842785,17z/data=!3m1!4b1!4m6!3m5!1s0x94cf019c06bc8b71:0xabdfec52ee94e0de!8m2!3d-23.5580278!4d-46.8842785!16s%2Fg%2F11vd75f_pc" target="_blank" rel="noopener noreferrer" style="font-size:12px; color:var(--brand); text-decoration:none; font-weight:700;">Abrir Ficha Oficial no Google Maps ↗</a>
              </div>
            </div>
            <div class="nps-unit-score" style="color:${granjaStats.score >= 75 ? '#0D9488' : '#D97706'};" title="NPS da Unidade Granja Viana">
              ${granjaStats.score !== '–' ? (granjaStats.score > 0 ? '+' : '') + granjaStats.score : '–'}
              <div style="font-size:10px; font-weight:700; color:var(--text-3); text-align:center;">NPS</div>
            </div>
          </div>
        </div>

        <!-- BARRA DE BUSCA E FILTROS DO MURAL DE COMENTÁRIOS REAIS -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; background:var(--surface); padding:12px 16px; border:1px solid var(--line); border-radius:12px;">
          <div class="nps-filters" style="flex-wrap:wrap;">
            <button class="nps-filter-btn ${npsCategoryFilter === 'all' ? 'active' : ''}" onclick="setNpsCategoryFilter('all')">Todas (${total})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'comments' ? 'active' : ''}" onclick="setNpsCategoryFilter('comments')">💬 Com Comentário (${cCount})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'promoter' ? 'active' : ''}" onclick="setNpsCategoryFilter('promoter')">🌟 5 Estrelas (${pCount})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'passive' ? 'active' : ''}" onclick="setNpsCategoryFilter('passive')">⚡ 4 Estrelas (${nCount})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'detractor' ? 'active' : ''}" onclick="setNpsCategoryFilter('detractor')">⚠️ 1–3 Estrelas (${dCount})</button>
          </div>

          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1; justify-content:flex-end;">
            <input
              id="nps-search-input"
              type="text"
              value="${esc(npsSearchQuery)}"
              oninput="setNpsSearchQuery(this.value)"
              placeholder="🔍 Buscar paciente, profissional (ex: Rubem, Tatiana) ou elogio..."
              style="min-width:260px; flex:1; max-width:360px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; outline:none;"
            />
            <div class="nps-filters">
              <button class="nps-filter-btn ${npsUnitFilter === 'all' ? 'active' : ''}" onclick="setNpsUnitFilter('all')">Todas Unidades</button>
              <button class="nps-filter-btn ${npsUnitFilter === 'paulista' ? 'active' : ''}" onclick="setNpsUnitFilter('paulista')">🏙️ Paulista (${paulistaStats.total})</button>
              <button class="nps-filter-btn ${npsUnitFilter === 'granja_viana' ? 'active' : ''}" onclick="setNpsUnitFilter('granja_viana')">🌿 Granja (${granjaStats.total})</button>
            </div>
          </div>
        </div>

        <!-- GRID DE CARDS DE FEEDBACK REAIS DO GOOGLE -->
        <div class="nps-feed-grid">
          ${filteredList.length ? filteredList.map(renderFeedbackCard).join('') : `
            <div style="grid-column: 1 / -1; text-align:center; padding:40px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); color:var(--text-3);">
              ${ic('star')}

    function formatCellDate(val) {
      if (!val && val !== 0) return '';
      if (val instanceof Date && !isNaN(val.getTime())) {
        const dd = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const yyyy = val.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }
      if (typeof val === 'number' && val > 35000 && val < 60000) {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        const dd = String(d.getUTCDate()).padStart(2, '0');
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const yyyy = d.getUTCFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }
      const s = String(val).trim();
      const m1 = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (m1) {
        const dd = m1[1].padStart(2, '0');
        const mm = m1[2].padStart(2, '0');
        let yyyy = m1[3];
        if (yyyy.length === 2) yyyy = '20' + yyyy;
        return `${dd}/${mm}/${yyyy}`;
      }
      const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m2) {
        return `${m2[3].padStart(2, '0')}/${m2[2].padStart(2, '0')}/${m2[1]}`;
      }
      return '';
    }

    function formatCellTime(val) {
      if (!val && val !== 0) return '';
      if (val instanceof Date && !isNaN(val.getTime())) {
        return `${String(val.getHours()).padStart(2, '0')}:${String(val.getMinutes()).padStart(2, '0')}`;
      }
      if (typeof val === 'number' && val >= 0 && val < 1) {
        const totalMins = Math.round(val * 24 * 60);
        const hh = Math.floor(totalMins / 60);
        const mm = totalMins % 60;
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{1,2}):(\d{2})/);
      if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
      return '';
    }

    function inferUnidadeAgil(rawUnidade, profissional, especialidade, procedimento) {
      const u = String(rawUnidade || '').toUpperCase();
      if (u.includes('GRANJA')) return 'GRANJA VIANA';
      if (u.includes('PAULISTA')) return 'PAULISTA';
      const combined = `${profissional || ''} ${especialidade || ''} ${procedimento || ''}`.toLowerCase();
      if (
        combined.includes('granja') ||
        combined.includes('angela oliveira') ||
        combined.includes('giovanna barros') ||
        combined.includes('jessica oliveira') ||
        combined.includes('piero') ||
        combined.includes('pierro') ||
        combined.includes('antonaccio') ||
        combined.includes('camila (fisio')
      ) {
        return 'GRANJA VIANA';
      }
      return 'PAULISTA';
    }

    function inferConvenioAgil(rawConv, sheetName, procedimento, guia) {
      const OFFICIAL = [
        'Afresp Saúde', 'Amil Black, Amil One, Lincx', 'Care Plus', 'Medsenior',
        'Convênio Creabily Especial', 'Creabily Particular', 'Omint Premium',
        'Omint Skill', 'Omint Corporate', 'SEM CONVÊNIO', 'Total Pass'
      ];
      const c = String(rawConv || '').trim();
      const sh = String(sheetName || '').trim();
      const matchOfficial = (str) => {
        if (!str) return null;
        const low = str.toLowerCase();
        const exact = OFFICIAL.find(o => o.toLowerCase() === low);
        if (exact) return exact;
        if (low.includes('afresp')) return 'Afresp Saúde';
        if (low.includes('amil') || low.includes('lincx') || low.includes('one')) return 'Amil Black, Amil One, Lincx';
        if (low.includes('care plus') || low.includes('careplus')) return 'Care Plus';
        if (low.includes('medsenior') || low.includes('medsênior') || low.includes('med senior')) return 'Medsenior';
        if (low.includes('especial')) return 'Convênio Creabily Especial';
        if (low.includes('particular')) return 'Creabily Particular';
        if (low.includes('omint') && low.includes('premium')) return 'Omint Premium';
        if (low.includes('omint') && low.includes('corporate')) return 'Omint Corporate';
        if (low.includes('omint')) return 'Omint Skill';
        if (low.includes('total pass') || low.includes('totalpass')) return 'Total Pass';
        return null;
      };
      return matchOfficial(c) || matchOfficial(sh) || matchOfficial(`${procedimento || ''} ${guia || ''}`) || 'SEM CONVÊNIO';
    }

            const imageDataUrl = await convertFileToImageDataUrl(f);
            const r = await api('agendamentos', {
              action: 'ocr_image',
              imageDataUrl,
              fileName: f.name,
              fallbackDate: fbDate
            });
            if (r.ok && r.data && Array.isArray(r.data.rows) && r.data.rows.length > 0) {
              r.data.rows.forEach(row => {
                allExtractedRows.push(row);
                if (row.data) datesSet.add(row.data);
                if (row.unidade === 'GRANJA VIANA') countGranja++; else countPaulista++;
              });
              logs.unshift(`<div style="padding:4px 0; border-bottom:1px solid var(--line); color:#065F46; font-size:12px;">✅ <b>${esc(f.name)}</b>: ${r.data.rows.length} atendimento(s) reconhecido(s)</div>`);
            } else {
              logs.unshift(`<div style="padding:4px 0; border-bottom:1px solid var(--line); color:#DC2626; font-size:12px;">⚠️ <b>${esc(f.name)}</b>: ${esc(r.error || 'Nenhum atendimento identificado na imagem')}</div>`);
            }
          } catch (err) {
            logs.unshift(`<div style="padding:4px 0; border-bottom:1px solid var(--line); color:#DC2626; font-size:12px;">⚠️ <b>${esc(f.name)}</b>: ${esc(err.message)}</div>`);
          }
        }

        agenteImportPendingRows = allExtractedRows;
        if (allExtractedRows.length > 0) {
          btnConfirm.disabled = false;
          btnConfirm.textContent = `Confirmar Importação (${allExtractedRows.length} atendimentos)`;
          const sampleRows = allExtractedRows.slice(0, 6).map(x => `
            <tr>
              <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.data)}</td>
              <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-family:monospace;">${esc(x.horario)}</td>
              <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-weight:700;">${esc(x.paciente)}</td>
              <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.convenio)}</td>
              <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.unidade)}</td>
            </tr>
          `).join('');
          preview.innerHTML = `
            <div style="font-weight:800; color:#047857; margin-bottom:6px;">🎉 ${allExtractedRows.length} atendimento(s) extraídos de ${imgFiles.length} imagem(ns)!</div>
            <div style="font-size:11.5px; color:var(--text-2); margin-bottom:8px;">
              Paulista: <b>${countPaulista}</b> • Granja Viana: <b>${countGranja}</b> • Datas: <b>${[...datesSet].join(', ')}</b>
            </div>
            <table style="width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:8px;">
              <thead>
                <tr style="background:var(--surface-subtle); text-align:left;">
                  <th style="padding:4px 6px;">Data</th>
                  <th style="padding:4px 6px;">Hora</th>
                  <th style="padding:4px 6px;">Paciente</th>
                  <th style="padding:4px 6px;">Convênio</th>
                  <th style="padding:4px 6px;">Unidade</th>
                </tr>
              </thead>
              <tbody>${sampleRows}</tbody>
            </table>
            ${logs.join('')}
          `;
        } else {
          btnConfirm.disabled = true;
          preview.innerHTML = `<div style="font-weight:700; color:#DC2626; margin-bottom:6px;">Não foi possível extrair atendimentos das imagens enviadas.</div>` + logs.join('');
        }
        return;
      }

      const file = files[0];
      if (typeof XLSX === 'undefined') {
        alert('Biblioteca XLSX ainda carregando. Aguarde 2 segundos e tente novamente.');
        return;
      }

      preview.innerHTML = `<div style="display:flex; align-items:center; gap:8px;">🔄 Lendo e analisando estrutura de <b>${esc(file.name)}</b>...</div>`;

      // Tentar extrair data do nome do arquivo caso seja 21-10-26.xlsx
      let fileFallbackDate = '';
      const fnMatch = file.name.match(/(\d{2})[\/\-_](\d{2})[\/\-_](\d{2,4})/);
      if (fnMatch) {
        let yy = fnMatch[3];
        if (yy.length === 2) yy = '20' + yy;
        fileFallbackDate = `${fnMatch[1]}/${fnMatch[2]}/${yy}`;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const rowsToImport = [];
          const datesSet = new Set();
          let countPaulista = 0;
          let countGranja = 0;

          const skipTabs = ['REGRAS DO AGENTE', 'TOTAL OUTUBRO', 'RESUMO CONFERÊNCIA', 'RESUMO CONFERENCIA', 'BASE AUDITORIA', 'PAINEL GERENCIAL', 'AÇÕES ADMINISTRATIVAS', 'ACOES ADMINISTRATIVAS'];
          const targetSheets = wb.SheetNames.filter(n => !skipTabs.includes(n.toUpperCase().trim()));
          const sheetsToRead = targetSheets.length > 0 ? targetSheets : wb.SheetNames;

          for (const sheetName of sheetsToRead) {
            const ws = wb.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            let curUnidade = '';
            let curDate = fileFallbackDate;
            let colMap = null;

            for (let i = 0; i < rawRows.length; i++) {
              const r = rawRows[i];
              if (!r || !r.length) continue;
              const nonEmpty = r.filter(c => String(c || '').trim() !== '');
              if (!nonEmpty.length) continue;

              const c0 = String(r[0] || '').trim();
              const rowJoined = r.map(x => String(x || '').trim()).join(' ').toUpperCase();

              // Detectar banners de seção
              if (c0.toUpperCase().startsWith('DATA ') || (nonEmpty.length <= 2 && rowJoined.includes('DATA '))) {
                const m = rowJoined.match(/(\d{2}\/\d{2}\/\d{4})/);
                if (m) curDate = m[1];
                continue;
              }
              if (nonEmpty.length <= 3 && rowJoined.includes('UNIDADE PAULISTA')) { curUnidade = 'PAULISTA'; continue; }
              if (nonEmpty.length <= 3 && rowJoined.includes('UNIDADE GRANJA')) { curUnidade = 'GRANJA VIANA'; continue; }

              // Detectar linha de cabeçalho dinamicamente
              const lowerCells = r.map(c => String(c || '').trim().toLowerCase());
              const hasPacienteCol = lowerCells.some(c => c === 'paciente' || c === 'nome do paciente' || c === 'cliente' || c === 'nome');
              const hasDataOrHoraCol = lowerCells.some(c => c === 'data' || c.startsWith('hor') || c === 'hora' || c.includes('status') || c.includes('profissional'));

              if (hasPacienteCol && hasDataOrHoraCol) {
                colMap = {};
                lowerCells.forEach((lbl, idx) => {
                  if (!lbl) return;
                  if ((lbl === 'data' || lbl.includes('data atend') || lbl.includes('dt')) && colMap.data === undefined) colMap.data = idx;
                  else if ((lbl === 'paciente' || lbl === 'nome do paciente' || lbl === 'cliente' || lbl === 'nome') && colMap.paciente === undefined) colMap.paciente = idx;
                  else if ((lbl.startsWith('hor') || lbl === 'hora' || lbl === 'início' || lbl === 'inicio') && colMap.horario === undefined) colMap.horario = idx;
                  else if ((lbl.includes('status') || lbl === 'estado') && colMap.status_agil === undefined) colMap.status_agil = idx;
                  else if ((lbl.includes('profissional') || lbl.includes('fisioterapeuta') || lbl.includes('prestador') || lbl.includes('terapeuta') || lbl.includes('médico') || lbl.includes('medico')) && !lbl.includes('tipo') && !lbl.includes('agendamento') && colMap.profissional === undefined) colMap.profissional = idx;
                  else if ((lbl.includes('especialidade') || lbl.includes('serviço') || lbl.includes('servico')) && colMap.especialidade === undefined) colMap.especialidade = idx;
                  else if ((lbl.includes('procedimento') || lbl.includes('item') || lbl.includes('tratamento')) && colMap.procedimento === undefined) colMap.procedimento = idx;
                  else if ((lbl.includes('sessão') || lbl.includes('sessao') || lbl.includes('qtde')) && colMap.sessao === undefined) colMap.sessao = idx;
                  else if ((lbl.includes('cpf') || lbl.includes('carteirinha') || lbl.includes('carteira') || lbl.includes('documento') || lbl.includes('matricula') || lbl.includes('matrícula') || lbl.includes('benefici') || lbl.includes('inscric') || lbl.includes('inscriç')) && colMap.cpf_carteirinha === undefined) colMap.cpf_carteirinha = idx;
                  else if ((lbl.includes('guia') || lbl.includes('senha') || lbl.includes('autoriza')) && colMap.guia === undefined) colMap.guia = idx;
                  else if ((lbl.includes('ação') || lbl.includes('acao') || lbl.includes('lembrete') || lbl.includes('alerta')) && !lbl.includes('dura') && !lbl.includes('observa') && !lbl.includes('valida') && !lbl.includes('situa') && colMap.acao_lembrete === undefined) colMap.acao_lembrete = idx;
                  else if ((lbl === 'situação' || lbl === 'situacao') && colMap.situacao === undefined) colMap.situacao = idx;
                  else if ((lbl.includes('valida')) && colMap.validacao === undefined) colMap.validacao = idx;
                  else if ((lbl.includes('observa') || lbl === 'obs') && colMap.observacao === undefined) colMap.observacao = idx;
                  else if ((lbl.includes('convênio') || lbl.includes('convenio') || lbl.includes('plano') || lbl.includes('operadora')) && colMap.convenio === undefined) colMap.convenio = idx;
                  else if ((lbl.includes('unidade') || lbl.includes('filial') || lbl.includes('local') || lbl.includes('clínica')) && colMap.unidade === undefined) colMap.unidade = idx;
                });
                continue;
              }

              // Tentar extrair registro da linha
              let rowDate = '';
              let paciente = '';
              let horario = '';
              let status_agil = '';
              let profissional = '';
              let especialidade = '';
              let procedimento = '';
              let sessao = '';
              let cpf_carteirinha = '';
              let guia = '';
              let acao_lembrete = '';
              let situacao = '';
              let validacao = '';
              let observacao = '';
              let rawConv = '';
              let rawUnid = '';

              if (colMap) {
                rowDate = colMap.data !== undefined ? formatCellDate(r[colMap.data]) : curDate;
                paciente = colMap.paciente !== undefined ? String(r[colMap.paciente] || '').trim() : '';
                horario = colMap.horario !== undefined ? formatCellTime(r[colMap.horario]) : '';
                status_agil = colMap.status_agil !== undefined ? String(r[colMap.status_agil] || '').trim() : '';
                profissional = colMap.profissional !== undefined ? String(r[colMap.profissional] || '').trim() : '';
                especialidade = colMap.especialidade !== undefined ? String(r[colMap.especialidade] || '').trim() : '';
                procedimento = colMap.procedimento !== undefined ? String(r[colMap.procedimento] || '').trim() : '';
                sessao = colMap.sessao !== undefined ? String(r[colMap.sessao] || '').trim() : '';
                cpf_carteirinha = colMap.cpf_carteirinha !== undefined ? String(r[colMap.cpf_carteirinha] || '').trim() : '';
                guia = colMap.guia !== undefined ? String(r[colMap.guia] || '').trim() : '';
                acao_lembrete = colMap.acao_lembrete !== undefined ? String(r[colMap.acao_lembrete] || '').trim() : '';
                situacao = colMap.situacao !== undefined ? String(r[colMap.situacao] || '').trim() : '';
                validacao = colMap.validacao !== undefined ? String(r[colMap.validacao] || '').trim() : '';
                observacao = colMap.observacao !== undefined ? String(r[colMap.observacao] || '').trim() : '';
                rawConv = colMap.convenio !== undefined ? String(r[colMap.convenio] || '').trim() : '';
                rawUnid = colMap.unidade !== undefined ? String(r[colMap.unidade] || '').trim() : '';
              } else {
                // Heurística sem cabeçalho explícito: verificar se r[0] é data
                rowDate = formatCellDate(r[0]) || curDate;
                if (!rowDate) continue;
                const cell1Time = formatCellTime(r[1]);
                const cell2Time = formatCellTime(r[2]);
                const c3Str = String(r[3] || '').trim();
                const c6Str = String(r[6] || '').trim();
                const isRawAgilLayout = (cell1Time && !cell2Time && String(r[2] || '').trim().length > 2) ||
                  /^(feminino|masculino|não informado)$/i.test(c3Str) ||
                  /^(crefito|crp|crn|crtp|crm)\s*:/i.test(c6Str);

                if (isRawAgilLayout) {
                  // Formato Bruto Exportado pelo Sistema Ágil:
                  // Col 0: Data | Col 1: Horário | Col 2: Paciente | Col 3: Sexo | Col 4: Convênio |
                  // Col 5: Profissional | Col 6: Conselho (CREFITO/CRP/CRN) | Col 7: Procedimento |
                  // Col 8: Especialidade | Col 9: Guia/Senha | Col 10: Status Ágil (Sessão) | Col 11..13: Valores Financeiros
                  horario = cell1Time || String(r[1] || '').trim();
                  paciente = String(r[2] || '').trim();
                  rawConv = String(r[4] || '').trim();
                  const rawProf = String(r[5] || '').trim();
                  const rawConselho = c6Str;
                  profissional = (rawConselho && /^(crefito|crp|crn|crtp|crm)/i.test(rawConselho) && !rawProf.includes(rawConselho))
                    ? `${rawProf} - ${rawConselho}`
                    : rawProf;
                  procedimento = String(r[7] || '').trim();
                  especialidade = String(r[8] || '').trim();
                  guia = String(r[9] || '').trim();

                  const rawStSess = String(r[10] || '').trim();
                  const mSt = rawStSess.match(/^([^\(]+?)\s*(?:\(([^)]*)\))?$/);
                  if (mSt) {
                    status_agil = (mSt[1] || 'Em Aberto').trim();
                    const inside = (mSt[2] || '').trim();
                    sessao = /^\d+\s*\/\s*\d+$/.test(inside) ? inside.replace(/\s+/g, '') : '';
                  } else {
                    status_agil = rawStSess || 'Em Aberto';
                    sessao = '';
                  }
                } else {
                  // Formato Consolidado A:N onde Col 1 = Paciente e Col 2 = Horário
                  paciente = String(r[1] || '').trim();
                  horario = cell2Time || String(r[2] || '').trim();
                  status_agil = String(r[3] || '').trim();
                  profissional = String(r[4] || '').trim();
                  especialidade = String(r[5] || '').trim();
                  procedimento = String(r[6] || '').trim();
                  sessao = String(r[7] || '').trim();
                  cpf_carteirinha = String(r[8] || '').trim();
                  guia = String(r[9] || '').trim();
                  acao_lembrete = String(r[10] || '').trim();
                  situacao = String(r[11] || '').trim();
                  validacao = String(r[12] || '').trim();
                  observacao = String(r[13] || '').trim();
                  if (/^[0-9.]+$/.test(validacao)) validacao = 'Pendente';
                  if (/^[0-9.]+$/.test(observacao)) observacao = '';
                  if (/^[0-9.]+$/.test(situacao)) situacao = '';
                }
              }

              // Proteção extra contra inversão entre Paciente e Horário
              if (/^\d{1,2}:\d{2}/.test(paciente) && horario && !/^\d{1,2}:\d{2}/.test(horario)) {
                const tmp = paciente;
                paciente = horario;
                horario = tmp;
              }

              if (!rowDate || !paciente) continue;
              const pUpper = paciente.toUpperCase();
              if (pUpper === 'PACIENTE' || pUpper === 'TOTAL' || pUpper.startsWith('UNIDADE ') || pUpper.startsWith('DATA ')) continue;

              // Se sessão não veio em coluna própria, extrair de Status Ágil ou Procedimento ex: "Finalizado (10/10)"
              if (!sessao) {
                const mSess = `${status_agil} ${procedimento}`.match(/\((\d{1,2}\/\d{1,2})\)|\b(\d{1,2}\/\d{1,2})\b/);
                if (mSess) sessao = mSess[1] || mSess[2] || '';
              }

              const un = curUnidade || inferUnidadeAgil(rawUnid, profissional, especialidade, procedimento);
              const conv = inferConvenioAgil(rawConv, sheetName, procedimento, guia);

              if (un === 'PAULISTA') countPaulista++; else countGranja++;
              datesSet.add(rowDate);

              rowsToImport.push({
                data: rowDate,
                paciente,
                horario: horario.slice(0, 20),
                status_agil: status_agil || 'Agendado',
                profissional,
                especialidade,
                procedimento,
                sessao,
                cpf_carteirinha,
                guia,
                acao_lembrete,
                situacao,
                validacao: validacao || 'Pendente',
                observacao,
                unidade: un,
                convenio: conv
              });
            }
          }

          agenteImportPendingRows = rowsToImport;
          const btnConfirm = document.getElementById('btn-confirm-import');
          const datesArr = [...datesSet];

          if (rowsToImport.length > 0) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = `Confirmar Importação (${rowsToImport.length} atendimentos)`;
            const sampleRows = rowsToImport.slice(0, 5).map(x => `
              <tr>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.data)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-family:monospace;">${esc(x.horario)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-weight:700;">${esc(x.paciente)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${x.unidade === 'GRANJA VIANA' ? '🌿 Granja' : '🏙️ Paulista'}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.convenio)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-weight:700;">${esc(x.sessao || '—')}</td>
              </tr>
            `).join('');

            preview.innerHTML = `
              <div style="color:#059669; font-weight:700; font-size:14px; margin-bottom:6px;">✓ Planilha validada e pronta para importação!</div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:10px;">
                <div><b>Arquivo:</b> ${esc(file.name)}</div>
                <div><b>Data(s):</b> ${esc(datesArr.join(', ') || 'Identificada')}</div>
                <div><b>Total de Atendimentos:</b> ${rowsToImport.length}</div>
                <div><b>Unidades:</b> 🏙️ ${countPaulista} Paulista | 🌿 ${countGranja} Granja Viana</div>
              </div>
              <div style="font-size:11px; font-weight:700; color:var(--text-3); margin-bottom:4px; text-transform:uppercase;">Pré-visualização dos primeiros registros:</div>
              <table style="width:100%; border-collapse:collapse; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden;">
                <thead>
                  <tr style="background:#F5F3FF; color:#4C1D95; text-align:left;">
                    <th style="padding:5px 6px;">Data</th>
                    <th style="padding:5px 6px;">Hora</th>
                    <th style="padding:5px 6px;">Paciente</th>
                    <th style="padding:5px 6px;">Unidade</th>
                    <th style="padding:5px 6px;">Convênio</th>
                    <th style="padding:5px 6px;">Sessão</th>
                  </tr>
                </thead>
                <tbody>${sampleRows}</tbody>
              </table>
            `;
          } else {
            btnConfirm.disabled = true;
            preview.innerHTML = `
              <div style="color:#DC2626; font-weight:600;">Nenhum atendimento válido foi encontrado na planilha.</div>
              <div style="font-size:11.5px; color:var(--text-3); margin-top:4px;">Verifique se a planilha possui colunas de Data e Paciente ou se o arquivo não está vazio.</div>
            `;
          }
        } catch (err) {
          preview.innerHTML = `<div style="color:#DC2626; font-weight:600;">Erro ao ler o arquivo: ${esc(err.message)}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function submitAgilImport() {
      if (!agenteImportPendingRows.length) return;
      const btn = document.getElementById('btn-confirm-import');
      const errBox = document.getElementById('agente-import-error');
      if (errBox) { errBox.classList.add('hidden'); errBox.innerHTML = ''; }
      btn.disabled = true;

      const BATCH_SIZE = 200;
      const totalRows = agenteImportPendingRows.length;
      const totalBatches = Math.ceil(totalRows / BATCH_SIZE);
      let totalInserted = 0;
      let totalUpdated = 0;
      let totalNps = 0;
      let totalCrmSynced = 0;
      let importedDates = [];

      try {
        for (let b = 0; b < totalBatches; b++) {
          const chunk = agenteImportPendingRows.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
          btn.textContent = totalBatches > 1 ? `Gravando no Supabase (${b + 1}/${totalBatches})...` : 'Gravando no Supabase...';

          const r = await api('agendamentos', {
            action: 'import',
            rows: chunk,
            loteNome: 'Upload_Agil_' + new Date().toISOString().substring(0, 10)
          });

          if (!r.ok) {
            const msg = r.error || 'Erro ao gravar lote no banco de dados';
            if (errBox) {
              errBox.classList.remove('hidden');
              errBox.innerHTML = `⚠️ Falha na importação: ${esc(msg)}`;
            }
            toast(msg, true);
            btn.disabled = false;
            btn.textContent = 'Tentar Novamente';
            return;
          }

          totalInserted += (r.data.insertedCount || 0);
          totalUpdated += (r.data.updatedCount || 0);
          totalNps += (r.data.npsCount || 0);
          totalCrmSynced += (r.data.crmSyncedCount || 0);
          if (Array.isArray(r.data.dates)) importedDates.push(...r.data.dates);
        }

        const uniqueD = [...new Set(importedDates)];
        if (uniqueD.length === 1) {
          agenteDayFilter = uniqueD[0];
          if (uniqueD[0].length === 10) {
            agenteMonthFilter = uniqueD[0].substring(3, 10);
            agenteCalViewMonth = agenteMonthFilter;
          }
        } else if (uniqueD.length > 1 && uniqueD[0].length === 10) {
          agenteMonthFilter = uniqueD[0].substring(3, 10);
          agenteCalViewMonth = agenteMonthFilter;
        }
        toast(`✅ Importado com sucesso! ${totalInserted} novos, ${totalUpdated} atualizados${totalNps ? ` • 🔵 ${totalNps} Alerta(s) NPS` : ''}${totalCrmSynced ? ` • 🎯 ${totalCrmSynced} Lead(s) sincronizados no Funil CRM` : ''}.`);
        closeAgenteImportModal();
        loadAgenteData(false);
        if (typeof loadData === 'function') loadData(false);
      } catch (e) {
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerHTML = `⚠️ Erro de comunicação com o servidor: ${esc(e.message || '')}`;
        }
        toast('Erro de comunicação com o servidor', true);
        btn.disabled = false;
        btn.textContent = 'Tentar Novamente';
      }
    }

    // Modal Rápido para Envio / Cópia do Link de NPS (10ª Sessão Paciente Novo)
    function openNpsShareModal(paciente, unidade) {
      const unitSlug = String(unidade || '').toUpperCase().includes('GRANJA') ? 'granja_viana' : 'paulista';
      const unitName = unitSlug === 'granja_viana' ? 'Unidade Granja Viana' : 'Unidade Av. Paulista';

    // Helper para formatar blocos por Data e Unidade nas abas de Convênio do Excel Oficial
    function buildConvenioSheetAoA(cName, convRows, monthLabelUpper = 'OUTUBRO 2026') {
      const HEADER = ['Data', 'Paciente', 'Horário', 'Status Ágil', 'Profissional', 'Especialidade', 'Procedimento', 'Sessão', 'CPF/Carteirinha', 'Guia', 'Ação / Lembrete', 'Situação', 'Validação', 'Observação'];
      const sheetData = [
        [`${cName.toUpperCase()} — ${monthLabelUpper}   |   🔤 A–Z   🕐 HORÁRIO   👤 PROFISSIONAL   📋 STATUS`],
        []
      ];

      if (!convRows.length) {
        sheetData.push(HEADER);
        return sheetData;
      }

      // Agrupar por data em ordem cronológica
      const parseD = (s) => { const p = String(s || '').split('/'); return new Date(+p[2] || 2026, (+p[1] || 10) - 1, +p[0] || 1).getTime() || 0; };
      const uniqueDates = [...new Set(convRows.map(r => r.data))].sort((a, b) => parseD(a) - parseD(b));

      for (const dt of uniqueDates) {
        const dayRows = convRows.filter(r => r.data === dt);
        const paulistaRows = dayRows.filter(r => (r.unidade || '').toUpperCase().includes('PAULISTA')).sort((a, b) => (a.paciente || '').localeCompare(b.paciente || '', 'pt-BR'));
        const granjaRows = dayRows.filter(r => (r.unidade || '').toUpperCase().includes('GRANJA')).sort((a, b) => (a.paciente || '').localeCompare(b.paciente || '', 'pt-BR'));

        sheetData.push([`DATA ${dt} — TOTAL DO DIA: ${dayRows.length} ATENDIMENTO(S)`]);

        if (paulistaRows.length > 0) {
          sheetData.push([`UNIDADE PAULISTA — ${paulistaRows.length} ATENDIMENTO(S)`]);
          sheetData.push(HEADER);
          paulistaRows.forEach(row => {
            sheetData.push([
              row.data, row.paciente, row.horario, row.status_agil, row.profissional,
              row.especialidade, row.procedimento, row.sessao, row.cpf_carteirinha,
              row.guia, row.acao_lembrete, row.situacao, row.validacao, row.observacao
            ]);
          });
          sheetData.push([]);
        }

        if (granjaRows.length > 0) {
          sheetData.push([`UNIDADE GRANJA VIANA — ${granjaRows.length} ATENDIMENTO(S)`]);
          sheetData.push(HEADER);
          granjaRows.forEach(row => {
            sheetData.push([
              row.data, row.paciente, row.horario, row.status_agil, row.profissional,
              row.especialidade, row.procedimento, row.sessao, row.cpf_carteirinha,
              row.guia, row.acao_lembrete, row.situacao, row.validacao, row.observacao
            ]);
          });
          sheetData.push([]);
        }
      }

      return sheetData;
    }

    function renderAgenteView() {
      const container = document.getElementById('view-agente');
      if (!container) return;

      if (!agenteData && agenteLoading) {
        container.innerHTML = `

          </div>
        `;

      }

      if (!agenteData) {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);">
            <div style="font-size:32px;">📊</div>
            <h3 style="margin-top:14px; font-size:16px; color:var(--text);">Nenhum dado encontrado no banco</h3>
            <p style="color:var(--text-3); font-size:13px; margin:6px 0 16px;">Clique no botão abaixo para carregar os agendamentos auditados.</p>
            <button class="btn btn-primary" onclick="loadAgenteData(true)">🔄 Conectar ao Supabase</button>
          </div>
        `;
        return;
      }

      const k = agenteData.kpis || {};
      const rows = agenteData.rows || [];
      const dias = agenteData.dias || [];
      const meses = agenteData.meses || [];
      const convenios = agenteData.convenios || [];
      const totalFiltered = agenteData.total || 0;
      const totalPages = agenteData.totalPages || 1;

      // Ciclo perpétuo de meses: inclui todos os meses do banco + mês passado + mês atual do calendário + próximo mês subsequente
      const monthMap = {};
      meses.forEach(m => { if (m && m.mes) monthMap[m.mes] = m.count || 0; });
      const curCalMes = getCurrentCalendarMonth();
      const prevCalMes = getPrevCalendarMonth(curCalMes);
      if (monthMap[prevCalMes] === undefined) monthMap[prevCalMes] = 0;
      if (monthMap[curCalMes] === undefined) monthMap[curCalMes] = 0;
      if (agenteMonthFilter && agenteMonthFilter !== 'all' && monthMap[agenteMonthFilter] === undefined) {
        monthMap[agenteMonthFilter] = 0;
      }
      const baseForNext = (agenteMonthFilter && agenteMonthFilter !== 'all') ? agenteMonthFilter : curCalMes;
      const nextCalMes = getNextCalendarMonth(baseForNext);
      if (monthMap[nextCalMes] === undefined) monthMap[nextCalMes] = 0;
      const monthList = Object.keys(monthMap).sort((a, b) => {
        const [ma, ya] = a.split('/').map(Number);
        const [mb, yb] = b.split('/').map(Number);
        return (ya * 12 + ma) - (yb * 12 + mb);
      });
      const totalAllMonths = Object.values(monthMap).reduce((acc, v) => acc + (Number(v) || 0), 0);
      const selectedIsoDate = (agenteDayFilter && agenteDayFilter !== 'all' && agenteDayFilter.length === 10)
        ? `${agenteDayFilter.substring(6, 10)}-${agenteDayFilter.substring(3, 5)}-${agenteDayFilter.substring(0, 2)}`
        : '';

      // Mapeamento de Cores Oficiais do Prompt Mestre (Seção 7.1 a 7.6)
      const getRowClass = (r) => {
        const val = (r.validacao || '').toLowerCase();
        const st = (r.status_agil || '').toLowerCase();
        const acao = (r.acao_lembrete || '');
        // 7.1 e 7.6: Quando já validado, o verde de validação prevalece (mantendo o lembrete azul na coluna de ações)
        if (val.includes('finalizado') || val.includes('validado')) return 'row-val-validado';
        // 7.4: Falta justificada sempre em fundo branco, nunca pintar de vermelho, laranja ou verde
        if (val.includes('justificada') || st.includes('justificada')) return 'row-val-falta';
        // 7.5: Não compareceu em vermelho enquanto não houver validação de token ou assinatura
        if (val.includes('não compareceu') || val.includes('nao compareceu') || st.includes('não compareceu') || st.includes('nao compareceu')) return 'row-val-noshow';
        // 7.6: Alerta NPS em Azul para 10ª sessão de pacientes novos
        if (acao.includes('ALERTA NPS')) return 'row-val-nps';
        if (val.includes('cancelado') || val.includes('desmarcado') || st.includes('desmarcado')) return 'row-val-cancelado';
        return 'row-val-pendente';
      };

      const isFaltaJustificadaRow = (r) => {
        const val = (r && r.validacao || '').toLowerCase();
        const st = (r && r.status_agil || '').toLowerCase();
        return val.includes('justificada') || st.includes('justificada');
      };

      const renderCarteirinhaHtml = (r) => {
        const cart = String(r.cpf_carteirinha || '').trim();
        const conv = String(r.convenio || '').trim();
        const isParticular = conv === 'Creabily Particular' || conv === 'SEM CONVÊNIO' || conv === 'Total Pass';
        const cSafe = esc(cart).replace(/'/g, "\\'");
        if (cart && cart !== '—' && cart !== '000') {
          return `
            <span class="carteirinha-badge" onclick="copyCarteirinha('${cSafe}', event)" title="Clique para copiar o número da carteirinha do paciente">
              🪪 Carteirinha: <b>${esc(cart)}</b> 📋
            </span>
            <button type="button" onclick="promptEditCarteirinha('${r.id}', '${cSafe}')" style="border:none;background:none;cursor:pointer;font-size:10px;color:var(--text-3);padding:0 2px;" title="Editar número da carteirinha">✏️</button>
          `;
        }
        if (!isParticular) {
          return `
            <button type="button" class="carteirinha-badge" style="background:#FFFBEB; color:#B45309; border-color:#FCD34D;" onclick="promptEditCarteirinha('${r.id}', '')" title="Clique para informar o número da carteirinha deste paciente">
              🪪 + Informar Carteirinha
            </button>
          `;
        }
        return `<span style="font-size:10.5px; color:var(--text-3);">🪪 Particular / Isento</span>`;
      };

      const renderCrmLeadBadge = (r) => {
        if (!r || !r.crm_lead) return '';
        const st = r.crm_lead.status || 'agendado';
        const stLabels = {
          consulta_realizada: '✅ Consulta Realizada',
          agendado: '📅 Agendado',
          no_show: '⚠️ No-Show',
          conversando: '💬 Em Conversa',
          novo_lead_quiz: '🆕 Novo Lead'
        };
        const lbl = stLabels[st] || st;
        return `
          <span style="display:inline-flex; align-items:center; gap:3px; background:#ECFDF5; color:#047857; border:1px solid #A7F3D0; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700;" title="Paciente vindo do Funil do CRM (${esc(r.crm_lead.name)} • ${esc(r.crm_lead.phone || '')}) — Status sincronizado automaticamente!">
            🎯 Funil CRM: ${esc(lbl)}
          </span>
        `;
      };

      const getAlertBadge = (alerta, r) => {
        const rawParts = alerta ? String(alerta).split(/\s*(?:•|\|)\s*/).filter(x => x && !/^\d+$/.test(x.trim())) : [];
        if (r && isFaltaJustificadaRow(r) && !rawParts.some(p => p.toUpperCase().includes('FALTA JUSTIFICADA'))) {
          rawParts.unshift('⚪ 🚫 FALTA JUSTIFICADA — NÃO VALIDAR TOKEN / ASSINATURA');
        }
        if (!rawParts.length) return '';
        return `<div style="display:flex; flex-direction:column; gap:3px; align-items:flex-start;">` + rawParts.map(item => {
          if (item.toUpperCase().includes('FALTA JUSTIFICADA') || item.toUpperCase().includes('NÃO VALIDAR TOKEN')) {
            return `
              <span class="alerta-falta-justificada" title="Agenda já consta como Falta Justificada — Não é necessário pedir nem validar Token ou Assinatura">
                ${esc(item)}
              </span>
            `;

    // AGENTE DE AUDITORIA MEDSÊNIOR — CONFERÊNCIA E FATURAMENTO MENSAL

    async function loadMedSeniorData(forceToast = false) {
      if (!sessionPassword) return;
      medSeniorLoading = true;
      if (view === 'medsenior' && !medSeniorData) renderMedSeniorView();
      try {
        const r = await api('auditoria-medsenior', {
          action: 'list',
          competencia: medSeniorCompetencia
        });
        if (r.ok && r.data) {
          medSeniorData = r.data;
          const totalGuias = (r.data.rows || []).length;
          // Sempre inicia puxando os dados do Mês Atual do calendário quando abre o app (mantendo o botão do Mês Passado disponível para filtro)
          if (!window._medSeniorMonthInitialized) {
            window._medSeniorMonthInitialized = true;
          }
          const navBadge = document.getElementById('nav-medsenior');
          if (navBadge) navBadge.textContent = totalGuias;
          const tabBadge = document.getElementById('tab-medsenior');
          if (tabBadge) {
            tabBadge.textContent = totalGuias;
            tabBadge.classList.toggle('hidden', !totalGuias);
          }
          if (view === 'medsenior') {
            const pt = document.getElementById('page-title');
            if (pt) pt.textContent = `Agente de Auditoria MedSênior — Faturamento (${formatMonthLabel(medSeniorCompetencia)})`;
          }
          if (forceToast) toast('Auditoria MedSênior atualizada!');
        } else if (forceToast) {
          toast(r.error || 'Erro ao carregar Auditoria MedSênior', true);
        }
      } catch (e) {
        console.warn('Erro ao carregar Auditoria MedSênior:', e);
      } finally {
        medSeniorLoading = false;
        if (view === 'medsenior') renderMedSeniorView();
        else if (view === 'today') render();
      }
    }

    function setMedSeniorCompetencia(comp) {
      medSeniorCompetencia = comp;
      loadMedSeniorData(true);
    }

    function setMedSeniorTab(tab) {
      medSeniorTab = tab;
      renderMedSeniorView();
    }

    function setMedSeniorStatusFilter(st) {
      medSeniorStatusFilter = st;
      renderMedSeniorView();
    }

    function onMedSeniorSearch(val) {
      medSeniorSearch = val || '';
      renderMedSeniorView();
    }

    async function syncMedSeniorWithAgil() {
      if (!sessionPassword) return;
      toast('🔄 Conferindo Guias enviadas com a Planilha Ágil (sem criar guias extras)...');
      try {
        const r = await api('auditoria-medsenior', {
          action: 'sync_agil',
          competencia: medSeniorCompetencia
        });
        if (r.ok) {
          toast(`✅ ${r.data.message || 'Conferência com o Ágil concluída!'}`);
          loadMedSeniorData(false);
        } else {
          toast(r.error || 'Erro ao conferir com o Ágil', true);
        }
      } catch (e) {
        toast('Erro de comunicação ao conferir com o Ágil', true);
      }
    }

    async function dedupeMedSeniorGuias() {
      if (!sessionPassword) return;
      toast('🧹 Verificando e limpando eventuais guias duplicadas...');
      try {
        const r = await api('auditoria-medsenior', {
          action: 'dedupe_guias',
          competencia: medSeniorCompetencia
        });
        if (r.ok) {
          const rem = r.data.removedDuplicatesCount || 0;
          toast(rem > 0 ? `✅ ${rem} guia(s) duplicada(s) removida(s) com sucesso!` : '✅ Nenhuma guia duplicada encontrada — todas as guias são únicas!');
          loadMedSeniorData(false);
        } else {
          toast(r.error || 'Erro ao limpar duplicadas', true);
        }
      } catch (e) {
        toast('Erro ao limpar duplicadas', true);
      }
    }

    async function toggleMedSeniorContratual(id, currentVal) {
      if (!sessionPassword) return;
      try {
        const nextVal = !currentVal;
        const r = await api('auditoria-medsenior', {
          action: 'toggle_contratual',
          id,
          validado_contratual: nextVal,
          status_auditoria: nextVal ? 'APROVADA_MANUAL' : 'AUTOMATICO'
        });
        if (r.ok) {
          toast(nextVal ? '✅ Validação contratual confirmada (R$ 880,00 liberado para faturamento)!' : 'Validação contratual retornada para revisão.');
          loadMedSeniorData(false);
        } else {
          toast(r.error || 'Erro ao atualizar validação', true);
        }
      } catch (e) {
        toast('Erro ao atualizar validação contratual', true);
      }
    }

    async function deleteMedSeniorGuia(id, nome, sadt) {
      const ok = window.confirm(`Deseja realmente excluir a guia SADT ${sadt} de ${nome} da Planilha Espelho?`);
      if (!ok) return;
      const r = await api('auditoria-medsenior', { action: 'delete_guia', id });
      if (r.ok) {
        toast(`🗑️ Guia SADT ${sadt} (${nome}) excluída com sucesso!`);
        closeAgenteImportModal();
        loadMedSeniorData(false);
      } else {
        toast(r.error || 'Erro ao remover guia', true);
      }
    }
