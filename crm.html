    async function convertFileToImageDataUrl(file) {
      const compressCanvasToJpeg = (sourceCanvas, maxDim = 1650, quality = 0.82) => {
        let w = sourceCanvas.width || 1600;
        let h = sourceCanvas.height || 1200;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.max(1, Math.round(w * ratio));
          h = Math.max(1, Math.round(h * ratio));
        }
        const outCanvas = document.createElement('canvas');
        outCanvas.width = w;
        outCanvas.height = h;
        const outCtx = outCanvas.getContext('2d');
        outCtx.fillStyle = '#FFFFFF';
        outCtx.fillRect(0, 0, w, h);
        outCtx.drawImage(sourceCanvas, 0, 0, w, h);
        let dataUrl = outCanvas.toDataURL('image/jpeg', quality);
        if (dataUrl.length > 1400000) {
          dataUrl = outCanvas.toDataURL('image/jpeg', 0.68);
        }
        if (dataUrl.length > 1400000) {
          const smallerW = Math.round(w * 0.78);
          const smallerH = Math.round(h * 0.78);
          const smallCanvas = document.createElement('canvas');
          smallCanvas.width = smallerW;
          smallCanvas.height = smallerH;
          const sCtx = smallCanvas.getContext('2d');
          sCtx.fillStyle = '#FFFFFF';
          sCtx.fillRect(0, 0, smallerW, smallerH);
          sCtx.drawImage(outCanvas, 0, 0, smallerW, smallerH);
          dataUrl = smallCanvas.toDataURL('image/jpeg', 0.65);
        }
        return dataUrl;
      };

      const nameLow = (file.name || '').toLowerCase();
      if (nameLow.endsWith('.pdf')) {
        if (typeof pdfjsLib === 'undefined') {
          throw new Error('Biblioteca PDF.js ainda carregando. Tente novamente em 2 segundos.');
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        return compressCanvasToJpeg(canvas, 1700, 0.84);
      } else {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth || img.width || 1600;
              canvas.height = img.naturalHeight || img.height || 1200;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0);
              resolve(compressCanvasToJpeg(canvas, 1700, 0.84));
            };
            img.onerror = () => reject(new Error('Formato de imagem não suportado. Use PNG, JPG ou PDF.'));
            img.src = reader.result;
          };
          reader.onerror = () => reject(new Error('Falha ao ler imagem'));
          reader.readAsDataURL(file);
        });
      }
    }

    async function handleMedSeniorFilesUpload(fileList) {
      if (!fileList || !fileList.length) return;
      const files = Array.from(fileList);
      const prog = document.getElementById('ms-upload-progress');
      if (prog) prog.classList.remove('hidden');

      let okCount = 0;
      const logs = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (prog) {
          prog.innerHTML = `<div style="font-weight:700; color:#059669; margin-bottom:8px;">⏳ Processando guia ${i + 1} de ${files.length}: ${esc(f.name)}...</div>` + logs.join('');
        }
        try {
          const imageDataUrl = await convertFileToImageDataUrl(f);
          const r = await api('auditoria-medsenior', {
            action: 'ocr_guia',
            competencia: medSeniorCompetencia,
            imageDataUrl,
            fileName: f.name
          });
          if (r.ok && r.data && r.data.extracted) {
            okCount++;
            const ex = r.data.extracted;
            const qtdDatas = (ex.sessoes || []).filter(Boolean).length;
            const dupTag = r.data.wasUpdatedDuplicate ? ' <span style="color:#0284C7;font-weight:700;">(guia já existente atualizada sem duplicar)</span>' : '';
            logs.unshift(`<div style="padding:5px 0; border-bottom:1px solid var(--line); color:#065F46;">✅ <b>${esc(ex.beneficiario)}</b> — SADT <b>${esc(ex.numero_sadt)}</b> (${qtdDatas} datas manuscritas extraídas • Validade: ${esc(ex.validade_guia || '—')})${dupTag}</div>`);
          } else {
            logs.unshift(`<div style="padding:5px 0; border-bottom:1px solid var(--line); color:#DC2626;">⚠️ ${esc(f.name)}: ${esc(r.error || 'Não foi possível extrair os campos')}</div>`);
          }
        } catch (err) {
          logs.unshift(`<div style="padding:5px 0; border-bottom:1px solid var(--line); color:#DC2626;">⚠️ ${esc(f.name)}: ${esc(err.message)}</div>`);
        }
      }

      if (prog) {
        prog.innerHTML = `<div style="font-weight:800; color:#047857; font-size:13.5px; margin-bottom:8px;">🎉 Processamento concluído: ${okCount} de ${files.length} guia(s) SP/SADT auditadas!</div>` + logs.join('');
      }
      toast(`✅ ${okCount} guia(s) SP/SADT lidas e cruzadas com o Ágil!`);
      loadMedSeniorData(false);
    }

    function handleAfrespFatureFileSelect(file) {
      if (!file) return;
      const errEl = document.getElementById('afresp-import-error');
      const prevEl = document.getElementById('afresp-import-preview');
      const btnConfirm = document.getElementById('btn-confirm-afresp-import');
      if (errEl) errEl.classList.add('hidden');

      const fname = file.name || 'lote_fature.xls';
      // Auto-detectar número da remessa ou número do lote Fature pelo nome do arquivo
      const mRem = fname.match(/lote\s*(\d{2,3})/i);
      if (mRem && document.getElementById('afresp-up-remessa')) {
        document.getElementById('afresp-up-remessa').value = mRem[1];
      }
      const mFatureNum = fname.match(/3?(\d{9})\d*_?\d*/);
      if (mFatureNum && document.getElementById('afresp-up-lote-fature')) {
        document.getElementById('afresp-up-lote-fature').value = mFatureNum[1];
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
          let extractedItems = [];
          let detectedLoteFature = '';
          let detectedRemessa = '';

          for (const sheetName of wb.SheetNames) {
            const ws = wb.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
            if (!rows || !rows.length) continue;

            let colMap = null;
            for (let rIdx = 0; rIdx < rows.length; rIdx++) {
              const row = rows[rIdx].map(c => String(c ?? '').trim());
              const nonEmpty = row.filter(Boolean);
              if (!nonEmpty.length) continue;

              const rowJoined = row.join(' ').toLowerCase();
              // Tentar extrair número de lote ou remessa de cabeçalhos superiores
              const mLoteCell = rowJoined.match(/lote\s*(?:no\s*fature)?\s*[:\-]?\s*(\d{7,12})/i);
              if (mLoteCell && !detectedLoteFature) detectedLoteFature = mLoteCell[1];
              const mRemCell = rowJoined.match(/remessa\s*[:\-]?\s*(\d{2,4})/i);
              if (mRemCell && !detectedRemessa) detectedRemessa = mRemCell[1];

              if (!colMap) {
                const idxCart = row.findIndex(h => /carteir|benefici|matricul|associado|codigo.*benef/i.test(h));
                const idxData = row.findIndex(h => /data|dt\.?\s*atend|realiza/i.test(h));
                const idxProc = row.findIndex(h => /procedimento|tratamento|descri|servi|evento/i.test(h));
                if (idxCart >= 0 && (idxData >= 0 || idxProc >= 0)) {
                  colMap = {
                    carteirinha: idxCart,
                    data: idxData,
                    procedimento: idxProc,
                    codigo: row.findIndex(h => /^c[oó]d|tuss|amb/i.test(h)),
                    documento: row.findIndex(h => /doc|guia|senha|fatura/i.test(h)),
                    valor: row.findIndex(h => /valor|vl\.?|total|informado/i.test(h)),
                    modalidade: row.findIndex(h => /modalidade|sigla|anota|tipo/i.test(h))
                  };
                  continue;
                }
              }

              if (colMap) {
                const rawCart = String(row[colMap.carteirinha] || '').trim();
                const rawData = colMap.data >= 0 ? formatCellDate(row[colMap.data]) : '';
                const rawProc = colMap.procedimento >= 0 ? String(row[colMap.procedimento] || '').trim() : '';
                const rawCode = colMap.codigo >= 0 ? String(row[colMap.codigo] || '').trim() : '';
                const rawDoc = colMap.documento >= 0 ? String(row[colMap.documento] || '').trim() : '';
                const rawValStr = colMap.valor >= 0 ? String(row[colMap.valor] || '').replace(/[R$\s]/g, '').replace(/\./g, '').replace(',', '.') : '';
                const rawMod = colMap.modalidade >= 0 ? String(row[colMap.modalidade] || '').trim() : '';

                // Ignorar linhas de rodapé ("Total", etc.)
                if (!rawCart || /^total|resumo|subtotal/i.test(rawCart)) continue;
                if (!/\d{4,}/.test(rawCart)) continue;

                extractedItems.push({
                  documento: rawDoc,
                  carteirinha: rawCart,
                  data_atendimento: rawData,
                  codigo_procedimento: rawCode,
                  procedimento: rawProc || rawCode || 'Sessão Ambulatorial Em Fisioterapia',
                  valor: parseFloat(rawValStr) || 0,
                  modalidade_manual: rawMod,
                  raw_extra: row
                });
              } else {
                // Fallback posicional caso a planilha do Fature não tenha linha de cabeçalho padrão
                const cartCandidate = row.find(c => /^0\d{6,10}(-\d)?$|^\d{8,11}(-\d)?$/.test(c));
                const dateCandidate = row.map(c => formatCellDate(c)).find(Boolean);
                if (cartCandidate && dateCandidate) {
                  const procCandidate = row.find(c => c !== cartCandidate && /fisio|pilates|rpg|drenagem|bioimped|nutri|psico|50000|41301|consulta|sess/i.test(c)) || '50000160 - Sessão Ambulatorial Em Fisioterapia';
                  extractedItems.push({
                    documento: '',
                    carteirinha: cartCandidate,
                    data_atendimento: dateCandidate,
                    codigo_procedimento: '',
                    procedimento: procCandidate,
                    valor: 0,
                    modalidade_manual: ''
                  });
                }
              }
            }
          }

          if (!extractedItems.length) {
            if (errEl) {
              errEl.textContent = 'Não foi possível localizar linhas de procedimentos (Carteirinha + Data/Procedimento) neste arquivo. Verifique se é a listagem do Fature/Orizon.';
              errEl.classList.remove('hidden');
            }
            if (btnConfirm) btnConfirm.disabled = true;
            return;
          }

          if (detectedLoteFature && document.getElementById('afresp-up-lote-fature') && !document.getElementById('afresp-up-lote-fature').value) {
            document.getElementById('afresp-up-lote-fature').value = detectedLoteFature;
          }
          if (detectedRemessa && document.getElementById('afresp-up-remessa')) {
            document.getElementById('afresp-up-remessa').value = detectedRemessa;
          }

          afrespPendingFatureUpload = {
            nome_arquivo: fname,
            items: extractedItems
          };

          if (prevEl) {
            prevEl.classList.remove('hidden');
            prevEl.innerHTML = `
              <div style="font-weight:800; color:#0369A1; margin-bottom:6px;">
                ✅ Arquivo lido com sucesso: ${esc(fname)} (${extractedItems.length} procedimentos identificados)
              </div>
              <div style="font-size:11.5px; color:var(--text-2); margin-bottom:8px;">
                Amostra das primeiras 5 linhas (zeros à esquerda preservados):
              </div>
              <table style="width:100%; border-collapse:collapse; font-size:11.5px;">
                <thead>
                  <tr style="background:#E0F2FE; color:#0369A1;">
                    <th style="padding:4px 6px; text-align:left;">Carteirinha</th>
                    <th style="padding:4px 6px; text-align:left;">Data</th>
                    <th style="padding:4px 6px; text-align:left;">Procedimento</th>
                  </tr>
                </thead>
                <tbody>
                  ${extractedItems.slice(0, 5).map(it => `
                    <tr style="border-bottom:1px solid var(--line);">
                      <td style="padding:4px 6px; font-family:monospace; font-weight:700;">${esc(it.carteirinha)}</td>
                      <td style="padding:4px 6px;">${esc(it.data_atendimento)}</td>
                      <td style="padding:4px 6px;">${esc(it.procedimento)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `;
          }
          if (btnConfirm) btnConfirm.disabled = false;
        } catch (err) {
          if (errEl) {
            errEl.textContent = 'Erro ao ler planilha: ' + err.message;
            errEl.classList.remove('hidden');
          }
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function submitAfrespFatureImport() {
      if (!afrespPendingFatureUpload || !afrespPendingFatureUpload.items.length) return;
      const btn = document.getElementById('btn-confirm-afresp-import');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Cruzando com Fluxo Diário...'; }

      const remessa = (document.getElementById('afresp-up-remessa')?.value || '70').trim();
      const loteFature = (document.getElementById('afresp-up-lote-fature')?.value || '').trim();
      const dataLote = (document.getElementById('afresp-up-data')?.value || '').trim();

      try {
        const r = await api('auditoria-afresp', {
          action: 'import_fature_lote',
          remessa,
          numero_lote_fature: loteFature || 'NOVO LOTE',
          data_lote: dataLote,
          nome_arquivo: afrespPendingFatureUpload.nome_arquivo,
          items: afrespPendingFatureUpload.items
        });
        if (r.ok && r.data) {
          afrespRemessa = remessa;
          afrespData = r.data;
          closeAfrespModal();
          const l = r.data.loteAtual || {};
          toast(`🎉 Lote AFRESP ${remessa} processado! ${l.identificados || 0} pacientes identificados e ${l.alertas_novo_bloco || 0} alertas de 1ª sessão!`);
          renderAfrespView();
        } else {
          toast(r.error || 'Erro ao importar lote Fature', true);
          if (btn) { btn.disabled = false; btn.textContent = '⚡ Cruzar com Fluxo Diário e Gerar Lote'; }
        }
      } catch (e) {
        toast('Erro de conexão ao importar lote', true);
        if (btn) { btn.disabled = false; btn.textContent = '⚡ Cruzar com Fluxo Diário e Gerar Lote'; }
      }
    }

    function exportAfrespExcel() {
      if (!afrespData || !afrespData.itens || !afrespData.itens.length) {
        toast('Nenhum item carregado neste lote para exportar.', true);
        return;
      }
      if (typeof XLSX === 'undefined') {
        toast('Biblioteca Excel carregando, tente em 2 segundos.', true);
        return;
      }

      const lote = afrespData.loteAtual || {};
      const rem = lote.remessa || afrespRemessa;
      const numFature = lote.numero_lote_fature || '';
      const itens = afrespData.itens || [];

      // Aba 1: Planilha Fature Corrigida (com Nome do Paciente, Modalidade e Alerta de Novo Bloco)
      const sheet1Rows = itens.map((it, idx) => ({
        'Nº Linha': idx + 1,
        'Remessa': it.remessa,
        'Nº Lote Fature': it.numero_lote_fature || numFature,
        'Documento / Guia': it.documento || '',
        'Nº Carteirinha AFRESP': String(it.carteirinha || ''), // Mantém zeros à esquerda
        'NOME DO PACIENTE (Fluxo Diário)': it.paciente || '⚠️ PENDENTE DE CONFERÊNCIA MANUAL',
        'Data do Atendimento': it.data_atendimento || '',
        'Código Procedimento': it.codigo_procedimento || '',
        'Procedimento (Fature)': it.procedimento || '',
        'Sigla Modalidade': it.modalidade_sigla || '',
        'Modalidade Validada': it.modalidade_nome || '',
        'Sessão no Bloco': it.sessao_fluxo || '',
        'Alerta 1ª Sessão / Novo Bloco': it.is_novo_bloco ? '🚨 1ª SESSÃO NOVO BLOCO — PUXAR PEDIDO MÉDICO NOVO' : 'Ciclo em andamento',
        'Status Pedido Médico Novo': it.is_novo_bloco ? (it.pedido_novo_conferido ? 'CONFERIDO / ANEXADO' : 'PENDENTE DE CONFERÊNCIA') : '—',
        'Pedido Anterior / Guia': it.data_pedido_anterior || '',
        'Valor (R$)': Number(it.valor || 0),
        'Status do Cruzamento': it.status_cruzamento || '',
        'Observação / Auditoria': it.motivo_pendencia || 'OK'
      }));

      // Aba 2: Alertas de Novos Pedidos Médicos (1ª Sessão de Novo Bloco) e Pendências
      const alertasEPendencias = itens
        .filter(it => it.is_novo_bloco || !it.paciente || it.status_cruzamento === 'PENDENTE_REVISAO' || it.status_cruzamento === 'SEM_CORRESPONDENCIA')
        .map(it => ({
          'Tipo de Alerta': !it.paciente ? '⚠️ PENDÊNCIA DE IDENTIFICAÇÃO' : '🚨 1ª SESSÃO DE NOVO BLOCO (PEDIDO MÉDICO NOVO)',
          'Nº Carteirinha AFRESP': String(it.carteirinha || ''),
          'Nome do Paciente': it.paciente || 'NÃO IDENTIFICADO (Conferir manualmente)',
          'Data do Atendimento': it.data_atendimento || '',
          'Sigla': it.modalidade_sigla || '',
          'Modalidade': it.modalidade_nome || '',
          'Sessão': it.sessao_fluxo || '',
          'Pedido Anterior': it.data_pedido_anterior || '—',
          'Ação Necessária': !it.paciente
            ? (it.motivo_pendencia || 'Conferir nome no fluxo diário sem suposição')
            : 'Conferir e anexar o pedido médico atualizado (data posterior ao bloco anterior)',
          'Status Documental': it.pedido_novo_conferido ? 'CONFERIDO' : 'PENDENTE'
        }));

      const wb = XLSX.utils.book_new();
      const ws1 = XLSX.utils.json_to_sheet(sheet1Rows);
      const ws2 = XLSX.utils.json_to_sheet(alertasEPendencias.length ? alertasEPendencias : [{ 'Status': 'Nenhuma pendência ou alerta pendente neste lote.' }]);

      XLSX.utils.book_append_sheet(wb, ws1, `Fature Corrigido Lote ${rem}`);
      XLSX.utils.book_append_sheet(wb, ws2, `Alertas e Pendencias`);

      const fileName = `Fature_AFRESP_Corrigido_Remessa_${rem}${numFature ? '_' + numFature : ''}.xlsx`;
      XLSX.writeFile(wb, fileName);
      toast(`📥 Planilha exportada: ${fileName}`);
    }

    // MÓDULO EXECUTIVO: FECHAMENTO PROFISSIONAIS & BPO — EXCLUSIVO DIRETORIA

    function calcImpostosRPA(profOrBruto) {
      if (profOrBruto && typeof profOrBruto === 'object') {
        const p = profOrBruto;
        if ((p.rpa_valor_liquido !== null && p.rpa_valor_liquido !== undefined && Number(p.rpa_valor_liquido) > 0) || p.tipo_documento === 'ISENTO_RPA') {
          const bruto = Number(p.rpa_valor_bruto || p.valor_repasse_confirmado || 0);
          const inss = Number(p.rpa_inss || 0);
          const irrf = Number(p.rpa_irrf || 0);
          const iss = Number(p.rpa_iss || 0);
          const liquido = Number(p.rpa_valor_liquido || p.valor_repasse_confirmado || 0);
          return {
            bruto,
            inss,
            irrf,
            iss,
            baseIrrf: Math.max(0, Number((bruto - inss).toFixed(2))),
            liquido,
            recibo: p.rpa_numero_recibo || '',
            cpf: p.rpa_cpf || '',
            inssInsc: p.rpa_inss_insc || '',
            isOficial: Boolean(p.rpa_numero_recibo),
            isIsento: p.tipo_documento === 'ISENTO_RPA'
          };
        }
        profOrBruto = p.valor_repasse_confirmado;
      }
      const val = Number(profOrBruto) || 0;
      const tetoInss = 8475.55;
      const inss = Number((Math.min(val, tetoInss) * 0.11).toFixed(2));
      const baseIrrf = Math.max(0, val - inss);
      let irrf = 0;
      if (val > 5000) {
        if (baseIrrf > 4664.68) irrf = (baseIrrf * 0.275) - 908.73;
        else if (baseIrrf > 3751.05) irrf = (baseIrrf * 0.225) - 675.49;
        else if (baseIrrf > 2826.65) irrf = (baseIrrf * 0.15) - 394.16;
        else if (baseIrrf > 2428.80) irrf = (baseIrrf * 0.075) - 182.16;
      }
      irrf = Math.max(0, Number(irrf.toFixed(2)));
      const liquido = Number((val - inss - irrf).toFixed(2));
      return { bruto: val, inss, irrf, iss: 0, baseIrrf: Number(baseIrrf.toFixed(2)), liquido, recibo: '', cpf: '', inssInsc: '', isOficial: false, isIsento: false };
    }

      const data = fechamentoData || { profissionais: [], regras: [], bpo: {}, recibos: [], compCounts: {} };
      const allProfs = data.profissionais || [];
      const allRegras = data.regras || [];
      const allRecibos = data.recibos || [];
      const bpo = data.bpo || {};
      const compCounts = data.compCounts || {};
      const reciboByProfId = {};
      allRecibos.forEach(rc => {
        if (rc.profissional_id) reciboByProfId[rc.profissional_id] = rc;
      });

      // Filtro por unidade e busca

        if (!q) return true;
        return `${p.profissional} ${p.nome_curto} ${p.funcao} ${p.unidade}`.toLowerCase().includes(q);
      });

      // Métricas consolidadas
      const profsPaulista = allProfs.filter(p => p.unidade === 'Paulista');
      const profsGranja = allProfs.filter(p => p.unidade === 'Granja/Jandira');

      const sumRepasseAll = allProfs.reduce((s, p) => s + (Number(p.valor_repasse_confirmado) || 0), 0);

      const sumCapAll = allProfs.reduce((s, p) => s + (Number(p.capacidade_agenda) || 120), 0);
      const ocupacaoPct = sumCapAll > 0 ? Math.min(100, Math.round((sumAtendAll / sumCapAll) * 100)) : 0;

      let sumLiquidoRpaAll = 0;
      allProfs.forEach(p => {

      const impValor = fatBruto * (impPct / 100);
      const recLiquida = fatBruto - impValor;
      const margemContrib = recLiquida - sumRepasseAll;
      const fixoPaulista = Number(bpo.custos_fixos_paulista) || 36459;
      const fixoGranja = Number(bpo.custos_fixos_granja) || 18500;
      const varOper = Number(bpo.custos_variaveis_operacionais) || 10000;

    function parseProsoftAccountingPage(rawText) {
      const text = String(rawText || '').replace(/\s+/g, ' ');
      const parseBrl = (s) => {
        if (!s) return 0;
        const clean = String(s).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
        const n = parseFloat(clean);
        return Number.isFinite(n) ? n : 0;
      };

      const isRpa = /AUT[ÔO]NOMO|R\s*P\s*A|SERVI[ÇC]O\s+PRESTADO/i.test(text);
      const isClt = /SAL[ÁA]RIO\s+MENSAL|Vencimentos|L\s*[ÍI]\s*Q\s*U\s*I\s*D\s*O\s+A\s+R\s*E\s*C\s*E\s*B\s*E\s*R/i.test(text);

      const cpfMatch = text.match(/\b(\d{3}\.\d{3}\.\d{3}-\d{2})\b/);
      const cpf = cpfMatch ? cpfMatch[1] : '';

      const inssInscMatch = text.match(/INSS\.+:\s*(\d{10,12})/i) || text.match(/\b(\d{11})\s+Conta-FGTS/i);
      const inssInsc = inssInscMatch ? inssInscMatch[1] : '';

      const rgMatch = text.match(/RG\.+:\s*([0-9.\-X+]+)/i);
      const rg = rgMatch ? rgMatch[1].trim() : '';

      const recNumMatch = text.match(/\b(000\d{3})\b/) || text.match(/\b(000\d{2})\b/);
      const reciboNum = recNumMatch ? recNumMatch[1] : '';

      if (isRpa) {
        const liqImpMatch = text.match(/import[âa]ncia\s+de\s+R\$\s*([\d.,]+)/i);
        const issMatch = text.match(/ISS\s+retido\s+([\d.,]+)/i);
        const inssValMatch = text.match(/INSS\s+Segurado\.?\s+([\d.,]+)/i);

        // Extract all monetary numbers in format X.XXX,XX or XXX,XX
        const allMoneys = (text.match(/\b\d{1,3}(?:\.\d{3})*,\d{2}\b/g) || []).map(parseBrl);
        let bruto = 0;
        for (const m of allMoneys) {
          if (m > bruto && m < 50000) bruto = m;
        }
        const inss = inssValMatch ? parseBrl(inssValMatch[1]) : 0;
        const iss = issMatch ? parseBrl(issMatch[1]) : 0;
        let liquido = liqImpMatch ? parseFloat(String(liqImpMatch[1]).replace(',', '.')) : 0;
        if (!liquido && bruto > 0) {
          const candidates = allMoneys.filter(v => v > 0 && v < bruto && Math.abs(v - inss) > 1 && Math.abs(v - iss) > 1);
          if (candidates.length) liquido = Math.max(...candidates);
        }
        let irrf = 0;
        if (bruto > 0 && liquido > 0) {
          irrf = Math.max(0, Number((bruto - liquido - inss - iss).toFixed(2)));
        }

        let nome = '';
        const nameMatch = text.match(/INSS\s+Segurado\.?\s+[\d.,]+(?:\s+0,00)*\s+([A-ZÀ-Ú]{2,}(?:\s+[A-ZÀ-Ú]{2,}){1,6})\s+[\d.,]+/);
        if (nameMatch) nome = nameMatch[1].trim();

        return {
          tipo_documento: 'RPA',
          rpa_numero_recibo: reciboNum,
          rpa_cpf: cpf,
          rpa_rg: rg,
          rpa_inss_insc: inssInsc,
          rpa_valor_bruto: bruto,
          rpa_irrf: irrf,
          rpa_iss: iss,
          rpa_inss: inss,
          rpa_outros_descontos: 0,
          rpa_valor_liquido: liquido,
          nome_completo: nome
        };
      }

      if (isClt) {
        const resumoMatch = text.match(/Total\s+de\s+Descontos\s+[\d.,]+\s+[\d.,]+\s+([\d.,]+)\s+([\d.,]+)/i);
        const liqMatch = text.match(/A\s*R\s*E\s*C\s*E\s*B\s*E\s*R\s+([\d.,]+)/i);
        const inssCltMatch = text.match(/101\s+I\.N\.S\.S\s+[\d.,]+\s+([\d.,]+)/i);
        const nomeCltMatch = text.match(/Chapa\s+Nome\s+([A-ZÀ-Ú]{2,}(?:\s+[A-ZÀ-Ú]{2,}){1,6})\s+Compet[êe]ncia/i);

        const bruto = resumoMatch ? parseBrl(resumoMatch[1]) : 0;
        const totDesc = resumoMatch ? parseBrl(resumoMatch[2]) : 0;
        const liquido = liqMatch ? parseBrl(liqMatch[1]) : Math.max(0, Number((bruto - totDesc).toFixed(2)));
        const inss = inssCltMatch ? parseBrl(inssCltMatch[1]) : 0;
        const outros = Math.max(0, Number((totDesc - inss).toFixed(2)));

        return {
          tipo_documento: 'CLT',
          rpa_numero_recibo: reciboNum,
          rpa_cpf: cpf,
          rpa_rg: rg,
          rpa_inss_insc: inssInsc,
          rpa_valor_bruto: bruto,
          rpa_irrf: 0,
          rpa_iss: 0,
          rpa_inss: inss,
          rpa_outros_descontos: outros,
          rpa_valor_liquido: liquido,
          nome_completo: nomeCltMatch ? nomeCltMatch[1].trim() : ''
        };
      }

      return null;
    }

    function matchProfissionalByText(rawText, parsedMeta = null) {
      const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const hay = norm(rawText);
      const allProfs = (fechamentoData && fechamentoData.profissionais) || [];

      if (parsedMeta && parsedMeta.rpa_cpf) {
        const byCpf = allProfs.find(p => p.rpa_cpf && p.rpa_cpf.replace(/\D/g, '') === parsedMeta.rpa_cpf.replace(/\D/g, ''));
        if (byCpf) return byCpf;
      }

      let bestProf = null;
      let bestScore = 0;

      for (const p of allProfs) {
        const cleanProf = norm(p.profissional).replace(/\(.*?\)/g, '').replace(/^(dra?\.?|fisioterapeuta|nutricionista|psicologa)\s+/i, '').trim();
        const cleanShort = norm(p.nome_curto).replace(/\(.*?\)/g, '').replace(/^(dra?\.?)\s+/i, '').trim();
        const parts = cleanProf.split(/\s+/).filter(w => w.length >= 3 && !['dos', 'das', 'silva', 'santos'].includes(w));
        const allWords = cleanProf.split(/\s+/).filter(w => w.length >= 3);

        let score = 0;
        if (cleanProf && hay.includes(cleanProf)) score += 120;
        if (cleanShort && hay.includes(cleanShort)) score += 90;
        if (allWords.length >= 2 && hay.includes(allWords[0]) && hay.includes(allWords[allWords.length - 1])) score += 80;
        for (const w of parts) {
          if (hay.includes(w)) score += 35;
        }

        if (score > bestScore) {
          bestScore = score;
          bestProf = p;
        }
      }
      return bestScore >= 60 ? bestProf : null;
    }

    function extractCandidateNameFromText(rawText, fallbackLabel) {
      const parsed = parseProsoftAccountingPage(rawText);

      const text = String(rawText || '');
      const m = text.match(/(?:Funcion[áa]rio|Colaborador|Empregado|Nome|Profissional|Benefici[áa]rio)[:\s\-]+([A-ZÀ-Ú][A-Za-zÀ-ú]+(?:\s+[A-ZÀ-Úa-zà-ú]+){1,4})/i);
      if (m && m[1]) return m[1].trim().slice(0, 60);
      return fallbackLabel || 'Colaborador CLT / Contabilidade';
    }

    async function handleContabilidadeUpload(files, forcedProfId = null) {
      if (!files || !files.length) return;
      const fileList = Array.from(files);
      const statusEl = document.getElementById('contab-upload-status');
      if (statusEl) statusEl.textContent = `⏳ Processando ${fileList.length} arquivo(s) da Contabilidade (Paulista, Granja e CLT)...`;
      toast(`✂️ Lendo ${fileList.length} arquivo(s) da Contabilidade, extraindo valores de RPA/Holerite e recortando páginas...`);

      const allProfs = (fechamentoData && fechamentoData.profissionais) || [];
      let totalMatched = 0;
      let totalExtras = 0;

      for (const file of fileList) {
        const ext = file.name.split('.').pop().toLowerCase();

        // 1. ARQUIVO PDF MULTI-PÁGINAS DA CONTABILIDADE (RPA PAULISTA, RPA GRANJA OU HOLERITES CLT)
        if (ext === 'pdf' && window.pdfjsLib) {
          try {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const arrayBuf = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuf }).promise;

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
              const page = await pdf.getPage(pageNum);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(it => it.str).join(' ');
              const parsedRpa = parseProsoftAccountingPage(pageText);

              const viewport = page.getViewport({ scale: 1.55 });
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              const ctx = canvas.getContext('2d');
              await page.render({ canvasContext: ctx, viewport }).promise;
              const imgDataUrl = canvas.toDataURL('image/jpeg', 0.85);

              const matchedProf = forcedProfId
                ? allProfs.find(x => Number(x.id) === Number(forcedProfId))
                : (parsedRpa && parsedRpa.tipo_documento === 'CLT' ? null : matchProfissionalByText(pageText, parsedRpa));

              if (matchedProf) {
                await api('fechamento-profissionais', {
                  action: 'save_recibo_recortado',
                  competencia: fechamentoCompetencia,
                  profissional_id: matchedProf.id,
                  profissional: matchedProf.profissional,
                  nome_curto: matchedProf.nome_curto,
                  unidade: matchedProf.unidade,
                  origem_arquivo: `${file.name} (Pág. ${pageNum})`,
                  pagina_aba_origem: parsedRpa && parsedRpa.rpa_numero_recibo ? `RPA Nº ${parsedRpa.rpa_numero_recibo}` : `Pág. ${pageNum}`,
                  conteudo_texto: pageText.slice(0, 2000),
                  imagem_data_url: imgDataUrl,
                  ...(parsedRpa || {}),
                  append_if_exists: false
                });
                totalMatched++;
              } else {
                const candName = extractCandidateNameFromText(pageText, `Recibo CLT/Extra — ${file.name} (Pág. ${pageNum})`);
                const isGranjaFile = /filial|granja|jandira|0002-95/i.test(file.name + ' ' + pageText);
                await api('fechamento-profissionais', {
                  action: 'save_recibo_recortado',
                  competencia: fechamentoCompetencia,
                  profissional_id: null,
                  profissional: candName,
                  nome_curto: candName,
                  unidade: isGranjaFile ? 'Granja/Jandira' : 'Paulista',
                  origem_arquivo: `${file.name} (Pág. ${pageNum})`,
                  pagina_aba_origem: parsedRpa && parsedRpa.rpa_numero_recibo ? `Holerite Reg. ${parsedRpa.rpa_numero_recibo}` : `Pág. ${pageNum}`,
                  conteudo_texto: pageText.slice(0, 2000),
                  imagem_data_url: imgDataUrl,
                  ...(parsedRpa || {})
                });
                totalExtras++;
              }
            }
          } catch (pdfErr) {
            console.error('Erro PDF Contabilidade:', pdfErr);
          }
        }
        // 2. PLANILHA EXCEL MULTI-ABAS OU TABELA GERAL DA CONTABILIDADE
        else if (['xlsx', 'xls', 'csv'].includes(ext) && window.XLSX) {
          try {
            const arrayBuf = await file.arrayBuffer();
            const wb = window.XLSX.read(arrayBuf, { type: 'array' });

            for (const sheetName of wb.SheetNames) {
              const ws = wb.Sheets[sheetName];
              const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
              if (!rows || !rows.length) continue;

              const sheetText = sheetName + ' ' + rows.slice(0, 25).map(r => r.join(' ')).join(' ');
              const matchedBySheet = forcedProfId
                ? allProfs.find(x => Number(x.id) === Number(forcedProfId))
                : matchProfissionalByText(sheetText);

              if (matchedBySheet && (wb.SheetNames.length > 1 || forcedProfId)) {
                const nonEmptyRows = rows.filter(r => r.some(c => String(c).trim() !== '')).slice(0, 45);
                const htmlTable = `<table style="width:100%;border-collapse:collapse;font-size:11px;">` +
                  nonEmptyRows.map((r, idx) => `<tr>` + r.slice(0, 8).map(c => `<${idx === 0 ? 'th' : 'td'} style="border:1px solid #CBD5E1;padding:5px 8px;">${esc(String(c ?? ''))}</${idx === 0 ? 'th' : 'td'}>`).join('') + `</tr>`).join('') +
                  `</table>`;

                await api('fechamento-profissionais', {
                  action: 'save_recibo_recortado',
                  competencia: fechamentoCompetencia,
                  profissional_id: matchedBySheet.id,
                  profissional: matchedBySheet.profissional,
                  nome_curto: matchedBySheet.nome_curto,
                  unidade: matchedBySheet.unidade,
                  origem_arquivo: `${file.name} (${sheetName})`,
                  conteudo_html: htmlTable,
                  append_if_exists: true
                });
                totalMatched++;
              } else {
                // Procura linha por linha caso seja uma planilha única com todos os profissionais
                const headerRow = rows[0] || [];
                let matchedAnyRow = false;
                for (let rIdx = 1; rIdx < rows.length; rIdx++) {
                  const row = rows[rIdx];
                  const rowStr = row.join(' ');
                  if (!rowStr.trim()) continue;
                  const profRow = matchProfissionalByText(rowStr);
                  if (profRow) {
                    const htmlSingle = `<table style="width:100%;border-collapse:collapse;font-size:11px;">` +
                      `<tr>${headerRow.slice(0, 8).map(h => `<th style="border:1px solid #CBD5E1;padding:6px;background:#F1F5F9;">${esc(String(h || ''))}</th>`).join('')}</tr>` +
                      `<tr>${row.slice(0, 8).map(c => `<td style="border:1px solid #CBD5E1;padding:6px;font-weight:700;">${esc(String(c ?? ''))}</td>`).join('')}</tr>` +
                      `</table>`;
                    await api('fechamento-profissionais', {
                      action: 'save_recibo_recortado',
                      competencia: fechamentoCompetencia,
                      profissional_id: profRow.id,
                      profissional: profRow.profissional,
                      nome_curto: profRow.nome_curto,
                      unidade: profRow.unidade,
                      origem_arquivo: `${file.name} (Linha ${rIdx + 1})`,
                      conteudo_html: htmlSingle,
                      append_if_exists: true
                    });
                    totalMatched++;
                    matchedAnyRow = true;
                  }
                }
                if (!matchedAnyRow && rows.length > 1) {
                  const nonEmptyRows = rows.filter(r => r.some(c => String(c).trim() !== '')).slice(0, 45);
                  const htmlTable = `<table style="width:100%;border-collapse:collapse;font-size:11px;">` +
                    nonEmptyRows.map((r, idx) => `<tr>` + r.slice(0, 8).map(c => `<${idx === 0 ? 'th' : 'td'} style="border:1px solid #CBD5E1;padding:5px 8px;">${esc(String(c ?? ''))}</${idx === 0 ? 'th' : 'td'}>`).join('') + `</tr>`).join('') +
                    `</table>`;
                  const candName = extractCandidateNameFromText(sheetText, `${sheetName} (${file.name})`);
                  await api('fechamento-profissionais', {
                    action: 'save_recibo_recortado',
                    competencia: fechamentoCompetencia,
                    profissional_id: null,
                    profissional: candName,
                    nome_curto: candName,
                    unidade: file.name.toLowerCase().includes('granja') ? 'Granja/Jandira' : 'Paulista',
                    origem_arquivo: `${file.name} (${sheetName})`,
                    conteudo_html: htmlTable
                  });
                  totalExtras++;
                }
              }
            }
          } catch (xlErr) {
            console.error('Erro Excel Contabilidade:', xlErr);
          }
        }
        // 3. IMAGEM PNG / JPG
        else if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
          const dataUrl = await new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.onerror = rej;
            reader.readAsDataURL(file);
          });
          const matchedProf = forcedProfId
            ? allProfs.find(x => Number(x.id) === Number(forcedProfId))
            : matchProfissionalByText(file.name);
          if (matchedProf) {
            await api('fechamento-profissionais', {
              action: 'save_recibo_recortado',
              competencia: fechamentoCompetencia,
              profissional_id: matchedProf.id,
              profissional: matchedProf.profissional,
              nome_curto: matchedProf.nome_curto,
              unidade: matchedProf.unidade,
              origem_arquivo: file.name,
              imagem_data_url: dataUrl,
              append_if_exists: true
            });
            totalMatched++;
          } else {
            await api('fechamento-profissionais', {
              action: 'save_recibo_recortado',
              competencia: fechamentoCompetencia,
              profissional_id: null,
              profissional: file.name.replace(/\.[^.]+$/, ''),
              nome_curto: file.name.replace(/\.[^.]+$/, ''),
              unidade: 'Paulista',
              origem_arquivo: file.name,
              imagem_data_url: dataUrl
            });
            totalExtras++;
          }
        }
      }

      await loadFechamentoData(false);
      toast(`✅ ${fileList.length} arquivo(s) processado(s): ${totalMatched} vinculado(s) aos profissionais + ${totalExtras} recibo(s) CLT/extra recortado(s)!`);
    }

    async function handleBpoSheetImport(file) {
      if (!file || !window.XLSX) return;
      toast('📥 Lendo planilha do BPO Financeiro...');
      try {
        const buf = await file.arrayBuffer();
        const wb = window.XLSX.read(buf, { type: 'array' });
        let fat = null, impPct = null, fixoP = null, fixoG = null, varOp = null;

        const parseNum = (v) => {
          if (typeof v === 'number') return v;
          const s = String(v || '').replace(/[R$\s%]/g, '').replace(/\./g, '').replace(',', '.');
          const n = parseFloat(s);
          return Number.isFinite(n) ? Math.abs(n) : null;
        };

        for (const sName of wb.SheetNames) {
          const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sName], { header: 1, defval: '' });
          for (const r of rows) {
            const line = r.map(x => String(x || '')).join(' ').toLowerCase();
            const nums = r.map(parseNum).filter(n => n !== null && n > 0);
            if (!nums.length) continue;
            const val = nums[nums.length - 1];

            if ((line.includes('faturamento bruto') || line.includes('receita bruta')) && val > 20000) fat = val;
            else if ((line.includes('imposto') || line.includes('nota fiscal') || line.includes('simples') || line.includes('iss')) && val <= 35) impPct = val;
            else if ((line.includes('imposto') || line.includes('nota fiscal')) && val > 5000 && fat) impPct = Number(((val / fat) * 100).toFixed(1));
            else if (line.includes('fixo') && line.includes('paulista') && val > 1000) fixoP = val;
            else if (line.includes('fixo') && (line.includes('granja') || line.includes('jandira')) && val > 1000) fixoG = val;
            else if ((line.includes('variav') || line.includes('operacion') || line.includes('bpo')) && val > 500) varOp = val;
          }
        }

        if (fat) document.getElementById('bpo-fat-bruto').value = fat;
        if (impPct) document.getElementById('bpo-imp-pct').value = impPct;
        if (fixoP) document.getElementById('bpo-fixo-paulista').value = fixoP;
        if (fixoG) document.getElementById('bpo-fixo-granja').value = fixoG;
        if (varOp) document.getElementById('bpo-var-oper').value = varOp;

        await saveBpoParameters();
        toast('✅ Planilha do BPO importada e parâmetros atualizados!');
      } catch (e) {
        toast('Erro ao ler planilha do BPO: ' + e.message, true);
      }
    }

    // =========================================================
    // EXPORTAÇÃO EXCEL INDIVIDUAL (.XLSX) POR PROFISSIONAL (3 ABAS)
    // =========================================================
    function exportProfissionalExcel(profId) {
      if (typeof XLSX === 'undefined') { toast('Biblioteca Excel ainda carregando...', true); return; }
      const allProfs = (fechamentoData && fechamentoData.profissionais) || [];
      const p = allProfs.find(x => Number(x.id) === Number(profId));
      if (!p) return;

      const rep = Number(p.valor_repasse_confirmado) || 0;
      const rpa = calcImpostosRPA(p);
      const wb = XLSX.utils.book_new();

      const resumoRows = [
        ['CREABILY • FECHAMENTO INDIVIDUAL DE HONORÁRIOS', fechamentoCompetencia],
        ['Profissional', p.profissional],
        ['Nome Curto', p.nome_curto],
        ['Especialidade / Função', p.funcao],
        ['Unidade', p.unidade],
        ['Nº Recibo RPA Contabilidade', rpa.numero_recibo || '-'],
        ['CPF', rpa.cpf || '-'],
        ['Atendimentos Registrados', Number(p.atendimentos_total) || 0],
        ['Finalizados', Number(p.finalizados) || 0],
        ['Não Compareceu (Pago)', Number(p.nao_compareceu) || 0],
        ['Capacidade da Agenda', Number(p.capacidade_agenda) || 120],
        ['Repasse Particular (R$)', Number(p.valor_particular) || 0],
        ['Repasse Convênios (R$)', Number(p.valor_convenio) || 0],
        ['Repasse Bruto Confirmado (R$)', rep],
        ['INSS Retido RPA (R$)', rpa.inss],
        ['IRRF Retido RPA (R$)', rpa.irrf],
        ['ISS Retido RPA (R$)', rpa.iss || 0],
        ['Líquido Pós-RPA Oficial (R$)', rpa.liquido],
        ['Status de Auditoria', p.status_auditoria || 'CONFERIDO'],
        ['Observação de Auditoria', p.observacao_auditoria || ''],
        [],
        ['COMPOSIÇÃO POR MODALIDADE', 'CONVÊNIO', 'QTD', 'FINALIZADOS', 'FALTAS PAGAS', 'UNITÁRIO (R$)', 'TOTAL (R$)'],
        ...(Array.isArray(p.composicao_json) ? p.composicao_json : []).map(c => [
          c.modalidade, c.convenio || '', Number(c.qtd) || 0, Number(c.finalizados ?? c.qtd) || 0, Number(c.faltas) || 0, Number(c.unitario) || 0, Number(c.total) || 0
        ])
      ];
      const wsResumo = XLSX.utils.aoa_to_sheet(resumoRows);
      XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo_Profissional');

      const atendRows = [
        ['Data', 'Paciente', 'Convênio', 'Procedimento / Modalidade', 'Status', 'Repasse Unitário (R$)', 'Observação'],
        ...(Array.isArray(p.atendimentos_json) ? p.atendimentos_json : []).map(a => [
          a.data || '', a.paciente || '', a.convenio || '', a.procedimento || '', a.status || 'Finalizado', Number(a.unitario) || 0, a.observacao || 'Tabela Oficial'
        ])
      ];
      const wsAtend = XLSX.utils.aoa_to_sheet(atendRows);
      XLSX.utils.book_append_sheet(wb, wsAtend, 'Atendimentos');

      const convRows = [
        ['Convênio / Origem', 'Quantidade', 'Total Repasse (R$)'],
        ...(Array.isArray(p.convenios_json) ? p.convenios_json : []).map(c => [
          c.convenio || '', Number(c.qtd) || 0, Number(c.total) || 0
        ])
      ];
      const wsConv = XLSX.utils.aoa_to_sheet(convRows);
      XLSX.utils.book_append_sheet(wb, wsConv, 'Por_Convenio');

      const safeName = String(p.nome_curto || p.profissional).replace(/[^a-zA-Z0-9_-]/g, '_');
      XLSX.writeFile(wb, `Fechamento_${fechamentoCompetencia.replace('/', '_')}_${safeName}.xlsx`);
      toast(`📊 Planilha individual de ${p.nome_curto} baixada!`);
    }

    // =========================================================
    // EXPORTAÇÃO PLANILHA CONSOLIDADA 10 ABAS OFICIAIS (.XLSX)
    // =========================================================
    function exportFechamentoConsolidado10Abas() {
      if (typeof XLSX === 'undefined') { toast('Biblioteca Excel ainda carregando...', true); return; }
      const data = fechamentoData || { profissionais: [], regras: [], bpo: {} };
      const allProfs = data.profissionais || [];
      const allRegras = data.regras || [];
      const bpo = data.bpo || {};
      const wb = XLSX.utils.book_new();

      const sumRepasseAll = allProfs.reduce((s, p) => s + (Number(p.valor_repasse_confirmado) || 0), 0);
      const sumAtendAll = allProfs.reduce((s, p) => s + (Number(p.atendimentos_total) || 0), 0);
      const profsPaulista = allProfs.filter(p => p.unidade === 'Paulista');
      const profsGranja = allProfs.filter(p => p.unidade === 'Granja/Jandira');

      // 1. Painel_Fechamento
      const ws1 = XLSX.utils.aoa_to_sheet([
        ['CREABILY ARTE DA CURA — PAINEL EXECUTIVO DE FECHAMENTO DE PROFISSIONAIS', fechamentoCompetencia],
        ['Competência', fechamentoCompetencia],
        ['Total de Profissionais', allProfs.length],
        ['Total de Atendimentos Auditados', sumAtendAll],
        ['Repasse Total Consolidado (R$)', sumRepasseAll],
        ['Repasse Unidade Av. Paulista (R$)', profsPaulista.reduce((s, p) => s + (Number(p.valor_repasse_confirmado) || 0), 0)],
        ['Repasse Unidade Granja Viana (R$)', profsGranja.reduce((s, p) => s + (Number(p.valor_repasse_confirmado) || 0), 0)],
        ['Total de Regras Fixas Ativas', allRegras.length]
      ]);
      XLSX.utils.book_append_sheet(wb, ws1, 'Painel_Fechamento');

      // 2. Fechamento_Profissionais
      const ws2 = XLSX.utils.aoa_to_sheet([
        ['Unidade', 'Profissional', 'Nome Curto', 'Função', 'Nº Recibo RPA', 'CPF', 'Atendimentos', 'Finalizados', 'Não Compareceu', 'Capacidade Agenda', 'Particular (R$)', 'Convênios (R$)', 'Repasse Calculado (R$)', 'Repasse Confirmado (R$)', 'INSS RPA (R$)', 'IRRF (R$)', 'ISS (R$)', 'Líquido Pós-RPA (R$)', 'Status Auditoria', 'Observações'],
        ...allProfs.map(p => {
          const rpa = calcImpostosRPA(p);
          return [
            p.unidade, p.profissional, p.nome_curto, p.funcao,
            rpa.numero_recibo || '', rpa.cpf || '',
            Number(p.atendimentos_total) || 0, Number(p.finalizados) || 0, Number(p.nao_compareceu) || 0, Number(p.capacidade_agenda) || 120,
            Number(p.valor_particular) || 0, Number(p.valor_convenio) || 0,
            Number(p.valor_repasse_calculado) || 0, Number(p.valor_repasse_confirmado) || 0,
            rpa.inss, rpa.irrf, rpa.iss || 0, rpa.liquido,
            p.status_auditoria || 'CONFERIDO', p.observacao_auditoria || ''
          ];
        })
      ]);
      XLSX.utils.book_append_sheet(wb, ws2, 'Fechamento_Profissionais');

      // 3. Fechamento_Unidades
      const ws3 = XLSX.utils.aoa_to_sheet([
        ['Unidade', 'Qtd Profissionais', 'Atendimentos', 'Repasse Particular (R$)', 'Repasse Convênio (R$)', 'Repasse Total (R$)'],
        ['Av. Paulista', profsPaulista.length, profsPaulista.reduce((a,b)=>a+(Number(b.atendimentos_total)||0),0), profsPaulista.reduce((a,b)=>a+(Number(b.valor_particular)||0),0), profsPaulista.reduce((a,b)=>a+(Number(b.valor_convenio)||0),0), profsPaulista.reduce((a,b)=>a+(Number(b.valor_repasse_confirmado)||0),0)],
        ['Granja Viana / Jandira', profsGranja.length, profsGranja.reduce((a,b)=>a+(Number(b.atendimentos_total)||0),0), profsGranja.reduce((a,b)=>a+(Number(b.valor_particular)||0),0), profsGranja.reduce((a,b)=>a+(Number(b.valor_convenio)||0),0), profsGranja.reduce((a,b)=>a+(Number(b.valor_repasse_confirmado)||0),0)],
        ['TOTAL CONSOLIDADO', allProfs.length, sumAtendAll, allProfs.reduce((a,b)=>a+(Number(b.valor_particular)||0),0), allProfs.reduce((a,b)=>a+(Number(b.valor_convenio)||0),0), sumRepasseAll]
      ]);
      XLSX.utils.book_append_sheet(wb, ws3, 'Fechamento_Unidades');

      // 4. Tabela_Honorarios_Referencia
      const ws4 = XLSX.utils.aoa_to_sheet([
        ['Área', 'Profissional', 'Unidade', 'Convênio / Plano', 'Procedimento Padrão', 'Palavras-Chave', 'Valor Repasse (R$)', 'Prioridade', 'Paga Falta', 'Observação'],
        ...allRegras.map(r => [
          r.area, r.profissional, r.unidade, r.convenio, r.procedimento_padrao, r.palavras_chave, Number(r.valor_repasse) || 0, Number(r.prioridade) || 80, 'SIM', r.observacao || ''
        ])
      ]);
      XLSX.utils.book_append_sheet(wb, ws4, 'Tabela_Honorarios_Referencia');

      // 5. BPO_Resumo
      const fat = Number(bpo.faturamento_bruto_estimado) || 206250;
      const impPct = Number(bpo.impostos_nf_pct) || 16;
      const imp = fat * (impPct / 100);
      const fixP = Number(bpo.custos_fixos_paulista) || 36459;
      const fixG = Number(bpo.custos_fixos_granja) || 18500;
      const varO = Number(bpo.custos_variaveis_operacionais) || 10000;
      const resLiq = fat - imp - sumRepasseAll - fixP - fixG - varO;
      const ws5 = XLSX.utils.aoa_to_sheet([
        ['BPO FINANCEIRO & DRE MENSAL', fechamentoCompetencia],
        ['Faturamento Bruto Estimado (R$)', fat],
        [`Impostos NF (${impPct}%) (R$)`, imp],
        ['Receita Líquida pós-NF (R$)', fat - imp],
        ['Total Repasse Profissionais (R$)', sumRepasseAll],
        ['Margem de Contribuição (R$)', fat - imp - sumRepasseAll],
        ['Custos Fixos Paulista (R$)', fixP],
        ['Custos Fixos Granja Viana (R$)', fixG],
        ['Custos Variáveis Operacionais (R$)', varO],
        ['EBITDA / Lucro Líquido Real (R$)', resLiq],
        ['EBITDA / Margem Líquida (%)', fat > 0 ? Number(((resLiq / fat) * 100).toFixed(2)) : 0]
      ]);
      XLSX.utils.book_append_sheet(wb, ws5, 'BPO_Resumo');

      // 6. Capacidade_Profissionais
      const ws6 = XLSX.utils.aoa_to_sheet([
        ['Profissional', 'Unidade', 'Regime de Atendimento', 'Capacidade Real Mensal', 'Atendimentos Realizados', 'Vagas Disponíveis', 'Ocupação Real (%)'],
        ...allProfs.map(p => {
          const cap = Number(p.capacidade_agenda) || 120;
          const atd = Number(p.atendimentos_total) || 0;
          return [p.profissional, p.unidade, p.regime_atendimento || 'Individual (1 pac/horário)', cap, atd, Math.max(0, cap - atd), cap > 0 ? Math.round((atd / cap) * 100) : 0];
        })
      ]);
      XLSX.utils.book_append_sheet(wb, ws6, 'Capacidade_Profissionais');

      // 7. Base_Calculo
      const baseCalcRows = [['Profissional', 'Unidade', 'Modalidade', 'Convênio', 'Quantidade', 'Finalizados', 'Faltas Pagas', 'Unitário (R$)', 'Total (R$)']];
      allProfs.forEach(p => {
        (Array.isArray(p.composicao_json) ? p.composicao_json : []).forEach(c => {
          baseCalcRows.push([p.profissional, p.unidade, c.modalidade, c.convenio || '', Number(c.qtd) || 0, Number(c.finalizados ?? c.qtd) || 0, Number(c.faltas) || 0, Number(c.unitario) || 0, Number(c.total) || 0]);
        });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(baseCalcRows), 'Base_Calculo');

      // 8. Base_Atendimentos_Mes
      const baseAtendRows = [['Profissional', 'Unidade', 'Data', 'Paciente', 'Convênio', 'Procedimento', 'Status', 'Repasse Unitário (R$)']];
      allProfs.forEach(p => {
        (Array.isArray(p.atendimentos_json) ? p.atendimentos_json : []).forEach(a => {
          baseAtendRows.push([p.profissional, p.unidade, a.data || '', a.paciente || '', a.convenio || '', a.procedimento || '', a.status || 'Finalizado', Number(a.unitario) || 0]);
        });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(baseAtendRows), 'Base_Atendimentos_Mes');

      // 9. Auditoria_Divergencias
      const ws9 = XLSX.utils.aoa_to_sheet([
        ['Profissional', 'Unidade', 'Repasse Calculado (R$)', 'Repasse Confirmado (R$)', 'Diferença (R$)', 'Status', 'Nota de Auditoria'],
        ...allProfs.map(p => [
          p.profissional, p.unidade, Number(p.valor_repasse_calculado) || 0, Number(p.valor_repasse_confirmado) || 0,
          (Number(p.valor_repasse_confirmado) || 0) - (Number(p.valor_repasse_calculado) || 0),
          p.status_auditoria || 'CONFERIDO', p.observacao_auditoria || ''
        ])
      ]);
      XLSX.utils.book_append_sheet(wb, ws9, 'Auditoria_Divergencias');

      // 10. Plano_Acoes
      const ws10 = XLSX.utils.aoa_to_sheet([
        ['Prioridade', 'Frente', 'Ação Recomendada', 'Responsável', 'Impacto Esperado'],
        ['Alta', 'Padronização Ágil', 'Garantir preenchimento da descrição do plano (ex: Espaço Uni, Anual, 24 sessões) em 100% dos agendamentos da Granja Viana', 'Recepção', 'Zerar divergências automáticas no fechamento'],
        ['Alta', 'Expansão Comercial', 'Direcionar tráfego Google Ads para profissionais com ocupação abaixo de 70% na Paulista e Granja', 'Marketing / Beatriz IA', '+R$ 25.000 a R$ 40.000/mês em planos particulares'],
        ['Média', 'Conversão Particular', 'Oferecer Plano Fisio 24 sessões e Pilates Semestral para pacientes no fim do ciclo 8/10 ou 10/10 de convênio', 'Fisioterapeutas / Recepção', 'Aumento do ticket médio e margem líquida BPO']
      ]);
      XLSX.utils.book_append_sheet(wb, ws10, 'Plano_Acoes');

      XLSX.writeFile(wb, `Fechamento_Profissionais_Creabily_${fechamentoCompetencia.replace('/', '_')}_Completo_10_Abas.xlsx`);
      toast('📊 Planilha Consolidada Oficial (10 Abas) gerada com sucesso!');
    }

    function getNextBeatrizWindowInfo() {
      const now = new Date();
      const dow = now.getDay(); // 0 = Dom, 6 = Sáb
      const hr = now.getHours() + (now.getMinutes() / 60);
      if (dow === 6) {
        return { isOpen: false, short: 'Seg 09h00', full: 'Segunda-feira às 09h00 (Fim de semana bloqueado p/ remarketing)' };
      }
      if (dow === 0) {
        return { isOpen: false, short: 'Seg 09h00', full: 'Amanhã (Segunda-feira) às 09h00 (Fim de semana bloqueado p/ remarketing)' };
      }
      if (hr < 9) {
        return { isOpen: false, short: 'Hoje 09h00', full: 'Hoje às 09h00 (Aguardando abertura comercial)' };
      }
      if (hr > 18) {
        return {
          isOpen: false,
          short: dow === 5 ? 'Seg 09h00' : 'Amanhã 09h00',
          full: dow === 5 ? 'Segunda-feira às 09h00 (Fora do expediente • Fim de semana protegido)' : 'Amanhã às 09h00 (Fora do expediente comercial)'
        };
      }
      return { isOpen: true, short: 'Janela Ativa (09h–18h)', full: 'Ativa agora (Seg–Sex 09h às 18h • Ciclo a cada 30 min)' };
    }

    function beatrizCardBadge(l) {
      const win = getNextBeatrizWindowInfo();
      const fu = Math.min(3, Math.max(1, Number(l.followup_count || (l.status === 'followup_3' ? 3 : (l.status === 'followup_2' ? 2 : 1)))));
      const isPaused = Boolean(l.ai_paused || l.status === 'transbordo_humano');

      if (l.status === 'transbordo_humano' || l.ai_paused) {
        return {
          bg: '#FEE2E2', color: '#991B1B', border: '#FCA5A5',
          text: `🚨 ALERTA HUMANO • Beatriz Pausada`,
          sub: l.ai_pause_reason || 'Paciente solicitou atendente ou caso específico'
        };
      }
      if (l.status === 'novo_lead_quiz') {
        return {
          bg: '#F3E8FF', color: '#6B21A8', border: '#D8B4FE',
          text: `🤖 Beatriz • Aguardando 1ª resposta`,
          sub: `1º Follow-up automático se não responder (${win.short})`
        };
      }
      if (l.status === 'conversando') {
        return {
          bg: '#DBEAFE', color: '#1E40AF', border: '#93C5FD',
          text: `🟢 Beatriz • Em conversa ativa (Buffer 16s)`,
          sub: `Conduzindo qualificação e escolha de horário`
        };
      }
      if (['followup_1', 'followup_2', 'followup_3'].includes(l.status)) {
        return {
          bg: '#FEF3C7', color: '#92400E', border: '#FCD34D',
          text: `⏳ Beatriz • Toque ${fu}/3 enviado`,
          sub: fu < 3 ? `Próximo toque comercial: ${win.short}` : `Último toque enviado • Encerra em Perdidos se s/ resp.`
        };
      }
      if (l.status === 'agendado') {
        return {
          bg: '#CCFBF1', color: '#0F766E', border: '#5EEAD4',
          text: `✅ Desfecho: Pré-Agendado pela Beatriz`,
          sub: l.agendamento_resumo ? String(l.agendamento_resumo).slice(0, 75) : 'Horário reservado na grade'
        };
      }
      if (l.status === 'consulta_realizada') {
        return {
          bg: '#DCFCE7', color: '#166534', border: '#86EFAC',
          text: `🏆 Desfecho: Paciente Atendido`,
          sub: `Confirmado na agenda clínica do Ágil`
        };
      }
      if (l.status === 'no_show') {
        return {
          bg: '#FFEDD5', color: '#9A3412', border: '#FDBA74',
          text: `⚠️ Desfecho: No-Show (Ausência)`,
          sub: `Não compareceu na data agendada`
        };
      }
      return {
        bg: '#F1F5F9', color: '#475569', border: '#CBD5E1',
        text: `🛑 Desfecho: Ciclo Encerrado`,
        sub: l.lost_reason || 'Sem retorno após 3 tentativas em horário comercial'
      };
    }

    async function toggleBeatrizForLead(id, pause, ev) {
      if (ev) ev.stopPropagation();
      const l = findLead(id);
      if (!l) return;
      const ph = phoneOf(l);
      if (!ph) { toast('Lead sem telefone válido', true); return; }
      toast(pause ? '⏸️ Pausando Beatriz e transferindo para Atenção Humana...' : '▶️ Reativando condução autônoma da Beatriz...');
      const r = await api('manage-lead', {
        action: 'toggle_ai',
        id: l.id,
        phone: ph,
        pause: Boolean(pause),
        reason: pause ? 'Assumido manualmente pela equipe no Funil CRM' : ''
      });
      if (!r.ok) {
        toast(r.error || 'Erro ao alternar status da Beatriz', true);
        return;
      }
      l.ai_paused = Boolean(pause);
      if (pause && !['agendado', 'consulta_realizada'].includes(l.status)) {
        l.status = 'transbordo_humano';
      } else if (!pause && l.status === 'transbordo_humano') {
        l.status = 'conversando';
      }
      render();
      toast(pause ? `🚨 ${firstName(l)} em Atenção Humana (Beatriz pausada)` : `🤖 Beatriz reativada para ${firstName(l)}!`);
    }

      toast('🤖 Sincronizando conversas da Beatriz e atualizando desfechos do Funil...');

      if (r.ok) {

        await refreshData(true);
        toast(cnt > 0 ? `🎯 ${cnt} lead(s) movidos automaticamente conforme conversa com a Beatriz!` : '✅ Funil 100% sincronizado com a Beatriz!');
      } else {
        toast(r.error || 'Erro ao sincronizar funil autônomo', true);
      }
    }

               href="${waLink(l, templates(l).pesquisa_nps)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Enviar pesquisa NPS no WhatsApp">
               ${ic('wa', 'icon-sm')} ⭐ NPS

        ` : ''}
      </div>`;
    }

      const col = document.querySelector(`.col[data-stage="${stageKey}"]`);
      if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

      let stagesToShow = STAGES;
      if (!isB2B) {
        if (boardFilter === 'active' || boardFilter === 'all') {
          stagesToShow = STAGES.filter(s => ['novo_lead_quiz', 'conversando', 'followup', 'transbordo_humano', 'agendado'].includes(s.key));

          stagesToShow = STAGES.filter(s => ['perdido', 'no_show'].includes(s.key));

      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === boardFilter));

      // Helper para filtrar os leads de uma coluna segundo o modo selecionado
      function filterColumnLeads(stageKey) {
        let items = list.filter(l => stageOf(l.status) === stageKey);
        if (!isB2B) {
          if (boardFilter === 'active') {
            // GIRO DIÁRIO: Apenas quem entrou ou interagiu HOJE e ainda NÃO subiu na Agenda Ágil
            items = items.filter(isInDailyFunnel);
          } else if (boardFilter === 'all') {
            // COFRE ACUMULADO: Todos os contatos ativos de dias anteriores que ainda não subiram no Ágil nem foram cancelados
            items = items.filter(l => !isAlreadyInAgil(l) && !isCancelledFromAgenda(l));

        return items;

      board.innerHTML = stagesToShow.map(s => {
        const items = filterColumnLeads(s.key);
        items.sort((a, b) => new Date(b.status_changed_at || b.created_at) - new Date(a.status_changed_at || a.created_at));

        const isColdCol = ['no_show', 'perdido'].includes(s.key);
        const colClass = isColdCol ? (s.key === 'no_show' ? 'col col-noshow' : 'col col-perdido') : 'col';
        const colTitle = s.key === 'agendado' ? 'Agendada (Pré-Ágil)' : (s.key === 'perdido' ? 'Cancelados da Agenda (Sem Interesse)' : s.label);

        return `<div class="${colClass}" data-stage="${s.key}">
          <div class="col-head">
            <span class="dot" style="background:${s.color}"></span>
            <h4>${colTitle}</h4>
            <span class="pill ${isColdCol ? (s.key === 'no_show' ? 'orange' : 'slate') : ''}">${items.length}</span>
          </div>
          ${items.length ? items.map(card).join('') : emptyMsg}

      }).join('');
      bindDnD(board);

    // Arrastar e soltar
    function bindDnD(board) {
      board.querySelectorAll('.card').forEach(c => {
        c.addEventListener('dragstart', e => { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      board.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
        col.addEventListener('drop', e => {
          e.preventDefault(); col.classList.remove('drop');
          const id = e.dataTransfer.getData('text/plain');
          const l = findLead(id);
          if (l && stageOf(l.status) !== col.dataset.stage) moveLead(id, col.dataset.stage);
        });
      });
    }

    // =========================================================
    // Ações
    // =========================================================
    function findLead(id) { return (view === 'b2b' ? leadsB2B : leadsB2C).find(l => String(l.id) === String(id)); }

    async function moveLead(id, stageKey) {
      const l = findLead(id); if (!l) return;
      const prev = { status: l.status, status_changed_at: l.status_changed_at };
      const status = dbStatus(stageKey);
      l.status = status; l.status_changed_at = new Date().toISOString();
      render();
      const r = await api('manage-lead', { action: 'update_status', id, status, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { Object.assign(l, prev); render(); toast('Não foi possível mover: ' + r.error, true); return; }
      toast(`${nameOf(l).split(' ')[0]} → ${stageInfo(status).label}`);
    }

    async function autoOrganizeStaleLeads() {
      const all = leadsB2C;
      const stale = all.filter(isLeadStale);
      if (stale.length === 0) {
        toast('Nenhum lead parado há mais de 7 dias no funil ativo!');
        return;
      }

      const agendadosCount = stale.filter(l => l.status === 'agendado').length;
      const outrosCount = stale.length - agendadosCount;

      const ok = await modal({
        title: 'Organizar contatos parados (> 7 dias)?',
        text: `Identificamos <b>${stale.length} contatos</b> que estão há mais de 7 dias no funil ativo sem avanço:<br><br>
               • <b>${agendadosCount} agendados</b> sem comparecimento → irão para <b>No-Show</b><br>
               • <b>${outrosCount} contatos</b> parados em Novos/Conversa → irão para <b>Perdidos / Frios</b><br><br>
               Isso despolui seu funil imediatamente e prepara os leads para o reaquecimento. Deseja aplicar?`,
        confirmLabel: 'Sim, Mover para Perdidos / No-Show'
      });

      if (!ok) return;

      const updates = stale.map(l => ({
        id: l.id,
        status: l.status === 'agendado' ? 'no_show' : 'perdido'
      }));

      // Atualização otimista
      updates.forEach(u => {
        const l = findLead(u.id);
        if (l) {
          l.status = u.status;
          l.status_changed_at = new Date().toISOString();
        }
      });
      render();
      toast(`Organizando ${updates.length} leads...`);

      const r = await api('manage-lead', { action: 'bulk_update_status', updates, tableType: 'b2c' });
      if (r.ok) {
        toast(`${updates.length} leads organizados com sucesso em No-Show e Perdidos!`);
        refreshData(true);
      } else {
        toast('Erro ao organizar: ' + r.error, true);
        refreshData(true);
      }
    }

    async function saveFields(id) {
      const l = findLead(id); if (!l) return;
      const note = document.getElementById('d-note').value.trim();
      const nextAction = document.getElementById('d-next').value.trim();
      const nextAt = document.getElementById('d-next-at').value;
      const stamp = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const fields = {
        next_action: nextAction || null,
        next_action_at: nextAt ? new Date(nextAt + 'T09:00:00').toISOString() : null
      };
      if (note) fields.notes = `[${stamp}] ${note}` + (l.notes ? '\n' + l.notes : '');
      const btn = document.getElementById('d-save'); btn.disabled = true; btn.textContent = 'Salvando...';
      const r = await api('manage-lead', { action: 'update_fields', id, fields, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      btn.disabled = false; btn.textContent = 'Salvar';
      if (!r.ok) { toast(r.error, true); return; }
      Object.assign(l, fields);
      document.getElementById('d-note').value = '';
      render(); toast('Anotação salva');
    }

    async function deleteLead(id) {
      const l = findLead(id); if (!l) return;
      const first = nameOf(l).split(' ')[0];
      const ok = await modal({ title: 'Excluir lead?', text: `Isso apaga <b>${esc(nameOf(l))}</b> para sempre. Para confirmar, digite <b>${esc(first)}</b>.`, confirmLabel: 'Excluir', danger: true, input: { placeholder: first, match: first } });
      if (!ok) return;
      const r = await api('manage-lead', { action: 'delete', id, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { toast(r.error, true); return; }
      if (view === 'b2b') leadsB2B = leadsB2B.filter(x => x.id !== l.id); else leadsB2C = leadsB2C.filter(x => x.id !== l.id);
      closeDrawer(); render(); toast('Lead excluído');
    }

    };
    function defaultTpl(l) {
      if (view === 'b2b') return l.status === 'novo_lead_quiz' ? 'primeiro' : 'retorno';
      if (l.status === 'consulta_realizada') return 'pesquisa_nps';
      if (l.status === 'no_show') return 'reaquecer_noshow';
      if (l.status === 'perdido') return 'reaquecer_dor';
      if (l.status === 'agendado') return 'confirmar_pre';
      if (hasPreAgendamento(l)) return 'confirmar_pre';
      if (l.status === 'followup_3') return 'ultimo';

        const h = hoursSince(l.created_at);
        return (h !== null && h > 0.5) ? 'pos_quiz' : 'agendar_novo';
      }
      return 'retorno';
