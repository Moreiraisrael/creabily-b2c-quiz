<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#6b308b" />
  <title>CRM | Creabily</title>
  <link rel="icon" href="assets/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #6b308b;
      --brand-600: #5a2775;
      --brand-50: #f5eefa;
      --brand-100: #ebdcf4;
      --teal: #0f9f8f;
      --teal-50: #e7f7f5;
      --bg: #f6f5f9;
      --surface: #ffffff;
      --surface-subtle: #faf9fc;
      --line: #e8e6ef;
      --line-strong: #d9d6e3;
      --text: #1d1a26;
      --text-2: #5d5970;
      --text-3: #8d899c;
      --red: #d93f3f;
      --red-50: #fdeeee;
      --amber: #c27a0e;
      --amber-50: #fdf5e6;
      --blue: #2f6fd6;
      --blue-50: #ebf2fd;
      --green: #1f9d55;
      --green-50: #e8f6ee;
      --orange: #ea580c;
      --orange-50: #fff7ed;
      --slate: #64748b;
      --slate-50: #f1f5f9;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(29, 26, 38, .06);
      --shadow: 0 1px 2px rgba(29, 26, 38, .05), 0 4px 16px rgba(29, 26, 38, .06);
      --shadow-lg: 0 12px 40px rgba(29, 26, 38, .18);
      --sidebar: 232px;
    }
    [data-theme="dark"] {
      --bg: #0e0c15;
      --surface: #171422;
      --surface-subtle: #1e1a2c;
      --line: #292438;
      --line-strong: #3d3652;
      --text: #f4f2f9;
      --text-2: #aba6be;
      --text-3: #757088;
      --brand-50: #2a1638;
      --brand-100: #3f1e56;
      --teal-50: #0a2e2a;
      --red-50: #381216;
      --amber-50: #33200a;
      --blue-50: #122344;
      --green-50: #0d2e1c;
      --orange-50: #381a0b;
      --slate-50: #1b202c;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow: 0 4px 16px rgba(0, 0, 0, .4);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, .6);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 14px; height: 14px; }

    /* ---------- Login ---------- */
    #login-view { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(1200px 600px at 10% -10%, var(--brand-100), transparent 60%),
                  radial-gradient(900px 500px at 110% 110%, #d6f1ed, transparent 60%), var(--bg); }
    .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; padding: 36px 28px 28px; box-shadow: var(--shadow-lg); text-align: center; }
    .login-card img { height: 48px; margin-bottom: 22px; }
    .login-card h1 { font-size: 20px; margin: 0 0 4px; }
    .login-card p.sub { color: var(--text-2); margin: 0 0 22px; }
    .field { position: relative; }
    .input { width: 100%; height: 44px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
      background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
    .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
    .field .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--text-3); padding: 6px; display: grid; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
      border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: #fff; font-weight: 600; white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s; text-decoration: none; }
    .btn:hover { background: #faf9fc; border-color: #cbc7d8; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); }
    .btn-wa { background: #1faa59; border-color: #1faa59; color: #fff; }
    .btn-wa:hover { background: #188f4a; border-color: #188f4a; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: #efedf4; border-color: transparent; }
    .btn-danger { color: var(--red); }
    .btn-danger:hover { background: var(--red-50); border-color: #f3c9c9; }
    .btn-block { width: 100%; height: 44px; }
    .btn-icon { width: 40px; padding: 0; }
    .login-error { color: var(--red); font-size: 13px; margin: 12px 0 0; }
    .login-card form > * + * { margin-top: 12px; }

    /* ---------- App shell ---------- */
    #app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line);
      padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; }
    .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
    .sidebar .brand img { height: 30px; }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 14px 10px 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border-radius: var(--radius-sm);
      border: 0; background: none; color: var(--text-2); font-weight: 500; text-align: left; }
    .nav-item:hover { background: #f3f1f7; color: var(--text); }
    .nav-item.active { background: var(--brand-50); color: var(--brand); font-weight: 600; }
    .nav-item .count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 600;
      display: grid; place-items: center; background: #efedf4; color: var(--text-2); }
    .nav-item.active .count { background: var(--brand); color: #fff; }
    .nav-item .count.alert { background: var(--red); color: #fff; }
    .sidebar .spacer { flex: 1; }
    .sidebar .foot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
    .sync { font-size: 12px; color: var(--text-3); padding: 2px 10px 6px; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(246, 245, 249, .88); backdrop-filter: blur(10px);
      padding: 18px 28px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 1px solid transparent; }
    .topbar.scrolled { border-bottom-color: var(--line); }
    .topbar h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
    .topbar .subtitle { color: var(--text-3); font-size: 13px; margin-top: 2px; }
    .topbar .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search { position: relative; }
    .search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
    .search input { width: 240px; height: 40px; padding: 0 12px 0 36px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: #fff; outline: none; }
    .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
    .seg { display: inline-flex; background: #ebe9f1; border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
    .seg button { border: 0; background: none; height: 34px; padding: 0 12px; border-radius: 8px; font-weight: 500; color: var(--text-2); }
    .seg button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }

    .content { padding: 8px 28px 40px; }

    /* ---------- KPIs ---------- */
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-sm); }
    .kpi .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
    .kpi .label { font-size: 12.5px; color: var(--text-2); }
    .kpi .value { font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
    .ic.brand { background: var(--brand-50); color: var(--brand); }
    .ic.red { background: var(--red-50); color: var(--red); }
    .ic.teal { background: var(--teal-50); color: var(--teal); }
    .ic.green { background: var(--green-50); color: var(--green); }
    .ic.orange { background: var(--orange-50); color: var(--orange); }
    .ic.slate { background: var(--slate-50); color: var(--slate); }

    /* ---------- Banner de Leads Parados ---------- */
    .stale-banner { background: var(--amber-50); border: 1px solid #fde68a; border-radius: var(--radius); padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
    [data-theme="dark"] .stale-banner { background: #241b0b; border-color: #4d3816; }
    .stale-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .stale-info .ic-alert { width: 36px; height: 36px; border-radius: 10px; background: #fef3c7; color: #b45309; display: grid; place-items: center; flex: none; }
    [data-theme="dark"] .stale-info .ic-alert { background: #452c0f; color: #fbbf24; }
    .stale-title { font-weight: 600; font-size: 13.5px; color: var(--text); }
    .stale-desc { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
    .btn-stale { height: 34px; padding: 0 14px; border-radius: 8px; background: #c27a0e; color: #fff; font-size: 12.5px; font-weight: 600; border: 0; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; cursor: pointer; }
    .btn-stale:hover { background: #a16207; }

    /* ---------- Toolbar do Funil ---------- */
    .board-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .board-tabs { display: inline-flex; background: #ebe9f1; border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
    [data-theme="dark"] .board-tabs { background: #231e32; }
    .board-tabs button { border: 0; background: none; height: 34px; padding: 0 14px; border-radius: 8px; font-weight: 500; font-size: 13px; color: var(--text-2); cursor: pointer; }
    .board-tabs button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }

    /* ---------- Seção de Gráficos Modernos ---------- */
    .analytics-section {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); transition: background .2s ease;
    }
    .analytics-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .analytics-title { display: flex; align-items: center; gap: 8px; }
    .analytics-title h4 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text); }
    .analytics-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; }
    .analytics-sub { font-size: 12px; color: var(--text-3); }
    .analytics-grid {
      display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; align-items: stretch;
    }
    .chart-box {
      background: var(--surface-subtle); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
      display: flex; flex-direction: column; transition: background .2s ease;
    }
    .chart-box-title {
      display: flex; align-items: center; justify-content: space-between; font-size: 12.5px;
      font-weight: 600; color: var(--text-2); margin-bottom: 12px;
    }
    .badge-total {
      font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      background: var(--line); color: var(--text-3);
    }
    .bar-chart-svg { width: 100%; height: 95px; overflow: visible; }
    .bar-track { fill: #f0edf5; }
    [data-theme="dark"] .bar-track { fill: #292438; }
    .metric-list { display: flex; flex-direction: column; gap: 10px; justify-content: center; flex: 1; }
    .metric-row { display: flex; flex-direction: column; gap: 4px; }
    .metric-row-info { display: flex; justify-content: space-between; font-size: 12px; }
    .metric-name { font-weight: 600; color: var(--text); }
    .metric-val { color: var(--text-3); font-weight: 500; font-size: 11.5px; }
    .metric-bar-bg { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .metric-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), #8a42b1); transition: width .4s ease; }
    .channel-distribution { display: flex; flex-direction: column; justify-content: center; flex: 1; }
    .channel-item { display: flex; flex-wrap: wrap; gap: 6px; }
    .unit-ratio-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-2); margin-bottom: 6px; }
    .unit-ratio-bar { height: 8px; border-radius: 999px; background: var(--line); display: flex; overflow: hidden; }
    .unit-ratio-seg.paulista { background: var(--brand); }
    .unit-ratio-seg.granja { background: var(--teal); }
    .empty-mini { font-size: 12px; color: var(--text-3); text-align: center; padding: 16px 0; }

    /* ---------- Hoje (Dashboard Diário) ---------- */
    .today-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .today-section-head h3 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .today-date-badge { font-size: 12.5px; color: var(--text-2); font-weight: 500; background: var(--surface); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); }
    .today-hero-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
    .panel-pre { border-top: 3px solid var(--teal); }
    .panel-nopre { border-top: 3px solid var(--brand); }
    .panel-pre .panel-head h3 { color: var(--teal); }
    .panel-nopre .panel-head h3 { color: var(--brand); }
    .today-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .panel-head .hint { color: var(--text-3); font-size: 12.5px; }
    .panel-head .pill { margin-left: auto; }
    .rows { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--surface-subtle); }
    .row .who { min-width: 0; flex: 1; }
    .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meta { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .wa { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #cdebd9; background: #effaf3; color: #1a8f4c; display: grid; place-items: center; flex: none; }
    .row .wa:hover { background: #def4e7; }
    .slot-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--teal-50); color: var(--teal); white-space: nowrap; }
    .wait-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--amber-50); color: var(--amber); white-space: nowrap; }
    .btn-action-wa { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600; background: #1faa59; color: #fff; text-decoration: none; border: 0; transition: all .15s; flex: none; }
    .btn-action-wa:hover { background: #178a48; transform: translateY(-1px); }
    .empty { padding: 26px 16px; text-align: center; color: var(--text-3); }
    .empty .icon { width: 28px; height: 28px; color: #c9c5d6; margin-bottom: 6px; }

    /* ---------- Avatar & chips ---------- */
    .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #fff; }
    .avatar.lg { width: 48px; height: 48px; font-size: 17px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500;
      background: #f1eff5; color: var(--text-2); white-space: nowrap; }
    [data-theme="dark"] .chip { background: #262136; color: var(--text-2); }
    .chip.paulista { background: var(--brand-50); color: var(--brand); }
    .chip.granja { background: var(--teal-50); color: #0b7d71; }
    .chip.late { background: var(--red-50); color: var(--red); font-weight: 600; }
    .chip.ok { background: #f1eff5; color: var(--text-2); }
    .chip.google { background: var(--blue-50); color: var(--blue); }
    .chip.insta { background: #fdeef6; color: #c0307a; }
    .chip.site { background: var(--amber-50); color: var(--amber); }
    .chip.noshow { background: var(--orange-50); color: var(--orange); font-weight: 600; }
    .chip.perdido { background: var(--slate-50); color: var(--slate); font-weight: 600; }
    .chip.pre-agendado { background: var(--teal-50); color: var(--teal); font-weight: 600; }
    .chip.sem-agendamento { background: var(--amber-50); color: var(--amber); font-weight: 600; }
    .pill { min-width: 24px; height: 22px; padding: 0 8px; border-radius: 999px; background: #efedf4; color: var(--text-2); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    [data-theme="dark"] .pill { background: #29243a; color: var(--text-2); }
    .pill.red { background: var(--red); color: #fff; }
    .pill.orange { background: var(--orange); color: #fff; }
    .pill.slate { background: var(--slate); color: #fff; }

    /* ---------- Funil (kanban) ---------- */
    .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
    .col { background: #efedf4; border-radius: var(--radius); padding: 10px; min-height: 60vh; display: flex; flex-direction: column; gap: 8px; transition: background .15s, box-shadow .15s; }
    [data-theme="dark"] .col { background: #1c182b; }
    .col.drop { background: var(--brand-50); box-shadow: inset 0 0 0 2px var(--brand-100); }
    .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px; }
    .col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
    .col-head h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
    .col-head .pill { margin-left: auto; background: var(--surface); }
    .col.col-noshow { border-top: 3px solid var(--orange); }
    .col.col-perdido { border-top: 3px solid var(--slate); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: var(--shadow-sm);
      cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; }
    .card:hover { box-shadow: var(--shadow); border-color: var(--line-strong); }
    .card.dragging { opacity: .5; transform: rotate(1deg); }
    .card .top { display: flex; align-items: center; gap: 10px; }
    .card .top .name { font-weight: 600; line-height: 1.25; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card .avatar { width: 30px; height: 30px; font-size: 12px; }
    .card .svc { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
    .card .answer { margin-top: 6px; font-size: 12.5px; color: var(--text-2); background: #faf9fc; border: 1px solid #f0eef4; border-radius: 8px; padding: 6px 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .card .actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0eef4; }
    .card .actions .btn { height: 32px; font-size: 12.5px; padding: 0 10px; }
    .card .actions .grow { flex: 1; }
    .col-empty { color: var(--text-3); font-size: 12.5px; text-align: center; padding: 18px 6px; border: 1.5px dashed #dcd8e6; border-radius: 10px; }

    /* ---------- Drawer ---------- */
    .scrim { position: fixed; inset: 0; background: rgba(29, 26, 38, .32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--surface); z-index: 50;
      transform: translateX(100%); transition: transform .25s ease, box-shadow .25s; display: flex; flex-direction: column; }
    .drawer.open { transform: none; box-shadow: var(--shadow-lg); }
    .d-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: flex-start; }
    .d-head .who { flex: 1; min-width: 0; }
    .d-head h3 { margin: 0; font-size: 19px; line-height: 1.25; }
    .d-head .meta { color: var(--text-2); font-size: 13px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .d-body { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
    .d-section { padding: 16px 0; border-bottom: 1px solid #f0eef4; }
    .d-section:last-child { border-bottom: 0; }
    .d-section h5 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
    .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stage-group-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 10px 0 6px; }
    .stages-active { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stages-outcomes { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stage { height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--text-2);
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .stage:hover { border-color: var(--brand); color: var(--brand); }
    .stage.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .stage .dot { width: 7px; height: 7px; border-radius: 50%; }
    .stage.on .dot { background: #fff !important; }
    .qa { display: grid; gap: 10px; }
    .qa .q { font-size: 12.5px; color: var(--text-3); }
    .qa .a { font-weight: 600; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; }
    .kv dt { color: var(--text-3); }
    .kv dd { margin: 0; word-break: break-word; }
    textarea.input { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
    .tpl { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tpl button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 12px; color: var(--text-2); cursor: pointer; }
    .tpl button.on { border-color: var(--brand); color: var(--brand); background: var(--brand-50); font-weight: 600; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .d-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .muted { color: var(--text-3); font-size: 12.5px; }
    .note-old { white-space: pre-wrap; background: #faf9fc; border: 1px solid #f0eef4; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }

    /* ---------- Modal & toast ---------- */
    .modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(29, 26, 38, .4); }
    .modal .box { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 22px; box-shadow: var(--shadow-lg); }
    .modal h4 { margin: 0 0 6px; font-size: 17px; }
    .modal p { margin: 0 0 14px; color: var(--text-2); }
    .modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #24202e; color: #fff; padding: 11px 16px;
      border-radius: 10px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 80; opacity: 0; transition: all .2s; pointer-events: none; display: flex; gap: 8px; align-items: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--red); }

    .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); padding: 40px; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton { height: 64px; border-radius: 12px; background: linear-gradient(90deg, #ece9f2 25%, #f5f3f8 50%, #ece9f2 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
    @keyframes sk { to { background-position: -200% 0; } }

    /* ---------- Mobile ---------- */
    .tabbar { display: none; }
    .mobile-only { display: none !important; }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .analytics-grid { grid-template-columns: 1fr; }
      .today-grid { grid-template-columns: 1fr; }
      .today-hero-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      #app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { padding: 14px 16px 10px; }
      .topbar .tools { margin-left: 0; width: 100%; }
      .search { flex: 1 1 100%; }
      .search input { width: 100%; }
      .seg { flex: 1; }
      .seg button { flex: 1; }
      .panel-head .hint { display: none; }
      .kpis { gap: 8px; margin-bottom: 16px; }
      .kpi .ic { display: none; }
      .board-sub-desk { display: none; }
      .content { padding: 4px 16px 96px; }
      .kpi { padding: 12px; }
      .kpi .value { font-size: 20px; }
      .analytics-section { padding: 14px 14px; margin-bottom: 18px; }
      .analytics-grid { grid-template-columns: 1fr; gap: 12px; }
      .board { grid-auto-columns: 82vw; scroll-snap-type: x mandatory; }
      .col { scroll-snap-align: start; min-height: 50vh; }
      .mobile-board-pills { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
      .mobile-board-pills::-webkit-scrollbar { display: none; }
      .m-pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; flex: none; cursor: pointer; box-shadow: var(--shadow-sm); }
      .m-pill:active { background: var(--brand-50); border-color: var(--brand); color: var(--brand); }
      .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        background: var(--surface); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08); }
      .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--text-3); padding: 6px 0; position: relative; min-height: 48px; }
      .tabbar button.active { color: var(--brand); font-weight: 700; }
      .tabbar .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 999px; background: var(--red); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
      .mobile-only { display: inline-flex !important; }
    }
    @media (max-width: 600px) {
      .drawer { width: 100vw; }
      .d-head { padding: 16px; }
      .d-head h3 { font-size: 17px; }
      .d-body { padding: 4px 16px 20px; }
      .stages-active, .stages-outcomes { grid-template-columns: repeat(2, 1fr); }
      .stage { height: 42px; font-size: 13px; }
      .tpl button { height: 32px; padding: 0 12px; font-size: 12px; }
      .grid2 { grid-template-columns: 1fr; }
      #d-wa, #d-save { height: 44px; font-size: 14px; }
      .row-today { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; }
      .row-today .btn-action-wa { width: 100%; justify-content: center; height: 42px; font-size: 13px; }
      .btn-action-wa { min-height: 38px; }
      .today-section-head { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="login-view">
    <div class="login-card">
      <img src="assets/logo.png" alt="Creabily">
      <h1>Painel de Atendimento</h1>
      <p class="sub">Entre para ver os leads das unidades</p>
      <form id="login-form">
        <div class="field">
          <input type="password" id="password" class="input" required placeholder="Senha" autocomplete="current-password">
          <button type="button" id="toggle-password" class="eye" aria-label="Mostrar senha"></button>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        <p id="login-error" class="login-error hidden"></p>
      </form>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo.png" alt="Creabily"></div>
      <div class="nav-label">Pacientes</div>
      <button class="nav-item active" data-view="today" onclick="setView('today')"><span data-ic="sun"></span>Hoje<span class="count" id="nav-today">0</span></button>
      <button class="nav-item" data-view="board" onclick="setView('board')"><span data-ic="columns"></span>Funil<span class="count" id="nav-board">0</span></button>
      <button class="nav-item" data-view="cold" onclick="setView('cold')"><span data-ic="archive"></span>Perdidos &amp; No-Show<span class="count" id="nav-cold">0</span></button>
      <div class="nav-label">Outros</div>
      <button class="nav-item" data-view="b2b" onclick="setView('b2b')"><span data-ic="briefcase"></span>Mentoria B2B<span class="count" id="nav-b2b">–</span></button>
      <div class="spacer"></div>
      <div class="foot">
        <div class="sync" id="sync-label">—</div>
        <button class="nav-item" onclick="refreshData()"><span data-ic="refresh" id="refresh-ic"></span>Atualizar</button>
        <button class="nav-item" onclick="logout()"><span data-ic="logout"></span>Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <div>
          <h2 id="page-title">Hoje</h2>
          <div class="subtitle" id="page-sub">Quem precisa de atenção agora</div>
        </div>
        <div class="tools">
          <label class="search"><span data-ic="search"></span><input id="search" type="search" placeholder="Buscar nome ou telefone" oninput="render()"></label>
          <div class="seg" id="unit-seg">
            <button class="on" data-unit="all" onclick="setUnit('all')">Todas</button>
            <button data-unit="paulista" onclick="setUnit('paulista')">Paulista</button>
            <button data-unit="granja_viana" onclick="setUnit('granja_viana')">Granja</button>
          </div>
          <button class="btn btn-icon" onclick="toggleTheme()" id="theme-btn" title="Alternar Modo Escuro / Claro"><span data-ic="moon" id="theme-ic"></span></button>
          <button class="btn btn-icon mobile-only" onclick="refreshData()" aria-label="Atualizar"><span data-ic="refresh"></span></button>
        </div>
      </header>

      <div class="content">
        <section class="kpis" id="kpis"></section>
        <div id="stale-alert-container"></div>
        <div id="view-today"></div>
        <div id="view-board" class="hidden">
          <div class="board-toolbar" id="board-toolbar">
            <div class="board-tabs" id="board-tabs">
              <button class="on" data-bfilter="active" onclick="setBoardFilter('active')">🚀 Funil Ativo (&lt; 7 dias)</button>
              <button data-bfilter="all" onclick="setBoardFilter('all')">📂 Todos os Estágios</button>
              <button data-bfilter="cold" onclick="setBoardFilter('cold')">🧊 Perdidos &amp; No-Show</button>
            </div>
            <button class="btn btn-stale" id="btn-organize-top" onclick="autoOrganizeStaleLeads()"><span data-ic="archive"></span>Organizar Leads Parados (&gt; 7 dias)</button>
          </div>
          <div id="mobile-pills-bar" class="mobile-only mobile-board-pills"></div>
          <div class="board" id="board"></div>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <button data-view="today" class="active" onclick="setView('today')"><span data-ic="sun"></span>Hoje<span class="badge hidden" id="tab-today"></span></button>
      <button data-view="board" onclick="setView('board')"><span data-ic="columns"></span>Funil</button>
      <button data-view="cold" onclick="setView('cold')"><span data-ic="archive"></span>Perdidos<span class="badge hidden" id="tab-cold"></span></button>
      <button data-view="b2b" onclick="setView('b2b')"><span data-ic="briefcase"></span>B2B</button>
    </nav>
  </div>

  <!-- ================= DRAWER ================= -->
  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>

  <script>
    // =========================================================
    // Ícones (SVG inline, sem dependências externas)
    // =========================================================
    const ICONS = {
      chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      columns: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
      briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
      eyeOff: '<path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
      wa: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21Z"/><path d="M9 9.5c.3 2 2.3 4.2 4.5 4.6l1.2-1.2 1.8.8-.4 1.6c-3.8.4-8-3.6-7.8-7.4L9.9 7.5l.9 1.7L9 9.5Z" fill="currentColor" stroke="none"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6l3.5-7Z"/>',
      alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
      headset: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
      chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/>',
      party: '<path d="m3 21 5-14 9 9-14 5Z"/><path d="M14 4l1-2M19 9l2-1M17 3l-1 3M21 5l-3 1"/>',
      copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
      userX: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
      flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'
    };
    function ic(name, cls = '') { return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`; }
    function paintIcons(root = document) { root.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic).replace('<svg ', `<svg ${el.id ? `id="${el.id}" ` : ''}${el.dataset.ic === 'refresh' ? 'data-refresh ' : ''}`); }); }

    // =========================================================
    // Estado
    // =========================================================
    let sessionPassword = '';
    let leadsB2C = [];
    let leadsB2B = [];
    let view = 'today';
    let boardFilter = 'active'; // 'active', 'all', 'cold'
    let unit = 'all';
    let openLeadId = null;
    let lastSync = null;

    // Etapas (mesmos status do banco)
    const STAGES = [
      { key: 'novo_lead_quiz', label: 'Novos', short: 'Novo', color: '#6b308b', ic: 'inbox' },
      { key: 'conversando', label: 'Em conversa', short: 'Conversa', color: '#2f6fd6', ic: 'chat' },
      { key: 'followup', label: 'Follow-up', short: 'Follow-up', color: '#c27a0e', ic: 'clock' },
      { key: 'agendado', label: 'Agendada', short: 'Agendada', color: '#0f9f8f', ic: 'calendar' },
      { key: 'consulta_realizada', label: 'Atendido', short: 'Atendido', color: '#1f9d55', ic: 'check' },
      { key: 'transbordo_humano', label: 'Atenção humana', short: 'Atenção', color: '#d93f3f', ic: 'headset' },
      { key: 'no_show', label: 'No-Show', short: 'No-Show', color: '#ea580c', ic: 'userX' },
      { key: 'perdido', label: 'Perdidos', short: 'Perdido', color: '#64748b', ic: 'archive' }
    ];
    const stageOf = s => (['followup_1', 'followup_2', 'followup_3'].includes(s) ? 'followup' : s);
    const stageInfo = k => STAGES.find(s => s.key === stageOf(k)) || STAGES[0];
    const dbStatus = k => (k === 'followup' ? 'followup_1' : k);

    // Prazos (horas) para considerar o lead atrasado na etapa
    const LIMIT_H = { novo_lead_quiz: 1, conversando: 24, followup_1: 48, followup_2: 72, followup_3: 96, transbordo_humano: 2, agendado: 48, no_show: 168, perdido: 168 };

    // =========================================================
    // Tema Claro / Escuro
    // =========================================================
    function initTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem('crm_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e) {}
      document.documentElement.setAttribute('data-theme', saved);
      paintThemeIcon();
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try { localStorage.setItem('crm_theme', cur); } catch(e) {}
      paintThemeIcon();
    }
    function paintThemeIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.getElementById('theme-btn');
      if (btn) btn.innerHTML = ic(isDark ? 'sun' : 'moon');
    }

    // =========================================================
    // Utilitários
    // =========================================================
    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    const nameOf = l => (l.name || l.nome || 'Sem nome').trim();
    const firstName = l => { const f = nameOf(l).split(/\s+/)[0] || ''; return f.charAt(0).toUpperCase() + f.slice(1).toLowerCase(); };
    function phoneOf(l) {
      let n = String(l.phone || l.whatsapp || '').replace(/\D/g, '');
      if (n && !n.startsWith('55')) n = '55' + n;
      return n;
    }
    function phoneFmt(n) { return n && n.length >= 12 ? `(${n.slice(2, 4)}) ${n.slice(4, n.length - 4)}-${n.slice(-4)}` : (n || 'Sem telefone'); }
    function initials(l) { const p = nameOf(l).split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
    const AV_COLORS = ['#6b308b', '#0f9f8f', '#2f6fd6', '#c2410c', '#9d4edd', '#0e7490', '#be185d', '#4d7c0f'];
    function avColor(l) { let h = 0; for (const c of String(l.id || nameOf(l))) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
    function avatar(l, cls = '') { return `<div class="avatar ${cls}" style="background:${avColor(l)}">${esc(initials(l))}</div>`; }
    const unitKey = l => (l.preferred_unit === 'granja_viana' ? 'granja' : 'paulista');
    const unitLabel = l => (l.preferred_unit === 'granja_viana' ? 'Granja Viana' : 'Paulista');
    function unitChip(l) { return `<span class="chip ${unitKey(l)}">${unitLabel(l)}</span>`; }
    const service = l => (l.treatment_interest && l.treatment_interest !== 'Não informado' ? l.treatment_interest : (l.main_complaint || 'Saúde integrada'));

    function origin(l) {
      const src = (l.utm_source || '').toLowerCase();
      if (l.gclid || src === 'google' || src === 'google_ads') return { label: 'Google Ads', cls: 'google' };
      if (src.includes('insta') || src === 'ig' || src.includes('facebook') || src === 'meta') return { label: 'Instagram', cls: 'insta' };
      if (src === 'site') return { label: 'Site', cls: 'site' };
      if (src) return { label: src, cls: '' };
      return null;
    }
    function hoursSince(d) { const t = d ? new Date(d).getTime() : NaN; return isNaN(t) ? null : (Date.now() - t) / 36e5; }
    function ago(h) {
      if (h === null) return '';
      if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
      if (h < 24) return `${Math.round(h)} h`;
      const d = Math.floor(h / 24); return `${d} dia${d > 1 ? 's' : ''}`;
    }
    function stageAge(l) {
      const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
      if (h === null) return null;
      const lim = LIMIT_H[l.status];
      return { h, text: ago(h), late: lim !== undefined && h > lim };
    }
    function ageChip(l) { const a = stageAge(l); return a ? `<span class="chip ${a.late ? 'late' : 'ok'}" title="Tempo nesta etapa">${ic('clock', 'icon-sm')}${a.text}</span>` : ''; }
    function dateFmt(d, withTime = true) {
      const x = new Date(d); if (isNaN(x)) return '';
      return x.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + (withTime ? ' às ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
    }
    function isToday(d) { const x = new Date(d); return !isNaN(x) && x.toLocaleDateString('en-CA') === new Date().toLocaleDateString('en-CA'); }
    function firstAnswer(l) { return Array.isArray(l.quiz_answers) && l.quiz_answers[0] ? l.quiz_answers[0].resposta : ''; }
    function hasPreAgendamento(l) {
      return Boolean(l.appointment_at || (l.agendamento_resumo && String(l.agendamento_resumo).trim().length > 0) || l.status === 'agendado');
    }
    function preAgendamentoTexto(l) {
      if (l.appointment_at) return dateFmt(l.appointment_at);
      if (l.agendamento_resumo) {
        return String(l.agendamento_resumo).replace('AGENDADO_SUCESSO', '').trim();
      }
      return 'Horário escolhido no Quiz';
    }
    function isLeadStale(l) {
      const activeStages = ['novo_lead_quiz', 'conversando', 'followup_1', 'followup_2', 'followup_3', 'agendado', 'transbordo_humano'];
      if (!activeStages.includes(l.status)) return false;
      const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
      return h !== null && h >= 168; // 7 dias = 168h
    }
    function timeOf(d) {
      const x = new Date(d);
      return !isNaN(x) ? x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
    }

    function toast(msg, err = false) {
      const t = document.getElementById('toast');
      t.innerHTML = ic(err ? 'alert' : 'check', 'icon-sm') + esc(msg);
      t.className = 'toast show' + (err ? ' err' : '');
      clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2600);
    }
    function modal({ title, text, confirmLabel = 'Confirmar', danger = false, input = null }) {
      return new Promise(resolve => {
        const root = document.getElementById('modal-root');
        root.innerHTML = `<div class="modal"><div class="box">
          <h4>${esc(title)}</h4><p>${text}</p>
          ${input ? `<input class="input" id="modal-input" placeholder="${esc(input.placeholder || '')}" autocomplete="off">` : ''}
          <div class="btns"><button class="btn btn-ghost" id="m-no">Cancelar</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="m-yes" ${input ? 'disabled' : ''}>${esc(confirmLabel)}</button></div></div></div>`;
        const yes = root.querySelector('#m-yes'), inp = root.querySelector('#modal-input');
        if (inp) { inp.focus(); inp.addEventListener('input', () => yes.disabled = inp.value.trim().toLowerCase() !== input.match.toLowerCase()); }
        const done = v => { root.innerHTML = ''; resolve(v); };
        root.querySelector('#m-no').onclick = () => done(false);
        yes.onclick = () => done(true);
        root.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) done(false); };
      });
    }

    // =========================================================
    // Login / sessão
    // =========================================================
    const eyeBtn = document.getElementById('toggle-password');
    eyeBtn.innerHTML = ic('eye');
    eyeBtn.onclick = () => {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
      eyeBtn.innerHTML = ic(p.type === 'password' ? 'eye' : 'eyeOff');
    };

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('login-btn'), err = document.getElementById('login-error');
      err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Entrando...';
      const r = await api('get-leads', { tableType: 'b2c' }, pass);
      btn.disabled = false; btn.textContent = 'Entrar';
      if (r.ok) {
        sessionPassword = pass;
        try { localStorage.setItem('crm_password', pass); } catch (e) {}
        leadsB2C = r.data.leads || []; lastSync = new Date();
        showApp();
      } else {
        err.textContent = r.error || 'Senha incorreta.'; err.classList.remove('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      paintIcons();
      let saved = null; try { saved = localStorage.getItem('crm_password'); } catch (e) {}
      if (!saved) return;
      const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Restaurando sessão...';
      const r = await api('get-leads', { tableType: 'b2c' }, saved);
      btn.disabled = false; btn.textContent = 'Entrar';
      if (r.ok) { sessionPassword = saved; leadsB2C = r.data.leads || []; lastSync = new Date(); showApp(); }
      else { try { localStorage.removeItem('crm_password'); } catch (e) {} }
    });

    function showApp() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      render();
      clearInterval(window._auto);
      window._auto = setInterval(() => { if (!openLeadId && document.visibilityState === 'visible') refreshData(true); }, 60000);
    }
    function logout() {
      sessionPassword = ''; leadsB2C = []; leadsB2B = [];
      try { localStorage.removeItem('crm_password'); } catch (e) {}
      clearInterval(window._auto);
      document.getElementById('password').value = '';
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    async function api(fn, body, pass = sessionPassword) {
      try {
        const res = await fetch('/.netlify/functions/' + fn, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass, ...body })
        });
        let data = {}; try { data = await res.json(); } catch (e) {}
        if (!res.ok || data.error) return { ok: false, error: data.error || `Erro do servidor (${res.status})` };
        return { ok: true, data };
      } catch (e) { return { ok: false, error: 'Sem conexão com o servidor.' }; }
    }

    async function refreshData(silent = false) {
      if (!sessionPassword) return;
      document.querySelectorAll('[data-refresh]').forEach(el => el.classList.add('spin'));
      const r = await api('get-leads', { tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      document.querySelectorAll('.spin').forEach(el => el.classList.remove('spin'));
      if (!r.ok) { if (!silent) toast(r.error, true); return; }
      if (view === 'b2b') leadsB2B = r.data.leads || []; else leadsB2C = r.data.leads || [];
      lastSync = new Date();
      render();
      if (!silent) toast('Lista atualizada');
    }

    // =========================================================
    // Navegação e filtros
    // =========================================================
    function setView(v) {
      view = v;
      if (v === 'cold') boardFilter = 'cold';
      else if (v === 'board' && boardFilter === 'cold') boardFilter = 'active';
      document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v));
      if (v === 'b2b' && !leadsB2B.length) refreshData(true);
      if (v !== 'b2b' && !leadsB2C.length) refreshData(true);
      render();
      window.scrollTo({ top: 0 });
    }
    function setBoardFilter(f) {
      boardFilter = f;
      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === f));
      if (f === 'cold' && view !== 'cold') {
        view = 'cold';
        document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'cold'));
      } else if (f !== 'cold' && view === 'cold') {
        view = 'board';
        document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'board'));
      }
      render();
    }
    function setUnit(u) {
      unit = u;
      document.querySelectorAll('#unit-seg button').forEach(b => b.classList.toggle('on', b.dataset.unit === u));
      render();
    }
    function filtered(list) {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const qd = q.replace(/\D/g, '');
      return list.filter(l => {
        if (view !== 'b2b' && unit !== 'all' && l.preferred_unit !== unit) return false;
        if (!q) return true;
        return nameOf(l).toLowerCase().includes(q) || (qd.length >= 3 && phoneOf(l).includes(qd));
      });
    }
    window.addEventListener('scroll', () => document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 4));

    // =========================================================
    // Render
    // =========================================================
    function buckets(list) {
      const novos = list.filter(l => l.status === 'novo_lead_quiz').sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const atencao = list.filter(l => l.status === 'transbordo_humano');
      const followup = list.filter(l => {
        if (['novo_lead_quiz', 'transbordo_humano', 'consulta_realizada', 'no_show', 'perdido'].includes(l.status)) return false;
        if (l.next_action_at && new Date(l.next_action_at) <= endOfToday()) return true;
        if (l.status === 'agendado') return false;
        const a = stageAge(l); return a && a.late;
      }).sort((a, b) => (stageAge(b)?.h || 0) - (stageAge(a)?.h || 0));
      const agendadas = list.filter(l => l.status === 'agendado')
        .sort((a, b) => new Date(a.appointment_at || a.status_changed_at || a.created_at) - new Date(b.appointment_at || b.status_changed_at || b.created_at));
      return { novos, atencao, followup, agendadas };
    }
    function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d; }

    function render() {
      const isB2B = view === 'b2b';
      const list = filtered(isB2B ? leadsB2B : leadsB2C);
      const all = filtered(leadsB2C);
      const b = buckets(all);
      const pending = b.novos.length + b.atencao.length + b.followup.length;
      const coldCount = all.filter(l => ['no_show', 'perdido'].includes(l.status)).length;

      // Contadores de navegação
      document.getElementById('nav-today').textContent = pending;
      document.getElementById('nav-today').classList.toggle('alert', pending > 0);
      document.getElementById('nav-board').textContent = all.length;
      const navCold = document.getElementById('nav-cold');
      if (navCold) navCold.textContent = coldCount;
      document.getElementById('nav-b2b').textContent = leadsB2B.length || '–';
      const tb = document.getElementById('tab-today');
      if (tb) { tb.textContent = pending; tb.classList.toggle('hidden', !pending); }
      const tabCold = document.getElementById('tab-cold');
      if (tabCold) { tabCold.textContent = coldCount; tabCold.classList.toggle('hidden', !coldCount); }
      document.getElementById('sync-label').textContent = lastSync ? 'Atualizado às ' + lastSync.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

      // Títulos
      const titles = {
        today: ['Hoje', 'Central de contatos do dia e quem precisa de atenção agora'],
        board: ['Funil de pacientes', window.matchMedia('(max-width: 820px)').matches ? 'Toque no card para mudar de etapa' : 'Arraste os cards ou clique para mudar de etapa'],
        cold: ['Perdidos & No-Show', 'Contatos frios e ausências prontos para o plano de reaquecimento'],
        b2b: ['Mentoria B2B', 'Aplicações para a mentoria']
      };
      const curTitle = titles[view] || titles.board;
      document.getElementById('page-title').textContent = curTitle[0];
      document.getElementById('page-sub').textContent = curTitle[1];
      document.getElementById('unit-seg').classList.toggle('hidden', isB2B);

      renderKpis(isB2B ? list : all, b, isB2B);

      const isBoardView = view === 'board' || view === 'cold';
      document.getElementById('view-today').classList.toggle('hidden', isBoardView);
      document.getElementById('view-board').classList.toggle('hidden', !isBoardView);

      // Banner de leads parados (> 7 dias)
      renderStaleBanner(all, isB2B);

      if (view === 'today') renderToday(b, isB2B ? list : all);
      else renderBoard(list);

      if (openLeadId) { const l = findLead(openLeadId); if (l) fillDrawer(l); }
    }

    function renderKpis(list, b, isB2B) {
      const novosHoje = list.filter(l => isToday(l.created_at)).length;
      const comPreHoje = list.filter(l => isToday(l.created_at) && hasPreAgendamento(l)).length;
      const semPreHoje = novosHoje - comPreHoje;
      const late = isB2B ? list.filter(l => l.status === 'novo_lead_quiz').length : (b.novos.filter(l => stageAge(l)?.late).length + b.followup.length + b.atencao.length);
      const ag = list.filter(l => l.status === 'agendado').length;
      const cold = list.filter(l => ['no_show', 'perdido'].includes(l.status)).length;
      const k = (cls, icn, label, value, sub = '') => `<div class="kpi"><div class="ic ${cls}">${ic(icn)}</div><div><div class="label">${label}</div><div class="value">${value}${sub ? `<span style="font-size:12px;font-weight:500;color:var(--text-3);margin-left:6px">${sub}</span>` : ''}</div></div></div>`;
      document.getElementById('kpis').innerHTML =
        k('brand', 'inbox', 'Entraram hoje', novosHoje, novosHoje ? `(${comPreHoje} pré / ${semPreHoje} sem)` : '') +
        k('red', 'alert', isB2B ? 'Sem contato' : 'Atenção / Atrasados', late) +
        k('teal', 'calendar', 'Agendadas', ag) +
        k('orange', 'archive', 'Perdidos & No-Show', cold);
    }

    function renderStaleBanner(list, isB2B) {
      const container = document.getElementById('stale-alert-container');
      if (!container) return;
      if (isB2B) { container.innerHTML = ''; return; }
      const staleLeads = list.filter(isLeadStale);
      if (staleLeads.length > 0) {
        container.innerHTML = `
          <div class="stale-banner">
            <div class="stale-info">
              <div class="ic-alert">${ic('alert')}</div>
              <div>
                <div class="stale-title">Existem <b>${staleLeads.length} contatos parados há mais de 7 dias</b> no funil ativo</div>
                <div class="stale-desc">Estes contatos estão gerando poluição visual no funil. Mova-os para <b>Perdidos</b> ou <b>No-Show</b> com 1 clique para iniciar o reaquecimento.</div>
              </div>
            </div>
            <button class="btn-stale" onclick="autoOrganizeStaleLeads()">${ic('archive', 'icon-sm')} Mover para Perdidos / No-Show</button>
          </div>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    function row(l, extra = '') {
      const ph = phoneOf(l);
      return `<div class="row" onclick="openDrawer('${esc(l.id)}')">
        ${avatar(l)}
        <div class="who"><div class="name">${esc(nameOf(l))}</div>
          <div class="meta">${esc(service(l))} · ${unitLabel(l)}${extra ? ' · ' + extra : ''}</div></div>
        ${ageChip(l)}
        ${ph ? `<a class="wa" title="Abrir WhatsApp com mensagem pronta" href="${waLink(l)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('wa', 'icon-sm')}</a>` : ''}
      </div>`;
    }

    function panel(title, hint, items, emptyText, rowFn = row, pillRed = false) {
      return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span class="hint">${hint}</span>
        <span class="pill ${pillRed && items.length ? 'red' : ''}">${items.length}</span></div>
        <div class="rows">${items.length ? items.map(l => rowFn(l)).join('') : `<div class="empty">${ic('party')}<div>${emptyText}</div></div>`}</div></div>`;
    }

    function panelToday(title, hint, items, emptyText, rowFn, customCls = '', accent = '') {
      return `<div class="panel ${customCls}">
        <div class="panel-head">
          <h3>${title}</h3>
          <span class="hint">${hint}</span>
          <span class="pill ${accent}">${items.length}</span>
        </div>
        <div class="rows">
          ${items.length ? items.map(l => rowFn(l)).join('') : `<div class="empty">${ic('party')}<div>${emptyText}</div></div>`}
        </div>
      </div>`;
    }

    // =========================================================
    // 2. SEÇÃO DE GRÁFICOS MODERNOS (Restaurada conforme versão anterior)
    // =========================================================
    function renderAnalytics(list) {
      // 1. Dados dos últimos 7 dias
      const days = [];
      const now = Date.now();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now - i * 86400000);
        const isoKey = d.toLocaleDateString('en-CA');
        const shortDay = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0, 3).toUpperCase();
        const count = list.filter(l => l.created_at && l.created_at.startsWith(isoKey)).length;
        days.push({ isoKey, shortDay, count });
      }
      const maxCount = Math.max(...days.map(d => d.count), 4);

      // SVG Bar Chart
      const chartWidth = 280;
      const barWidth = 22;
      const gap = (chartWidth - (7 * barWidth)) / 8;
      
      let barsSvg = '';
      days.forEach((d, idx) => {
        const x = gap + idx * (barWidth + gap);
        const h = Math.max(4, Math.round((d.count / maxCount) * 52));
        const y = 62 - h;
        const isTodayDay = idx === 6;
        const fill = isTodayDay ? 'url(#barGradToday)' : 'url(#barGrad)';
        barsSvg += `
          <g class="bar-group">
            <title>${d.isoKey}: ${d.count} leads</title>
            <rect x="${x}" y="10" width="${barWidth}" height="52" rx="4" class="bar-track"></rect>
            <rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${fill}"></rect>
            <text x="${x + barWidth/2}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${d.count > 0 ? (isTodayDay ? 'var(--teal)' : 'var(--brand)') : 'var(--text-3)'}">${d.count}</text>
            <text x="${x + barWidth/2}" y="78" text-anchor="middle" font-size="9" font-weight="${isTodayDay ? '700' : '500'}" fill="${isTodayDay ? 'var(--teal)' : 'var(--text-3)'}">${d.shortDay}</text>
          </g>
        `;
      });

      // 2. Especialidades mais procuradas
      const specCounts = {};
      list.forEach(l => {
        const s = service(l);
        specCounts[s] = (specCounts[s] || 0) + 1;
      });
      const topSpecs = Object.entries(specCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);
      const totalSpecs = list.length || 1;

      let specsHtml = '';
      if (topSpecs.length) {
        topSpecs.forEach(([specName, count]) => {
          const pct = Math.round((count / totalSpecs) * 100);
          specsHtml += `
            <div class="metric-row">
              <div class="metric-row-info">
                <span class="metric-name">${esc(specName)}</span>
                <span class="metric-val">${count} <small>(${pct}%)</small></span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        });
      } else {
        specsHtml = '<div class="empty-mini">Nenhum lead com especialidade registrada</div>';
      }

      // 3. Origem e Unidade
      let googleCount = 0, instaCount = 0, siteCount = 0, outrosCount = 0;
      let paulistaCount = 0, granjaCount = 0;
      list.forEach(l => {
        const o = origin(l);
        if (o?.cls === 'google') googleCount++;
        else if (o?.cls === 'insta') instaCount++;
        else if (o?.cls === 'site') siteCount++;
        else outrosCount++;

        if (l.preferred_unit === 'granja_viana') granjaCount++;
        else paulistaCount++;
      });
      const totalOrigin = list.length || 1;

      return `
      <section class="analytics-section">
        <div class="analytics-head">
          <div class="analytics-title">
            <span class="analytics-icon">${ic('chart', 'icon-sm')}</span>
            <h4>Inteligência &amp; Desempenho</h4>
          </div>
          <span class="analytics-sub">Panorama visual baseado nos filtros e no período atual</span>
        </div>
        <div class="analytics-grid">
          <!-- Card 1: Volume 7 dias -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Novos Leads (Últimos 7 dias)</span>
              <span class="badge-total">${days.reduce((acc, d) => acc + d.count, 0)} leads</span>
            </div>
            <svg class="bar-chart-svg" viewBox="0 0 280 88">
              <defs>
                <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#8a42b1"></stop>
                  <stop offset="100%" stop-color="#6b308b"></stop>
                </linearGradient>
                <linearGradient id="barGradToday" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f9f8f"></stop>
                  <stop offset="100%" stop-color="#097a6d"></stop>
                </linearGradient>
              </defs>
              ${barsSvg}
            </svg>
          </div>

          <!-- Card 2: Especialidades -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Top Tratamentos / Especialidades</span>

    function scrollToStage(stageKey) {
      const col = document.querySelector(`.col[data-stage="${stageKey}"]`);

    function renderBoard(list) {
      const board = document.getElementById('board');
      const isB2B = view === 'b2b';

      // Definir quais estágios exibir conforme o filtro da toolbar
      let stagesToShow = STAGES;
      if (!isB2B) {
        if (boardFilter === 'active') {
          // Apenas estágios ativos do funil (esconde No-Show e Perdidos para manter o funil enxuto)
          stagesToShow = STAGES.filter(s => !['no_show', 'perdido'].includes(s.key));
        } else if (boardFilter === 'cold') {
          // Apenas os estágios finais frios: No-Show e Perdidos
          stagesToShow = STAGES.filter(s => ['no_show', 'perdido'].includes(s.key));
        }
      }

      // Atualiza botões da toolbar do funil
      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === boardFilter));

      // Atualiza atalhos rápidos em pills no mobile
      const pillsBar = document.getElementById('mobile-pills-bar');
      if (pillsBar) {
        pillsBar.innerHTML = stagesToShow.map(s => {
          let count = list.filter(l => stageOf(l.status) === s.key);
          if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') count = count.filter(l => !isLeadStale(l));
          return `<button type="button" class="m-pill" onclick="scrollToStage('${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short} (${count.length})</button>`;
        }).join('');
      }

      board.innerHTML = stagesToShow.map(s => {
        let items = list.filter(l => stageOf(l.status) === s.key);
        // No filtro 'active', também ocultamos leads parados > 7 dias para que fiquem fora da poluição visual
        if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') {
          items = items.filter(l => !isLeadStale(l));
        }
        items.sort((a, b) => new Date(b.status_changed_at || b.created_at) - new Date(a.status_changed_at || a.created_at));

        const isColdCol = ['no_show', 'perdido'].includes(s.key);
        const colClass = isColdCol ? (s.key === 'no_show' ? 'col col-noshow' : 'col col-perdido') : 'col';

        return `<div class="${colClass}" data-stage="${s.key}">
          <div class="col-head">
            <span class="dot" style="background:${s.color}"></span>
            <h4>${s.label}</h4>
            <span class="pill ${isColdCol ? (s.key === 'no_show' ? 'orange' : 'slate') : ''}">${items.length}</span>
          </div>
          ${items.length ? items.map(card).join('') : `<div class="col-empty">Nenhum lead aqui</div>`}
        </div>`;
      }).join('');
      bindDnD(board);
    }

    // Arrastar e soltar
    function bindDnD(board) {
      board.querySelectorAll('.card').forEach(c => {
        c.addEventListener('dragstart', e => { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      board.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
        col.addEventListener('drop', e => {
          e.preventDefault(); col.classList.remove('drop');
          const id = e.dataTransfer.getData('text/plain');
          const l = findLead(id);
          if (l && stageOf(l.status) !== col.dataset.stage) moveLead(id, col.dataset.stage);
        });
      });
    }

    // =========================================================
    function findLead(id) { return (view === 'b2b' ? leadsB2B : leadsB2C).find(l => String(l.id) === String(id)); }

    async function moveLead(id, stageKey) {
      const l = findLead(id); if (!l) return;
      const prev = { status: l.status, status_changed_at: l.status_changed_at };
      const status = dbStatus(stageKey);
      l.status = status; l.status_changed_at = new Date().toISOString();
      render();
      const r = await api('manage-lead', { action: 'update_status', id, status, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { Object.assign(l, prev); render(); toast('Não foi possível mover: ' + r.error, true); return; }
      toast(`${nameOf(l).split(' ')[0]} → ${stageInfo(status).label}`);
    }

    async function autoOrganizeStaleLeads() {
      const all = leadsB2C;
      const stale = all.filter(isLeadStale);
      if (stale.length === 0) {
        toast('Nenhum lead parado há mais de 7 dias no funil ativo!');
        return;
      }

      const agendadosCount = stale.filter(l => l.status === 'agendado').length;
      const outrosCount = stale.length - agendadosCount;

      const ok = await modal({
        title: 'Organizar contatos parados (> 7 dias)?',
        text: `Identificamos <b>${stale.length} contatos</b> que estão há mais de 7 dias no funil ativo sem avanço:<br><br>
               • <b>${agendadosCount} agendados</b> sem comparecimento → irão para <b>No-Show</b><br>
               • <b>${outrosCount} contatos</b> parados em Novos/Conversa → irão para <b>Perdidos / Frios</b><br><br>
               Isso despolui seu funil imediatamente e prepara os leads para o reaquecimento. Deseja aplicar?`,
        confirmLabel: 'Sim, Mover para Perdidos / No-Show'
      });

      if (!ok) return;

      const updates = stale.map(l => ({
        id: l.id,
        status: l.status === 'agendado' ? 'no_show' : 'perdido'
      }));

      // Atualização otimista
      updates.forEach(u => {
        const l = findLead(u.id);
        if (l) {
          l.status = u.status;
          l.status_changed_at = new Date().toISOString();
        }
      });
      render();
      toast(`Organizando ${updates.length} leads...`);

      const r = await api('manage-lead', { action: 'bulk_update_status', updates, tableType: 'b2c' });
      if (r.ok) {
        toast(`${updates.length} leads organizados com sucesso em No-Show e Perdidos!`);
        refreshData(true);
      } else {
        toast('Erro ao organizar: ' + r.error, true);
        refreshData(true);
      }
    }

    async function saveFields(id) {
      const l = findLead(id); if (!l) return;
      const note = document.getElementById('d-note').value.trim();
      const nextAction = document.getElementById('d-next').value.trim();
      const nextAt = document.getElementById('d-next-at').value;
      const stamp = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const fields = {
        next_action: nextAction || null,
        next_action_at: nextAt ? new Date(nextAt + 'T09:00:00').toISOString() : null
      };
      if (note) fields.notes = `[${stamp}] ${note}` + (l.notes ? '\n' + l.notes : '');
      const btn = document.getElementById('d-save'); btn.disabled = true; btn.textContent = 'Salvando...';
      const r = await api('manage-lead', { action: 'update_fields', id, fields, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      btn.disabled = false; btn.textContent = 'Salvar';
      if (!r.ok) { toast(r.error, true); return; }
      Object.assign(l, fields);
      document.getElementById('d-note').value = '';
      render(); toast('Anotação salva');
    }

        <div class="d-head">
          ${avatar(l, 'lg')}
          <div class="who"><h3>${esc(nameOf(l))}</h3>
            <div class="meta">${isB2B ? '<span class="chip">Mentoria B2B</span>' : unitChip(l)}<span>${esc(phoneFmt(ph))}</span>${ageChip(l)}</div></div>
          <button class="btn btn-ghost btn-icon" onclick="closeDrawer()" aria-label="Fechar">${ic('x')}</button>
        </div>
        <div class="d-body">
          <div class="d-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <h5 style="margin:0">Etapa do Lead</h5>
              <span class="chip" style="font-weight:600;background:${stageInfo(l.status).color}15;color:${stageInfo(l.status).color}">${stageInfo(l.status).label}</span>
            </div>
            <div class="stage-group-label">Funil Ativo</div>
            <div class="stages stages-active">
              ${STAGES.filter(s => !['consulta_realizada', 'no_show', 'perdido'].includes(s.key)).map(s => `<button class="stage ${cur === s.key ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short}</button>`).join('')}
            </div>
            <div class="stage-group-label">Desfecho / Conclusão</div>
            <div class="stages stages-outcomes">
              <button class="stage ${cur === 'consulta_realizada' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','consulta_realizada')"><span class="dot" style="background:#1f9d55"></span>Atendido</button>
              <button class="stage ${cur === 'no_show' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','no_show')"><span class="dot" style="background:#ea580c"></span>No-Show</button>
              <button class="stage ${cur === 'perdido' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','perdido')"><span class="dot" style="background:#64748b"></span>Perdido</button>
            </div>
          </div>

          ${ph ? `<div class="d-section"><h5>Mensagem de WhatsApp</h5>
            <div class="tpl">${Object.keys(tpls).map(k => `<button data-tpl="${k}" class="${k === tplKey ? 'on' : ''}" onclick="pickTpl('${k}')">${TPL_LABELS[k] || k}</button>`).join('')}</div>
            <textarea class="input" id="d-msg" rows="5">${esc(keepMsg ?? tpls[tplKey])}</textarea>
            <div class="grid2" style="margin-top:8px">
              <button class="btn" onclick="copyMsg()">${ic('copy', 'icon-sm')}Copiar</button>
              <a class="btn btn-wa" id="d-wa" target="_blank" rel="noopener" href="#" onclick="this.href=waLink(findLead('${esc(l.id)}'), document.getElementById('d-msg').value)">${ic('wa', 'icon-sm')}Abrir no WhatsApp</a>
            </div>
            <p class="muted" style="margin:8px 0 0">Depois de enviar, mova o lead de etapa para registrar o contato.</p>
          </div>` : ''}

          ${!isB2B ? `<div class="d-section"><h5>Respostas do quiz</h5>
            <div class="kv" style="margin-bottom:${answers.length ? 12 : 0}px"><dt>Interesse</dt><dd><b>${esc(service(l))}</b></dd></div>
            ${answers.length ? `<div class="qa">${answers.map(a => `<div><div class="q">${esc(a.pergunta)}</div><div class="a">${esc(a.resposta)}</div></div>`).join('')}</div>`
              : '<p class="muted" style="margin:0">Respostas detalhadas não registradas (lead anterior à atualização).</p>'}
            ${l.agendamento_resumo ? `<div class="note-old" style="margin-top:12px"><b>Pré-agendamento registrado:</b><br>${esc(String(l.agendamento_resumo).replace('AGENDADO_SUCESSO', '').trim())}</div>` : ''}
          </div>` : `<div class="d-section"><h5>Aplicação</h5><dl class="kv">${b2bFields.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`}

          <div class="d-section"><h5>Anotações e próximo passo</h5>
            ${l.notes ? `<div class="note-old">${esc(l.notes)}</div>` : ''}
            <textarea class="input" id="d-note" rows="3" placeholder="Ex.: Prefere horário à noite; vai ver com o marido.">${esc(keepNote)}</textarea>
            <div class="grid2" style="margin-top:8px">
              <input class="input" id="d-next" placeholder="Próximo passo" value="${esc(l.next_action || '')}">
              <input class="input" id="d-next-at" type="date" value="${nextDate}">
            </div>
            <button class="btn btn-primary btn-block" id="d-save" style="margin-top:8px" onclick="saveFields('${esc(l.id)}')">Salvar</button>
          </div>

          ${!isB2B ? `<div class="d-section"><h5>Origem</h5><dl class="kv">${origemRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
        </div>
        <div class="d-foot">
          <button class="btn btn-ghost btn-danger" onclick="deleteLead('${esc(l.id)}')">${ic('trash', 'icon-sm')}Excluir</button>
        </div>`;
    }
    function pickTpl(k) {
      const l = findLead(openLeadId); if (!l) return;
      document.getElementById('d-msg').value = templates(l)[k];
      document.querySelectorAll('.tpl button').forEach(b => b.classList.toggle('on', b.dataset.tpl === k));
    }
    async function copyMsg() {
      try { await navigator.clipboard.writeText(document.getElementById('d-msg').value); toast('Mensagem copiada'); }
      catch (e) { toast('Não foi possível copiar', true); }
    }
  </script>
</body>
</html>
