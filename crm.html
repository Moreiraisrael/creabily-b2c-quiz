              <button class="on" data-temp="all" onclick="setTempFilter('all')">Todas</button>
              <button data-temp="hot" onclick="setTempFilter('hot')">🔥 Quentes (&lt; 48h)</button>
              <button data-temp="warm" onclick="setTempFilter('warm')">⚡ Mornos (2-7d)</button>
              <button data-temp="cold" onclick="setTempFilter('cold')">❄️ Frios (&gt; 7d)</button>
            </div>
          </div>
          <div class="filter-divider"></div>
          <div class="filter-group">
            <span class="filter-label">Atendimento:</span>
            <div class="filter-seg" id="attended-seg">
              <button class="on" data-att="all" onclick="setAttendedFilter('all')">Todos</button>
              <button data-att="attended" onclick="setAttendedFilter('attended')">✅ Atendidos</button>
              <button data-att="unattended" onclick="setAttendedFilter('unattended')">⏳ Não Atendidos</button>
            </div>
          </div>
        </div>

        <section class="kpis" id="kpis"></section>
        <div id="stale-alert-container"></div>
        <div id="view-today"></div>
        <div id="view-recovery" class="hidden"></div>
        <div id="view-nps" class="hidden"></div>
        <div id="view-agente" class="hidden"></div>
        <div id="view-board" class="hidden">
          <div class="board-toolbar" id="board-toolbar">
            <div class="board-tabs" id="board-tabs">
              <button class="on" data-bfilter="active" onclick="setBoardFilter('active')">🚀 Funil Ativo (&lt; 7 dias)</button>
              <button data-bfilter="all" onclick="setBoardFilter('all')">📂 Todos os Estágios</button>
              <button data-bfilter="cold" onclick="setBoardFilter('cold')">🧊 Perdidos &amp; No-Show</button>
            </div>
            <button class="btn btn-stale" id="btn-organize-top" onclick="autoOrganizeStaleLeads()"><span data-ic="archive"></span>Organizar Leads Parados (&gt; 7 dias)</button>
          </div>
          <div id="mobile-pills-bar" class="mobile-only mobile-board-pills"></div>
          <div class="board" id="board"></div>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <button data-view="today" class="active" onclick="setView('today')"><span data-ic="sun"></span>Hoje<span class="badge hidden" id="tab-today"></span></button>
      <button data-view="board" onclick="setView('board')"><span data-ic="columns"></span>Funil</button>
      <button data-view="nps" onclick="setView('nps')"><span data-ic="star"></span>NPS<span class="badge hidden" id="tab-nps"></span></button>
      <button data-view="agente" onclick="setView('agente')"><span data-ic="calendar"></span>Agente<span class="badge hidden" id="tab-agente"></span></button>
      <button data-view="recovery" onclick="setView('recovery')"><span data-ic="target"></span>Recuperar<span class="badge hidden" id="tab-recovery"></span></button>
      <button data-view="cold" onclick="setView('cold')"><span data-ic="archive"></span>Perdidos<span class="badge hidden" id="tab-cold"></span></button>
      <button data-view="b2b" onclick="setView('b2b')"><span data-ic="briefcase"></span>B2B</button>
    </nav>
  </div>

  <!-- ================= DRAWER ================= -->
  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>

  <script>
    // =========================================================
    // Ícones (SVG inline, sem dependências externas)
    // =========================================================
    const ICONS = {
      chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      columns: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
      briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
      eyeOff: '<path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
      wa: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21Z"/><path d="M9 9.5c.3 2 2.3 4.2 4.5 4.6l1.2-1.2 1.8.8-.4 1.6c-3.8.4-8-3.6-7.8-7.4L9.9 7.5l.9 1.7L9 9.5Z" fill="currentColor" stroke="none"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6l3.5-7Z"/>',
      alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
      headset: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
      chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/>',
      party: '<path d="m3 21 5-14 9 9-14 5Z"/><path d="M14 4l1-2M19 9l2-1M17 3l-1 3M21 5l-3 1"/>',
      copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
      userX: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
      flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
      target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
    };
    function ic(name, cls = '') { return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`; }
    function paintIcons(root = document) { root.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic).replace('<svg ', `<svg ${el.id ? `id="${el.id}" ` : ''}${el.dataset.ic === 'refresh' ? 'data-refresh ' : ''}`); }); }

    // =========================================================
    // Estado
    // =========================================================
    let sessionPassword = '';
    let leadsB2C = [];
    let leadsB2B = [];
    let npsFeedbacks = [];
    let npsCategoryFilter = 'all';
    let npsUnitFilter = 'all';
    let agenteData = null;
    let agenteLoading = false;
    let agenteUnitFilter = 'all';
    let agenteConvenioFilter = 'all';
    let agenteStatusFilter = 'all';
    let agenteDayFilter = 'all';
    let agenteSearchQuery = '';
    let agenteCurrentPage = 1;
    const AGENTE_PAGE_SIZE = 50;
    let agenteChartsOpen = true;
    let agenteViewMode = 'smart'; // 'smart' (ergonômica sem scroll lateral) ou 'table' (completa A:N)
    let view = 'today';
    let boardFilter = 'active'; // 'active', 'all', 'cold'
    let unit = 'all';
    let tempFilter = 'all'; // 'all', 'hot', 'warm', 'cold'
    let attendedFilter = 'all'; // 'all', 'attended', 'unattended'
    let openLeadId = null;
    let lastSync = null;

    // Classificação de temperatura e status de atendimento
    function leadTemperature(l) {
      if (['no_show', 'perdido'].includes(l.status)) return { key: 'cold', label: 'Frio', icon: '❄️', tag: '❄️ Frio', cls: 'cold' };
      const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
      if (h === null) return { key: 'warm', label: 'Morno', icon: '⚡', tag: '⚡ Morno', cls: 'warm' };
      if (h < 48) return { key: 'hot', label: 'Quente', icon: '🔥', tag: '🔥 Quente', cls: 'hot' };
      if (h < 168) return { key: 'warm', label: 'Morno', icon: '⚡', tag: '⚡ Morno', cls: 'warm' };
      return { key: 'cold', label: 'Frio', icon: '❄️', tag: '❄️ Frio', cls: 'cold' };
    }
    function isAttended(l) {
      return ['consulta_realizada', 'agendado'].includes(l.status);
    }
    function setTempFilter(t) {
      tempFilter = t;
      document.querySelectorAll('#temp-seg button').forEach(b => b.classList.toggle('on', b.dataset.temp === t));
      render();
    }
    function setAttendedFilter(a) {
      attendedFilter = a;
      document.querySelectorAll('#attended-seg button').forEach(b => b.classList.toggle('on', b.dataset.att === a));
      render();
    }

    // Etapas (mesmos status do banco)
    const STAGES = [
      { key: 'novo_lead_quiz', label: 'Novos', short: 'Novo', color: '#6b308b', ic: 'inbox' },
      { key: 'conversando', label: 'Em conversa', short: 'Conversa', color: '#2f6fd6', ic: 'chat' },
      { key: 'followup', label: 'Follow-up', short: 'Follow-up', color: '#c27a0e', ic: 'clock' },
      { key: 'agendado', label: 'Agendada', short: 'Agendada', color: '#0f9f8f', ic: 'calendar' },
      { key: 'consulta_realizada', label: 'Atendido', short: 'Atendido', color: '#1f9d55', ic: 'check' },
      { key: 'transbordo_humano', label: 'Atenção humana', short: 'Atenção', color: '#d93f3f', ic: 'headset' },
      { key: 'no_show', label: 'No-Show', short: 'No-Show', color: '#ea580c', ic: 'userX' },
      { key: 'perdido', label: 'Perdidos', short: 'Perdido', color: '#64748b', ic: 'archive' }
    ];
    const stageOf = s => (['followup_1', 'followup_2', 'followup_3'].includes(s) ? 'followup' : s);
    const stageInfo = k => STAGES.find(s => s.key === stageOf(k)) || STAGES[0];
    const dbStatus = k => (k === 'followup' ? 'followup_1' : k);

    // Prazos (horas) para considerar o lead atrasado na etapa
    const LIMIT_H = { novo_lead_quiz: 1, conversando: 24, followup_1: 48, followup_2: 72, followup_3: 96, transbordo_humano: 2, agendado: 48, no_show: 168, perdido: 168 };

    // =========================================================
    // Tema Claro / Escuro
    // =========================================================
    function initTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem('crm_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e) {}
      document.documentElement.setAttribute('data-theme', saved);
      paintThemeIcon();
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try { localStorage.setItem('crm_theme', cur); } catch(e) {}
      paintThemeIcon();
    }
    function paintThemeIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.getElementById('theme-btn');
      if (btn) btn.innerHTML = ic(isDark ? 'sun' : 'moon');
    }

    // =========================================================
    // Utilitários
    // =========================================================
    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    const nameOf = l => (l.name || l.nome || 'Sem nome').trim();
    const firstName = l => { const f = nameOf(l).split(/\s+/)[0] || ''; return f.charAt(0).toUpperCase() + f.slice(1).toLowerCase(); };
    function phoneOf(l) {
      let n = String(l.phone || l.whatsapp || '').replace(/\D/g, '');
      if (n && !n.startsWith('55')) n = '55' + n;
      return n;
    }
    function phoneFmt(n) { return n && n.length >= 12 ? `(${n.slice(2, 4)}) ${n.slice(4, n.length - 4)}-${n.slice(-4)}` : (n || 'Sem telefone'); }
    function initials(l) { const p = nameOf(l).split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
    const AV_COLORS = ['#6b308b', '#0f9f8f', '#2f6fd6', '#c2410c', '#9d4edd', '#0e7490', '#be185d', '#4d7c0f'];
    function avColor(l) { let h = 0; for (const c of String(l.id || nameOf(l))) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
    function avatar(l, cls = '') { return `<div class="avatar ${cls}" style="background:${avColor(l)}">${esc(initials(l))}</div>`; }
    const unitKey = l => (l.preferred_unit === 'granja_viana' ? 'granja' : 'paulista');
    const unitLabel = l => (l.preferred_unit === 'granja_viana' ? 'Granja Viana' : 'Paulista');
    function unitChip(l) { return `<span class="chip ${unitKey(l)}">${unitLabel(l)}</span>`; }
    const service = l => (l.treatment_interest && l.treatment_interest !== 'Não informado' ? l.treatment_interest : (l.main_complaint || 'Saúde integrada'));

    function origin(l) {
      const src = (l.utm_source || '').toLowerCase();
      if (l.gclid || src === 'google' || src === 'google_ads') return { label: 'Google Ads', cls: 'google' };
      if (src.includes('insta') || src === 'ig' || src.includes('facebook') || src === 'meta') return { label: 'Instagram', cls: 'insta' };
      if (src === 'site') return { label: 'Site', cls: 'site' };
      if (src) return { label: src, cls: '' };
      return null;
    }
    function hoursSince(d) { const t = d ? new Date(d).getTime() : NaN; return isNaN(t) ? null : (Date.now() - t) / 36e5; }
    function ago(h) {
      if (h === null) return '';
      if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
      if (h < 24) return `${Math.round(h)} h`;
      const d = Math.floor(h / 24); return `${d} dia${d > 1 ? 's' : ''}`;
    }
    function stageAge(l) {
      const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
      if (h === null) return null;
      const lim = LIMIT_H[l.status];
      return { h, text: ago(h), late: lim !== undefined && h > lim };
    }
    function ageChip(l) { const a = stageAge(l); return a ? `<span class="chip ${a.late ? 'late' : 'ok'}" title="Tempo nesta etapa">${ic('clock', 'icon-sm')}${a.text}</span>` : ''; }
    function dateFmt(d, withTime = true) {
      const x = new Date(d); if (isNaN(x)) return '';
      return x.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + (withTime ? ' às ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
    }
    function isToday(d) { const x = new Date(d); return !isNaN(x) && x.toLocaleDateString('en-CA') === new Date().toLocaleDateString('en-CA'); }
    function firstAnswer(l) { return Array.isArray(l.quiz_answers) && l.quiz_answers[0] ? l.quiz_answers[0].resposta : ''; }
    function hasPreAgendamento(l) {
      return Boolean(l.appointment_at || (l.agendamento_resumo && String(l.agendamento_resumo).trim().length > 0) || l.status === 'agendado');
    }
    function preAgendamentoTexto(l) {
      if (l.appointment_at) return dateFmt(l.appointment_at);
      if (l.agendamento_resumo) {
        return String(l.agendamento_resumo).replace('AGENDADO_SUCESSO', '').trim();
      }
      return 'Horário escolhido no Quiz';
    }
    function isLeadStale(l) {
      const activeStages = ['novo_lead_quiz', 'conversando', 'followup_1', 'followup_2', 'followup_3', 'agendado', 'transbordo_humano'];
      if (!activeStages.includes(l.status)) return false;
      const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
      return h !== null && h >= 168; // 7 dias = 168h
    }
    function timeOf(d) {
      const x = new Date(d);
      return !isNaN(x) ? x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
    }

    function toast(msg, err = false) {
      const t = document.getElementById('toast');
      t.innerHTML = ic(err ? 'alert' : 'check', 'icon-sm') + esc(msg);
      t.className = 'toast show' + (err ? ' err' : '');
      clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2600);
    }
    function modal({ title, text, confirmLabel = 'Confirmar', danger = false, input = null }) {
      return new Promise(resolve => {
        const root = document.getElementById('modal-root');
        root.innerHTML = `<div class="modal"><div class="box">
          <h4>${esc(title)}</h4><p>${text}</p>
          ${input ? `<input class="input" id="modal-input" placeholder="${esc(input.placeholder || '')}" autocomplete="off">` : ''}
          <div class="btns"><button class="btn btn-ghost" id="m-no">Cancelar</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="m-yes" ${input ? 'disabled' : ''}>${esc(confirmLabel)}</button></div></div></div>`;
        const yes = root.querySelector('#m-yes'), inp = root.querySelector('#modal-input');
        if (inp) { inp.focus(); inp.addEventListener('input', () => yes.disabled = inp.value.trim().toLowerCase() !== input.match.toLowerCase()); }
        const done = v => { root.innerHTML = ''; resolve(v); };
        root.querySelector('#m-no').onclick = () => done(false);
        yes.onclick = () => done(true);
        root.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) done(false); };
      });
    }

    // =========================================================
    // Login / sessão
    // =========================================================
    const eyeBtn = document.getElementById('toggle-password');
    eyeBtn.innerHTML = ic('eye');
    eyeBtn.onclick = () => {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
      eyeBtn.innerHTML = ic(p.type === 'password' ? 'eye' : 'eyeOff');
    };

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('login-btn'), err = document.getElementById('login-error');
      err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Entrando...';
      const r = await api('get-leads', { tableType: 'b2c' }, pass);
      btn.disabled = false; btn.textContent = 'Entrar';
      if (r.ok) {
        sessionPassword = pass;
        try { localStorage.setItem('crm_password', pass); } catch (e) {}
        leadsB2C = r.data.leads || []; lastSync = new Date();
        showApp();
      } else {
        err.textContent = r.error || 'Senha incorreta.'; err.classList.remove('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      paintIcons();
      let saved = null; try { saved = localStorage.getItem('crm_password'); } catch (e) {}
      if (!saved) return;
      const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Restaurando sessão...';
      const r = await api('get-leads', { tableType: 'b2c' }, saved);
      btn.disabled = false; btn.textContent = 'Entrar';
      if (r.ok) { sessionPassword = saved; leadsB2C = r.data.leads || []; lastSync = new Date(); showApp(); }
      else { try { localStorage.removeItem('crm_password'); } catch (e) {} }
    });

    function showApp() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      render();
      loadNpsFeedbacks(true);
      loadAgenteData(false);
      clearInterval(window._auto);
      window._auto = setInterval(() => { if (!openLeadId && document.visibilityState === 'visible') refreshData(true); }, 60000);
    }
    function logout() {
      sessionPassword = ''; leadsB2C = []; leadsB2B = [];
      try { localStorage.removeItem('crm_password'); } catch (e) {}
      clearInterval(window._auto);
      document.getElementById('password').value = '';
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    async function api(fn, body, pass = sessionPassword) {
      try {
        const res = await fetch('/.netlify/functions/' + fn, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass, ...body })
        });
        let data = {}; try { data = await res.json(); } catch (e) {}
        if (!res.ok || data.error) return { ok: false, error: data.error || `Erro do servidor (${res.status})` };
        return { ok: true, data };
      } catch (e) { return { ok: false, error: 'Sem conexão com o servidor.' }; }
    }

    async function refreshData(silent = false) {
      if (!sessionPassword) return;
      document.querySelectorAll('[data-refresh]').forEach(el => el.classList.add('spin'));
      const r = await api('get-leads', { tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      document.querySelectorAll('.spin').forEach(el => el.classList.remove('spin'));
      if (!r.ok) { if (!silent) toast(r.error, true); return; }
      if (view === 'b2b') leadsB2B = r.data.leads || []; else leadsB2C = r.data.leads || [];
      loadNpsFeedbacks(true);
      loadAgenteData(false);
      lastSync = new Date();
      render();
      if (!silent) toast('Lista atualizada');
    }

    async function loadNpsFeedbacks(silent = false) {
      if (!sessionPassword) return;
      try {
        const r = await api('get-leads', { tableType: 'nps' });
        if (r.ok && r.data.feedbacks) {
          npsFeedbacks = r.data.feedbacks;
          const badge = document.getElementById('nav-nps');
          if (badge) badge.textContent = npsFeedbacks.length;
          const tabBadge = document.getElementById('tab-nps');
          if (tabBadge) {
            tabBadge.textContent = npsFeedbacks.length;
            tabBadge.classList.toggle('hidden', !npsFeedbacks.length);
          }
          if (view === 'nps') renderNpsView();
        }
      } catch (e) {
        console.warn('Erro ao carregar NPS:', e);
      }
    }

    // =========================================================
    // Navegação e filtros
    // =========================================================
    function setView(v) {
      view = v;
      if (v === 'cold') boardFilter = 'cold';
      else if (v === 'board' && boardFilter === 'cold') boardFilter = 'active';
      document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v));
      if (v === 'b2b' && !leadsB2B.length) refreshData(true);
      if (v !== 'b2b' && v !== 'agente' && !leadsB2C.length) refreshData(true);
      if (v === 'nps') loadNpsFeedbacks(true);
      if (v === 'agente') loadAgenteData();
      render();
      window.scrollTo({ top: 0 });
    }
    function setBoardFilter(f) {
      boardFilter = f;
      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === f));
      if (f === 'cold' && view !== 'cold') {
        view = 'cold';
        document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'cold'));
      } else if (f !== 'cold' && view === 'cold') {
        view = 'board';
        document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'board'));
      }
      render();
    }
    function setUnit(u) {
      unit = u;
      document.querySelectorAll('#unit-seg button').forEach(b => b.classList.toggle('on', b.dataset.unit === u));
      render();
    }
    function filtered(list) {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const qd = q.replace(/\D/g, '');
      return list.filter(l => {
        if (view !== 'b2b' && unit !== 'all' && l.preferred_unit !== unit) return false;
        if (tempFilter !== 'all') {
          const t = leadTemperature(l).key;
          if (t !== tempFilter) return false;
        }
        if (attendedFilter !== 'all') {
          const att = isAttended(l);
          if (attendedFilter === 'attended' && !att) return false;
          if (attendedFilter === 'unattended' && att) return false;
        }
        if (!q) return true;
        return nameOf(l).toLowerCase().includes(q) || (qd.length >= 3 && phoneOf(l).includes(qd));
      });
    }
    window.addEventListener('scroll', () => document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 4));

    // =========================================================
    // Render
    // =========================================================
    function buckets(list) {
      const novos = list.filter(l => l.status === 'novo_lead_quiz').sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const atencao = list.filter(l => l.status === 'transbordo_humano');
      const followup = list.filter(l => {
        if (['novo_lead_quiz', 'transbordo_humano', 'consulta_realizada', 'no_show', 'perdido'].includes(l.status)) return false;
        if (l.next_action_at && new Date(l.next_action_at) <= endOfToday()) return true;
        if (l.status === 'agendado') return false;
        const a = stageAge(l); return a && a.late;
      }).sort((a, b) => (stageAge(b)?.h || 0) - (stageAge(a)?.h || 0));
      const agendadas = list.filter(l => l.status === 'agendado')
        .sort((a, b) => new Date(a.appointment_at || a.status_changed_at || a.created_at) - new Date(b.appointment_at || b.status_changed_at || b.created_at));
      return { novos, atencao, followup, agendadas };
    }
    function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d; }

    function render() {
      const isB2B = view === 'b2b';
      const list = filtered(isB2B ? leadsB2B : leadsB2C);
      const all = filtered(leadsB2C);
      const b = buckets(all);
      const pending = b.novos.length + b.atencao.length + b.followup.length;
      const coldCount = all.filter(l => ['no_show', 'perdido'].includes(l.status)).length;

      // Recuperador ativo
      const recQueues = getRecoveryQueues(all);
      const totalRecovery = recQueues.posQuiz.length + recQueues.retomada.length + recQueues.frios.length;

      // Contadores de navegação
      document.getElementById('nav-today').textContent = pending;
      document.getElementById('nav-today').classList.toggle('alert', pending > 0);
      document.getElementById('nav-board').textContent = all.length;
      const navCold = document.getElementById('nav-cold');
      if (navCold) navCold.textContent = coldCount;
      const navRec = document.getElementById('nav-recovery');
      if (navRec) { navRec.textContent = totalRecovery; navRec.classList.toggle('alert', totalRecovery > 0); }
      const tabRec = document.getElementById('tab-recovery');
      if (tabRec) { tabRec.textContent = totalRecovery; tabRec.classList.toggle('hidden', !totalRecovery); }
      document.getElementById('nav-b2b').textContent = leadsB2B.length || '–';
      const tb = document.getElementById('tab-today');
      if (tb) { tb.textContent = pending; tb.classList.toggle('hidden', !pending); }
      const tabCold = document.getElementById('tab-cold');
      if (tabCold) { tabCold.textContent = coldCount; tabCold.classList.toggle('hidden', !coldCount); }
      document.getElementById('sync-label').textContent = lastSync ? 'Atualizado às ' + lastSync.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

      // Títulos
      const titles = {
        today: ['Hoje', 'Central de contatos do dia e quem precisa de atenção agora'],
        board: ['Funil de pacientes', window.matchMedia('(max-width: 820px)').matches ? 'Toque no card para mudar de etapa' : 'Arraste os cards ou clique para mudar de etapa'],
        recovery: ['Recuperador Ativo de Leads', 'Resgate imediato pós-quiz, retomada de turno e reaquecimento ativo'],
        cold: ['Perdidos & No-Show', 'Contatos frios e ausências prontos para o plano de reaquecimento'],
        nps: ['Satisfação & NPS da Creabily', 'Mural de avaliações, score de qualidade e direcionamento para o Google Maps'],
        agente: ['Agente de Conferência Diária — Outubro 2026', 'Gestão, auditoria e validação administrativa integrada ao Supabase (PostgreSQL)'],
        b2b: ['Mentoria B2B', 'Aplicações para a mentoria']
      };
      const curTitle = titles[view] || titles.board;
      document.getElementById('page-title').textContent = curTitle[0];
      document.getElementById('page-sub').textContent = curTitle[1];
      document.getElementById('unit-seg').classList.toggle('hidden', isB2B || view === 'agente');

      renderKpis(isB2B ? list : all, b, isB2B);

      const isTodayView = view === 'today';
      const isRecoveryView = view === 'recovery';
      const isBoardView = view === 'board' || view === 'cold';
      const isNpsView = view === 'nps';
      const isAgenteView = view === 'agente';

      document.getElementById('view-today').classList.toggle('hidden', !isTodayView);
      document.getElementById('view-recovery').classList.toggle('hidden', !isRecoveryView);
      document.getElementById('view-board').classList.toggle('hidden', !isBoardView);
      document.getElementById('view-nps').classList.toggle('hidden', !isNpsView);
      const viewAgenteEl = document.getElementById('view-agente');
      if (viewAgenteEl) viewAgenteEl.classList.toggle('hidden', !isAgenteView);
      document.getElementById('kpis').classList.toggle('hidden', isNpsView || isAgenteView);

      // Barra de filtros rápidos é exibida nas visualizações relevantes
      const filterBar = document.getElementById('global-filter-bar');
      if (filterBar) filterBar.classList.toggle('hidden', isB2B || isNpsView || isAgenteView);

      // Banner de leads parados (> 7 dias)
      renderStaleBanner(all, isB2B || isNpsView || isAgenteView);

      if (isTodayView) renderToday(b, isB2B ? list : all);
      else if (isRecoveryView) renderRecovery(list, recQueues);
      else if (isNpsView) renderNpsView();
      else if (isAgenteView) renderAgenteView();
      else renderBoard(list);

      if (openLeadId) { const l = findLead(openLeadId); if (l) fillDrawer(l); }
    }

    function renderKpis(list, b, isB2B) {
      const novosHoje = list.filter(l => isToday(l.created_at)).length;
      const comPreHoje = list.filter(l => isToday(l.created_at) && hasPreAgendamento(l)).length;
      const semPreHoje = novosHoje - comPreHoje;
      const late = isB2B ? list.filter(l => l.status === 'novo_lead_quiz').length : (b.novos.filter(l => stageAge(l)?.late).length + b.followup.length + b.atencao.length);
      const ag = list.filter(l => l.status === 'agendado').length;
      const cold = list.filter(l => ['no_show', 'perdido'].includes(l.status)).length;
      const k = (cls, icn, label, value, sub = '') => `<div class="kpi"><div class="ic ${cls}">${ic(icn)}</div><div><div class="label">${label}</div><div class="value">${value}${sub ? `<span style="font-size:12px;font-weight:500;color:var(--text-3);margin-left:6px">${sub}</span>` : ''}</div></div></div>`;
      document.getElementById('kpis').innerHTML =
        k('brand', 'inbox', 'Entraram hoje', novosHoje, novosHoje ? `(${comPreHoje} pré / ${semPreHoje} sem)` : '') +
        k('red', 'alert', isB2B ? 'Sem contato' : 'Atenção / Atrasados', late) +
        k('teal', 'calendar', 'Agendadas', ag) +
        k('orange', 'archive', 'Perdidos & No-Show', cold);
    }

    function renderStaleBanner(list, isB2B) {
      const container = document.getElementById('stale-alert-container');
      if (!container) return;
      if (isB2B) { container.innerHTML = ''; return; }
      const staleLeads = list.filter(isLeadStale);
      if (staleLeads.length > 0) {
        container.innerHTML = `
          <div class="stale-banner">
            <div class="stale-info">
              <div class="ic-alert">${ic('alert')}</div>
              <div>
                <div class="stale-title">Existem <b>${staleLeads.length} contatos parados há mais de 7 dias</b> no funil ativo</div>
                <div class="stale-desc">Estes contatos estão gerando poluição visual no funil. Mova-os para <b>Perdidos</b> ou <b>No-Show</b> com 1 clique para iniciar o reaquecimento.</div>
              </div>
            </div>
            <button class="btn-stale" onclick="autoOrganizeStaleLeads()">${ic('archive', 'icon-sm')} Mover para Perdidos / No-Show</button>
          </div>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    function row(l, extra = '') {
      const ph = phoneOf(l);
      return `<div class="row" onclick="openDrawer('${esc(l.id)}')">
        ${avatar(l)}
        <div class="who"><div class="name">${esc(nameOf(l))}</div>
          <div class="meta">${esc(service(l))} · ${unitLabel(l)}${extra ? ' · ' + extra : ''}</div></div>
        ${ageChip(l)}
        ${ph ? `<a class="wa" title="Abrir WhatsApp com mensagem pronta" href="${waLink(l)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('wa', 'icon-sm')}</a>` : ''}
      </div>`;
    }

    function panel(title, hint, items, emptyText, rowFn = row, pillRed = false) {
      return `<div class="panel"><div class="panel-head"><h3>${title}</h3><span class="hint">${hint}</span>
        <span class="pill ${pillRed && items.length ? 'red' : ''}">${items.length}</span></div>
        <div class="rows">${items.length ? items.map(l => rowFn(l)).join('') : `<div class="empty">${ic('party')}<div>${emptyText}</div></div>`}</div></div>`;
    }

    function panelToday(title, hint, items, emptyText, rowFn, customCls = '', accent = '') {
      return `<div class="panel ${customCls}">
        <div class="panel-head">
          <h3>${title}</h3>
          <span class="hint">${hint}</span>
          <span class="pill ${accent}">${items.length}</span>
        </div>
        <div class="rows">
          ${items.length ? items.map(l => rowFn(l)).join('') : `<div class="empty">${ic('party')}<div>${emptyText}</div></div>`}
        </div>
      </div>`;
    }

    // =========================================================
    // 2. SEÇÃO DE GRÁFICOS MODERNOS (Restaurada conforme versão anterior)
    // =========================================================
    function renderAnalytics(list) {
      // 1. Dados dos últimos 7 dias
      const days = [];
      const now = Date.now();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now - i * 86400000);
        const isoKey = d.toLocaleDateString('en-CA');
        const shortDay = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0, 3).toUpperCase();
        const count = list.filter(l => l.created_at && l.created_at.startsWith(isoKey)).length;
        days.push({ isoKey, shortDay, count });
      }
      const maxCount = Math.max(...days.map(d => d.count), 4);

      // SVG Bar Chart
      const chartWidth = 280;
      const barWidth = 22;
      const gap = (chartWidth - (7 * barWidth)) / 8;
      
      let barsSvg = '';
      days.forEach((d, idx) => {
        const x = gap + idx * (barWidth + gap);
        const h = Math.max(4, Math.round((d.count / maxCount) * 52));
        const y = 62 - h;
        const isTodayDay = idx === 6;
        const fill = isTodayDay ? 'url(#barGradToday)' : 'url(#barGrad)';
        barsSvg += `
          <g class="bar-group">
            <title>${d.isoKey}: ${d.count} leads</title>
            <rect x="${x}" y="10" width="${barWidth}" height="52" rx="4" class="bar-track"></rect>
            <rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${fill}"></rect>
            <text x="${x + barWidth/2}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${d.count > 0 ? (isTodayDay ? 'var(--teal)' : 'var(--brand)') : 'var(--text-3)'}">${d.count}</text>
            <text x="${x + barWidth/2}" y="78" text-anchor="middle" font-size="9" font-weight="${isTodayDay ? '700' : '500'}" fill="${isTodayDay ? 'var(--teal)' : 'var(--text-3)'}">${d.shortDay}</text>
          </g>
        `;
      });

      // 2. Especialidades mais procuradas
      const specCounts = {};
      list.forEach(l => {
        const s = service(l);
        specCounts[s] = (specCounts[s] || 0) + 1;
      });
      const topSpecs = Object.entries(specCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);
      const totalSpecs = list.length || 1;

      let specsHtml = '';
      if (topSpecs.length) {
        topSpecs.forEach(([specName, count]) => {
          const pct = Math.round((count / totalSpecs) * 100);
          specsHtml += `
            <div class="metric-row">
              <div class="metric-row-info">
                <span class="metric-name">${esc(specName)}</span>
                <span class="metric-val">${count} <small>(${pct}%)</small></span>
              </div>
              <div class="metric-bar-bg">
                <div class="metric-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        });
      } else {
        specsHtml = '<div class="empty-mini">Nenhum lead com especialidade registrada</div>';
      }

      // 3. Origem e Unidade
      let googleCount = 0, instaCount = 0, siteCount = 0, outrosCount = 0;
      let paulistaCount = 0, granjaCount = 0;
      list.forEach(l => {
        const o = origin(l);
        if (o?.cls === 'google') googleCount++;
        else if (o?.cls === 'insta') instaCount++;
        else if (o?.cls === 'site') siteCount++;
        else outrosCount++;

        if (l.preferred_unit === 'granja_viana') granjaCount++;
        else paulistaCount++;
      });
      const totalOrigin = list.length || 1;

      return `
      <section class="analytics-section">
        <div class="analytics-head">
          <div class="analytics-title">
            <span class="analytics-icon">${ic('chart', 'icon-sm')}</span>
            <h4>Inteligência &amp; Desempenho</h4>
          </div>
          <span class="analytics-sub">Panorama visual baseado nos filtros e no período atual</span>
        </div>
        <div class="analytics-grid">
          <!-- Card 1: Volume 7 dias -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Novos Leads (Últimos 7 dias)</span>
              <span class="badge-total">${days.reduce((acc, d) => acc + d.count, 0)} leads</span>
            </div>
            <svg class="bar-chart-svg" viewBox="0 0 280 88">
              <defs>
                <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#8a42b1"></stop>
                  <stop offset="100%" stop-color="#6b308b"></stop>
                </linearGradient>
                <linearGradient id="barGradToday" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f9f8f"></stop>
                  <stop offset="100%" stop-color="#097a6d"></stop>
                </linearGradient>
              </defs>
              ${barsSvg}
            </svg>
          </div>

          <!-- Card 2: Especialidades -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Top Tratamentos / Especialidades</span>
              <span class="badge-total">${Object.keys(specCounts).length} áreas</span>
            </div>
            <div class="metric-list">
              ${specsHtml}
            </div>
          </div>

          <!-- Card 3: Origem & Unidade -->
          <div class="chart-box">
            <div class="chart-box-title">
              <span>Origem dos Leads &amp; Unidade</span>
              <span class="badge-total">${list.length} total</span>
            </div>
            <div class="channel-distribution">
              <div class="channel-item">
                <span class="chip google">Google Ads: ${googleCount}</span>
                <span class="chip insta">Instagram: ${instaCount}</span>
                <span class="chip site">Site: ${siteCount}</span>
              </div>
              <div class="unit-ratio" style="margin-top:14px">
                <div class="unit-ratio-labels">
                  <span>Paulista: <b>${paulistaCount}</b></span>
                  <span>Granja Viana: <b>${granjaCount}</b></span>
                </div>
                <div class="unit-ratio-bar">
                  <div class="unit-ratio-seg paulista" style="width:${Math.round((paulistaCount / totalOrigin) * 100)}%" title="Paulista"></div>
                  <div class="unit-ratio-seg granja" style="width:${Math.round((granjaCount / totalOrigin) * 100)}%" title="Granja Viana"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      `;
    }

    // =========================================================
    // 3. TELA HOJE (Estritamente dados do dia, sem poluição)
    // =========================================================
    function renderToday(b, allList = []) {
      const all = allList.length ? allList : filtered(leadsB2C);
      const leadsHoje = all.filter(l => isToday(l.created_at)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const comPre = leadsHoje.filter(hasPreAgendamento);
      const semPre = leadsHoje.filter(l => !hasPreAgendamento(l));

      const hojeExtenso = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const hojeCapitalizado = hojeExtenso.charAt(0).toUpperCase() + hojeExtenso.slice(1);

      // Card customizado para o paciente que entrou hoje com pré-agendamento
      const rowPreHoje = l => {
        const ph = phoneOf(l);
        const quando = preAgendamentoTexto(l);
        const horaEntrada = timeOf(l.created_at);
        const horaTexto = horaEntrada ? ` · Entrou às ${horaEntrada} (${ago(hoursSince(l.created_at))})` : '';
        const msgPre = templates(l).confirmar_pre;
        return `<div class="row row-today" onclick="openDrawer('${esc(l.id)}')">
          ${avatar(l)}
          <div class="who">
            <div class="name">${esc(nameOf(l))}</div>
            <div class="meta">
              ${unitChip(l)}
              <span class="slot-pill">${ic('calendar', 'icon-sm')}${esc(quando)}</span>
              <span>${esc(service(l))}${horaTexto}</span>
            </div>
          </div>
          ${ph ? `<a class="btn-action-wa" href="${waLink(l, msgPre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Confirmar pré-agendamento no WhatsApp">${ic('wa', 'icon-sm')}Confirmar Agendamento</a>` : ''}
        </div>`;
      };

      // Card customizado para o paciente que entrou hoje SEM pré-agendamento
      const rowSemPreHoje = l => {
        const ph = phoneOf(l);
        const horaEntrada = timeOf(l.created_at);
        const horaTexto = horaEntrada ? ` · Entrou às ${horaEntrada} (${ago(hoursSince(l.created_at))})` : '';
        const msgAgendar = templates(l).agendar_novo;
        return `<div class="row row-today" onclick="openDrawer('${esc(l.id)}')">
          ${avatar(l)}
          <div class="who">
            <div class="name">${esc(nameOf(l))}</div>
            <div class="meta">
              ${unitChip(l)}
              <span class="wait-pill">${ic('clock', 'icon-sm')}Sem horário marcado</span>
              <span>${esc(service(l))}${horaTexto}</span>
            </div>
          </div>
          ${ph ? `<a class="btn-action-wa" style="background:#6b308b" href="${waLink(l, msgAgendar)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Enviar horários no WhatsApp">${ic('wa', 'icon-sm')}Agendar no WhatsApp</a>` : ''}
        </div>`;
      };

      // Leads que pararam de responder (conversas ativas sem resposta recente nas últimas 24-48h ou com retorno para hoje)
      const parouHoje = b.followup.filter(l => isToday(l.next_action_at) || isToday(l.status_changed_at || l.created_at) || (hoursSince(l.status_changed_at || l.created_at) !== null && hoursSince(l.status_changed_at || l.created_at) <= 48));

    // =========================================================
    // Recuperador Ativo de Leads (Inteligência Anti-Spam e Filtro Estrito)
    // =========================================================
    function isEligibleForRecovery(l) {
      // 1. Bloqueio estrito: já foi atendido ou agendado
      if (['agendado', 'consulta_realizada'].includes(l.status)) return false;
      // 2. Bloqueio estrito: tem data de consulta marcada ou resumo de agendamento concluído
      if (l.appointment_at) return false;
      if (l.agendamento_resumo && String(l.agendamento_resumo).trim().length > 0) return false;
      // 3. Bloqueio estrito: solicitou descadastro / opt-out (palavra PARAR)
      if (l.opted_out_at) return false;
      if (l.notes && l.notes.includes('[OPT-OUT]')) return false;
      // 4. Bloqueio se anotação indicar que já fechou ou realizou consulta
      if (l.lost_reason && /atendido|fechou|realizada/i.test(l.lost_reason)) return false;
      return true;
    }

    function getRecoveryQueues(list) {
      // Filtra apenas leads elegíveis (que NÃO foram atendidos, NÃO fecharam e NÃO deram opt-out)
      const eligible = list.filter(isEligibleForRecovery);

      // 1. Resgate Pós-Quiz (< 3h sem avanço)
      const posQuiz = eligible.filter(l => {
        if (['no_show', 'perdido'].includes(l.status)) return false;
        const h = hoursSince(l.created_at);
        return h !== null && h <= 3;
      }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      // 2. Retomada de Turno / Conversa Parada (3h a 48h)
      const retomada = eligible.filter(l => {
        if (['no_show', 'perdido'].includes(l.status)) return false;
        const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
        return h !== null && h > 3 && h <= 48;
      }).sort((a, b) => (stageAge(b)?.h || 0) - (stageAge(a)?.h || 0));

      // 3. Reaquecimento de Frios & No-Show (> 7 dias que nunca fecharam)
      const frios = eligible.filter(l => {
        if (['no_show', 'perdido'].includes(l.status)) return true;
        const h = hoursSince(l.status_changed_at || l.created_at || l.last_interaction_at);
        return h !== null && h >= 168;
      }).sort((a, b) => (stageAge(b)?.h || 0) - (stageAge(a)?.h || 0));

      return { posQuiz, retomada, frios };
    }

      npsCategoryFilter = cat;

      renderNpsView();

    function renderNpsView() {
      const container = document.getElementById('view-nps');
      if (!container) return;

      const allFeedbacks = npsFeedbacks || [];
      const total = allFeedbacks.length;

      // Promotores (9-10), Neutros (7-8), Detratores (0-6)
      const promoters = allFeedbacks.filter(f => f.score >= 9);
      const passives = allFeedbacks.filter(f => f.score >= 7 && f.score <= 8);
      const detractors = allFeedbacks.filter(f => f.score <= 6);

      const pCount = promoters.length;
      const nCount = passives.length;
      const dCount = detractors.length;

      const pPct = total > 0 ? Math.round((pCount / total) * 100) : 0;
      const nPct = total > 0 ? Math.round((nCount / total) * 100) : 0;
      const dPct = total > 0 ? Math.round((dCount / total) * 100) : 0;

      // NPS = % Promotores - % Detratores (-100 a +100)
      const npsScore = total > 0 ? Math.round(((pCount - dCount) / total) * 100) : 0;

      // Classificação da zona
      let zoneClass = 'zone-excellence';
      let zoneLabel = '🌟 Zona de Excelência';
      let zoneSub = 'Satisfação de padrão ouro (> 75)';
      if (npsScore < 0) {
        zoneClass = 'zone-danger';
        zoneLabel = '🚨 Zona Crítica';
        zoneSub = 'Mais detratores que promotores';
      } else if (npsScore < 50) {
        zoneClass = 'zone-warning';
        zoneLabel = '⚠️ Zona de Aperfeiçoamento';
        zoneSub = 'Oportunidade de correção clínica';
      } else if (npsScore < 75) {
        zoneClass = 'zone-quality';
        zoneLabel = '👍 Zona de Qualidade';
        zoneSub = 'Bom desempenho, expansão de promotores';
      }

      // Conversão para o Google Meu Negócio
      const googleCount = allFeedbacks.filter(f => f.redirected_to_google).length;
      const googlePct = pCount > 0 ? Math.round((googleCount / pCount) * 100) : 0;

      // Segmentação por Unidade
      const paulistaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('paulista'));
      const granjaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('granja'));

      const calcUnitNps = arr => {
        if (!arr.length) return { score: '–', total: 0, promPct: 0 };
        const pr = arr.filter(f => f.score >= 9).length;
        const dt = arr.filter(f => f.score <= 6).length;
        return {
          score: Math.round(((pr - dt) / arr.length) * 100),
          total: arr.length,
          promPct: Math.round((pr / arr.length) * 100)
        };
      };
      const paulistaStats = calcUnitNps(paulistaFeedbacks);
      const granjaStats = calcUnitNps(granjaFeedbacks);

      // Filtragem dos feedbacks do mural
      let filteredList = allFeedbacks;
      if (npsCategoryFilter === 'promoter') filteredList = filteredList.filter(f => f.score >= 9);
      else if (npsCategoryFilter === 'passive') filteredList = filteredList.filter(f => f.score >= 7 && f.score <= 8);
      else if (npsCategoryFilter === 'detractor') filteredList = filteredList.filter(f => f.score <= 6);

      if (npsUnitFilter === 'paulista') filteredList = filteredList.filter(f => (f.unit || '').includes('paulista'));
      else if (npsUnitFilter === 'granja_viana') filteredList = filteredList.filter(f => (f.unit || '').includes('granja'));

      // Render Cards
      const renderFeedbackCard = f => {
        const isProm = f.score >= 9;
        const isPass = f.score >= 7 && f.score <= 8;
        const chipCls = isProm ? 'promoter' : (isPass ? 'passive' : 'detractor');

        const isGranja = (f.unit || '').includes('granja');
        const unitLabel = isGranja ? 'Granja Viana' : 'Av. Paulista';

        const phone = f.phone ? String(f.phone).replace(/\D/g, '') : '';
        const name = f.patient_name || 'Paciente Anônimo';

          <div class="nps-card-tags">
            ${f.improvement_tags.map(t => `<span class="nps-tag-pill">${esc(t)}</span>`).join('')}
          </div>
        ` : '';

        const commentHtml = f.feedback_text ? `
          <div class="nps-card-comment">“${esc(f.feedback_text)}”</div>
        ` : '';

        const googleBadge = f.redirected_to_google ? `
          <div class="nps-google-badge">⭐⭐⭐⭐⭐ Avaliou no Google Maps</div>
        ` : '';

        let waBtn = '';
        if (phone) {
          const waMsg = isProm
            ? `Olá, ${name}! Tudo bem? Passando para te agradecer com muito carinho pela sua avaliação e pelo carinho com a nossa equipe da Creabily ${unitLabel}. Muita saúde para você! 🙏`

      container.innerHTML = `

    async function loadAgenteData(forceRefresh = false) {
      if (!sessionPassword) return;
      agenteLoading = true;
      if (view === 'agente') renderAgenteView();
      try {
        const r = await api('agendamentos', {
          action: 'list',
          dataFilter: agenteDayFilter,
          unidadeFilter: agenteUnitFilter,
          convenioFilter: agenteConvenioFilter,
          validacaoFilter: agenteStatusFilter,
          search: agenteSearchQuery,
          page: agenteCurrentPage,
          limit: AGENTE_PAGE_SIZE
        });
        if (r.ok && r.data) {
          agenteData = r.data;
          const totalVal = (agenteData.kpis && agenteData.kpis.totalAgendamentos) || agenteData.total || 0;
          const badge = document.getElementById('nav-agente');
          if (badge) badge.textContent = totalVal;
          const tabBadge = document.getElementById('tab-agente');
          if (tabBadge) {
            tabBadge.textContent = totalVal;
            tabBadge.classList.toggle('hidden', !totalVal);
          }
          if (forceRefresh) toast('Dados atualizados do Supabase!');
        } else {
          console.warn('Erro ao carregar dados do Agente:', r.error);
          if (forceRefresh) toast(r.error || 'Erro ao sincronizar', true);
        }
      } catch (e) {
        console.warn('Exceção ao carregar Agente:', e);
        if (forceRefresh) toast('Falha de conexão com o banco de dados', true);
      } finally {
        agenteLoading = false;
        if (view === 'agente') renderAgenteView();
      }
    }

    async function validateAgenteRow(id, validacao) {
      if (!sessionPassword) return;
      try {
        const r = await api('agendamentos', {
          action: 'validate',
          id: id,
          validacao: validacao,
          validado_por: 'Camila (Coordenação)'
        });
        if (r.ok) {
          if (agenteData && agenteData.rows) {
            const row = agenteData.rows.find(x => String(x.id) === String(id));
            if (row) {
              row.validacao = validacao;
              row.validado_por = 'Camila (Coordenação)';
              row.validado_em = new Date().toISOString();
            }
          }
          toast(`Validado: ${validacao}`);
          renderAgenteView();
        } else {
          toast(r.error || 'Erro ao validar', true);
        }
      } catch (e) {
        toast('Erro ao validar atendimento', true);
      }
    }

        await api('agendamentos', {

    function formatCellDate(val) {
      if (!val && val !== 0) return '';
      if (val instanceof Date && !isNaN(val.getTime())) {
        const dd = String(val.getDate()).padStart(2, '0');
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const yyyy = val.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }
      if (typeof val === 'number' && val > 35000 && val < 60000) {
        const utcDays = Math.floor(val - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        const dd = String(d.getUTCDate()).padStart(2, '0');
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const yyyy = d.getUTCFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }
      const s = String(val).trim();
      const m1 = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (m1) {
        const dd = m1[1].padStart(2, '0');
        const mm = m1[2].padStart(2, '0');
        let yyyy = m1[3];
        if (yyyy.length === 2) yyyy = '20' + yyyy;
        return `${dd}/${mm}/${yyyy}`;
      }
      const m2 = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m2) {
        return `${m2[3].padStart(2, '0')}/${m2[2].padStart(2, '0')}/${m2[1]}`;
      }
      return '';
    }

    function formatCellTime(val) {
      if (!val && val !== 0) return '';
      if (val instanceof Date && !isNaN(val.getTime())) {
        return `${String(val.getHours()).padStart(2, '0')}:${String(val.getMinutes()).padStart(2, '0')}`;
      }
      if (typeof val === 'number' && val >= 0 && val < 1) {
        const totalMins = Math.round(val * 24 * 60);
        const hh = Math.floor(totalMins / 60);
        const mm = totalMins % 60;
        return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{1,2}):(\d{2})/);
      if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
      return '';
    }

    function inferUnidadeAgil(rawUnidade, profissional, especialidade, procedimento) {
      const u = String(rawUnidade || '').toUpperCase();
      if (u.includes('GRANJA')) return 'GRANJA VIANA';
      if (u.includes('PAULISTA')) return 'PAULISTA';
      const combined = `${profissional || ''} ${especialidade || ''} ${procedimento || ''}`.toLowerCase();
      if (
        combined.includes('granja') ||
        combined.includes('angela oliveira') ||
        combined.includes('giovanna barros') ||
        combined.includes('jessica oliveira') ||
        combined.includes('piero antonaccio') ||
        combined.includes('camila (fisio')
      ) {
        return 'GRANJA VIANA';
      }
      return 'PAULISTA';
    }

    function inferConvenioAgil(rawConv, sheetName, procedimento, guia) {
      const OFFICIAL = [
        'Afresp Saúde', 'Amil Black, Amil One, Lincx', 'Care Plus', 'Medsenior',
        'Convênio Creabily Especial', 'Creabily Particular', 'Omint Premium',
        'Omint Skill', 'Omint Corporate', 'SEM CONVÊNIO', 'Total Pass'
      ];
      const c = String(rawConv || '').trim();
      const sh = String(sheetName || '').trim();
      const matchOfficial = (str) => {
        if (!str) return null;
        const low = str.toLowerCase();
        const exact = OFFICIAL.find(o => o.toLowerCase() === low);
        if (exact) return exact;
        if (low.includes('afresp')) return 'Afresp Saúde';
        if (low.includes('amil') || low.includes('lincx') || low.includes('one')) return 'Amil Black, Amil One, Lincx';
        if (low.includes('care plus') || low.includes('careplus')) return 'Care Plus';
        if (low.includes('medsenior') || low.includes('medsênior') || low.includes('med senior')) return 'Medsenior';
        if (low.includes('especial')) return 'Convênio Creabily Especial';
        if (low.includes('particular')) return 'Creabily Particular';
        if (low.includes('omint') && low.includes('premium')) return 'Omint Premium';
        if (low.includes('omint') && low.includes('corporate')) return 'Omint Corporate';
        if (low.includes('omint')) return 'Omint Skill';
        if (low.includes('total pass') || low.includes('totalpass')) return 'Total Pass';
        return null;
      };
      return matchOfficial(c) || matchOfficial(sh) || matchOfficial(`${procedimento || ''} ${guia || ''}`) || 'SEM CONVÊNIO';
    }

    function handleAgilFileSelect(file) {
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        alert('Biblioteca XLSX ainda carregando. Aguarde 2 segundos e tente novamente.');
        return;
      }

      const preview = document.getElementById('agente-import-preview');
      const errBox = document.getElementById('agente-import-error');
      if (errBox) { errBox.classList.add('hidden'); errBox.innerHTML = ''; }
      preview.classList.remove('hidden');
      preview.innerHTML = `<div style="display:flex; align-items:center; gap:8px;">🔄 Lendo e analisando estrutura de <b>${esc(file.name)}</b>...</div>`;

      // Tentar extrair data do nome do arquivo caso seja 21-10-26.xlsx
      let fileFallbackDate = '';
      const fnMatch = file.name.match(/(\d{2})[\/\-_](\d{2})[\/\-_](\d{2,4})/);
      if (fnMatch) {
        let yy = fnMatch[3];
        if (yy.length === 2) yy = '20' + yy;
        fileFallbackDate = `${fnMatch[1]}/${fnMatch[2]}/${yy}`;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const rowsToImport = [];
          const datesSet = new Set();
          let countPaulista = 0;
          let countGranja = 0;

          const skipTabs = ['REGRAS DO AGENTE', 'TOTAL OUTUBRO', 'RESUMO CONFERÊNCIA', 'RESUMO CONFERENCIA', 'BASE AUDITORIA', 'PAINEL GERENCIAL', 'AÇÕES ADMINISTRATIVAS', 'ACOES ADMINISTRATIVAS'];
          const targetSheets = wb.SheetNames.filter(n => !skipTabs.includes(n.toUpperCase().trim()));
          const sheetsToRead = targetSheets.length > 0 ? targetSheets : wb.SheetNames;

          for (const sheetName of sheetsToRead) {
            const ws = wb.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            let curUnidade = '';
            let curDate = fileFallbackDate;
            let colMap = null;

            for (let i = 0; i < rawRows.length; i++) {
              const r = rawRows[i];
              if (!r || !r.length) continue;
              const nonEmpty = r.filter(c => String(c || '').trim() !== '');
              if (!nonEmpty.length) continue;

              const c0 = String(r[0] || '').trim();
              const rowJoined = r.map(x => String(x || '').trim()).join(' ').toUpperCase();

              // Detectar banners de seção
              if (c0.toUpperCase().startsWith('DATA ') || (nonEmpty.length <= 2 && rowJoined.includes('DATA '))) {
                const m = rowJoined.match(/(\d{2}\/\d{2}\/\d{4})/);
                if (m) curDate = m[1];
                continue;
              }
              if (nonEmpty.length <= 3 && rowJoined.includes('UNIDADE PAULISTA')) { curUnidade = 'PAULISTA'; continue; }
              if (nonEmpty.length <= 3 && rowJoined.includes('UNIDADE GRANJA')) { curUnidade = 'GRANJA VIANA'; continue; }

              // Detectar linha de cabeçalho dinamicamente
              const lowerCells = r.map(c => String(c || '').trim().toLowerCase());
              const hasPacienteCol = lowerCells.some(c => c === 'paciente' || c === 'nome do paciente' || c === 'cliente' || c === 'nome');
              const hasDataOrHoraCol = lowerCells.some(c => c === 'data' || c.startsWith('hor') || c === 'hora' || c.includes('status') || c.includes('profissional'));

              if (hasPacienteCol && hasDataOrHoraCol) {
                colMap = {};
                lowerCells.forEach((lbl, idx) => {
                  if (!lbl) return;
                  if ((lbl === 'data' || lbl.includes('data atend') || lbl.includes('dt')) && colMap.data === undefined) colMap.data = idx;
                  else if ((lbl === 'paciente' || lbl === 'nome do paciente' || lbl === 'cliente' || lbl === 'nome') && colMap.paciente === undefined) colMap.paciente = idx;
                  else if ((lbl.startsWith('hor') || lbl === 'hora' || lbl === 'início' || lbl === 'inicio') && colMap.horario === undefined) colMap.horario = idx;
                  else if ((lbl.includes('status') || lbl === 'estado') && colMap.status_agil === undefined) colMap.status_agil = idx;
                  else if ((lbl.includes('profissional') || lbl.includes('fisioterapeuta') || lbl.includes('prestador') || lbl.includes('agenda')) && colMap.profissional === undefined) colMap.profissional = idx;
                  else if ((lbl.includes('especialidade') || lbl.includes('serviço') || lbl.includes('servico')) && colMap.especialidade === undefined) colMap.especialidade = idx;
                  else if ((lbl.includes('procedimento') || lbl.includes('item') || lbl.includes('tratamento')) && colMap.procedimento === undefined) colMap.procedimento = idx;
                  else if ((lbl.includes('sessão') || lbl.includes('sessao') || lbl.includes('qtde')) && colMap.sessao === undefined) colMap.sessao = idx;
                  else if ((lbl.includes('cpf') || lbl.includes('carteirinha') || lbl.includes('documento') || lbl.includes('matricula')) && colMap.cpf_carteirinha === undefined) colMap.cpf_carteirinha = idx;
                  else if ((lbl.includes('guia') || lbl.includes('senha') || lbl.includes('autoriza')) && colMap.guia === undefined) colMap.guia = idx;
                  else if ((lbl.includes('ação') || lbl.includes('acao') || lbl.includes('lembrete') || lbl.includes('alerta')) && colMap.acao_lembrete === undefined) colMap.acao_lembrete = idx;
                  else if ((lbl === 'situação' || lbl === 'situacao') && colMap.situacao === undefined) colMap.situacao = idx;
                  else if ((lbl.includes('valida')) && colMap.validacao === undefined) colMap.validacao = idx;
                  else if ((lbl.includes('observa') || lbl === 'obs') && colMap.observacao === undefined) colMap.observacao = idx;
                  else if ((lbl.includes('convênio') || lbl.includes('convenio') || lbl.includes('plano') || lbl.includes('operadora')) && colMap.convenio === undefined) colMap.convenio = idx;
                  else if ((lbl.includes('unidade') || lbl.includes('filial') || lbl.includes('local') || lbl.includes('clínica')) && colMap.unidade === undefined) colMap.unidade = idx;
                });
                continue;
              }

              // Tentar extrair registro da linha
              let rowDate = '';
              let paciente = '';
              let horario = '';
              let status_agil = '';
              let profissional = '';
              let especialidade = '';
              let procedimento = '';
              let sessao = '';
              let cpf_carteirinha = '';
              let guia = '';
              let acao_lembrete = '';
              let situacao = '';
              let validacao = '';
              let observacao = '';
              let rawConv = '';
              let rawUnid = '';

              if (colMap) {
                rowDate = colMap.data !== undefined ? formatCellDate(r[colMap.data]) : curDate;
                paciente = colMap.paciente !== undefined ? String(r[colMap.paciente] || '').trim() : '';
                horario = colMap.horario !== undefined ? formatCellTime(r[colMap.horario]) : '';
                status_agil = colMap.status_agil !== undefined ? String(r[colMap.status_agil] || '').trim() : '';
                profissional = colMap.profissional !== undefined ? String(r[colMap.profissional] || '').trim() : '';
                especialidade = colMap.especialidade !== undefined ? String(r[colMap.especialidade] || '').trim() : '';
                procedimento = colMap.procedimento !== undefined ? String(r[colMap.procedimento] || '').trim() : '';
                sessao = colMap.sessao !== undefined ? String(r[colMap.sessao] || '').trim() : '';
                cpf_carteirinha = colMap.cpf_carteirinha !== undefined ? String(r[colMap.cpf_carteirinha] || '').trim() : '';
                guia = colMap.guia !== undefined ? String(r[colMap.guia] || '').trim() : '';
                acao_lembrete = colMap.acao_lembrete !== undefined ? String(r[colMap.acao_lembrete] || '').trim() : '';
                situacao = colMap.situacao !== undefined ? String(r[colMap.situacao] || '').trim() : '';
                validacao = colMap.validacao !== undefined ? String(r[colMap.validacao] || '').trim() : '';
                observacao = colMap.observacao !== undefined ? String(r[colMap.observacao] || '').trim() : '';
                rawConv = colMap.convenio !== undefined ? String(r[colMap.convenio] || '').trim() : '';
                rawUnid = colMap.unidade !== undefined ? String(r[colMap.unidade] || '').trim() : '';
              } else {
                // Heurística sem cabeçalho explícito: verificar se r[0] é data
                rowDate = formatCellDate(r[0]) || curDate;
                if (!rowDate) continue;
                const cell1Time = formatCellTime(r[1]);
                const cell2Time = formatCellTime(r[2]);
                if (cell1Time && !cell2Time && String(r[2] || '').trim().length > 2) {
                  // Formato Ágil onde Col 1 = Horário e Col 2 = Paciente
                  horario = cell1Time;
                  paciente = String(r[2] || '').trim();
                  status_agil = String(r[3] || '').trim();
                  profissional = String(r[4] || '').trim();
                  especialidade = String(r[5] || '').trim();
                  procedimento = String(r[6] || '').trim();
                  sessao = String(r[7] || '').trim();
                  cpf_carteirinha = String(r[8] || '').trim();
                  guia = String(r[9] || '').trim();
                  rawConv = String(r[10] || '').trim();
                  rawUnid = String(r[11] || '').trim();
                } else {
                  // Formato Consolidado A:N onde Col 1 = Paciente e Col 2 = Horário
                  paciente = String(r[1] || '').trim();
                  horario = cell2Time || String(r[2] || '').trim();
                  status_agil = String(r[3] || '').trim();
                  profissional = String(r[4] || '').trim();
                  especialidade = String(r[5] || '').trim();
                  procedimento = String(r[6] || '').trim();
                  sessao = String(r[7] || '').trim();
                  cpf_carteirinha = String(r[8] || '').trim();
                  guia = String(r[9] || '').trim();
                  acao_lembrete = String(r[10] || '').trim();
                  situacao = String(r[11] || '').trim();
                  validacao = String(r[12] || '').trim();
                  observacao = String(r[13] || '').trim();
                }
              }

              // Proteção extra contra inversão entre Paciente e Horário
              if (/^\d{1,2}:\d{2}/.test(paciente) && horario && !/^\d{1,2}:\d{2}/.test(horario)) {
                const tmp = paciente;
                paciente = horario;
                horario = tmp;
              }

              if (!rowDate || !paciente) continue;
              const pUpper = paciente.toUpperCase();
              if (pUpper === 'PACIENTE' || pUpper === 'TOTAL' || pUpper.startsWith('UNIDADE ') || pUpper.startsWith('DATA ')) continue;

              // Se sessão não veio em coluna própria, extrair de Status Ágil ou Procedimento ex: "Finalizado (10/10)"
              if (!sessao) {
                const mSess = `${status_agil} ${procedimento}`.match(/\((\d{1,2}\/\d{1,2})\)|\b(\d{1,2}\/\d{1,2})\b/);
                if (mSess) sessao = mSess[1] || mSess[2] || '';
              }

              const un = curUnidade || inferUnidadeAgil(rawUnid, profissional, especialidade, procedimento);
              const conv = inferConvenioAgil(rawConv, sheetName, procedimento, guia);

              if (un === 'PAULISTA') countPaulista++; else countGranja++;
              datesSet.add(rowDate);

              rowsToImport.push({
                data: rowDate,
                paciente,
                horario: horario.slice(0, 20),
                status_agil: status_agil || 'Agendado',
                profissional,
                especialidade,
                procedimento,
                sessao,
                cpf_carteirinha,
                guia,
                acao_lembrete,
                situacao,
                validacao: validacao || 'Pendente',
                observacao,
                unidade: un,
                convenio: conv
              });
            }
          }

          agenteImportPendingRows = rowsToImport;
          const btnConfirm = document.getElementById('btn-confirm-import');
          const datesArr = [...datesSet];

          if (rowsToImport.length > 0) {
            btnConfirm.disabled = false;
            btnConfirm.textContent = `Confirmar Importação (${rowsToImport.length} atendimentos)`;
            const sampleRows = rowsToImport.slice(0, 5).map(x => `
              <tr>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.data)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-family:monospace;">${esc(x.horario)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-weight:700;">${esc(x.paciente)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${x.unidade === 'GRANJA VIANA' ? '🌿 Granja' : '🏙️ Paulista'}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line);">${esc(x.convenio)}</td>
                <td style="padding:4px 6px; border-bottom:1px solid var(--line); font-weight:700;">${esc(x.sessao || '—')}</td>
              </tr>
            `).join('');

            preview.innerHTML = `
              <div style="color:#059669; font-weight:700; font-size:14px; margin-bottom:6px;">✓ Planilha validada e pronta para importação!</div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:10px;">
                <div><b>Arquivo:</b> ${esc(file.name)}</div>
                <div><b>Data(s):</b> ${esc(datesArr.join(', ') || 'Identificada')}</div>
                <div><b>Total de Atendimentos:</b> ${rowsToImport.length}</div>
                <div><b>Unidades:</b> 🏙️ ${countPaulista} Paulista | 🌿 ${countGranja} Granja Viana</div>
              </div>
              <div style="font-size:11px; font-weight:700; color:var(--text-3); margin-bottom:4px; text-transform:uppercase;">Pré-visualização dos primeiros registros:</div>
              <table style="width:100%; border-collapse:collapse; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden;">
                <thead>
                  <tr style="background:#F5F3FF; color:#4C1D95; text-align:left;">
                    <th style="padding:5px 6px;">Data</th>

                  </tr>

            `;
          } else {
            btnConfirm.disabled = true;
            preview.innerHTML = `
              <div style="color:#DC2626; font-weight:600;">Nenhum atendimento válido foi encontrado na planilha.</div>
              <div style="font-size:11.5px; color:var(--text-3); margin-top:4px;">Verifique se a planilha possui colunas de Data e Paciente ou se o arquivo não está vazio.</div>
            `;
          }
        } catch (err) {
          preview.innerHTML = `<div style="color:#DC2626; font-weight:600;">Erro ao ler o arquivo: ${esc(err.message)}</div>`;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function submitAgilImport() {
      if (!agenteImportPendingRows.length) return;
      const btn = document.getElementById('btn-confirm-import');
      const errBox = document.getElementById('agente-import-error');
      if (errBox) { errBox.classList.add('hidden'); errBox.innerHTML = ''; }
      btn.disabled = true;

      const BATCH_SIZE = 200;
      const totalRows = agenteImportPendingRows.length;
      const totalBatches = Math.ceil(totalRows / BATCH_SIZE);
      let totalInserted = 0;
      let totalUpdated = 0;
      let totalNps = 0;
      let importedDates = [];

      try {
        for (let b = 0; b < totalBatches; b++) {
          const chunk = agenteImportPendingRows.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
          btn.textContent = totalBatches > 1 ? `Gravando no Supabase (${b + 1}/${totalBatches})...` : 'Gravando no Supabase...';

          const r = await api('agendamentos', {
            action: 'import',
            rows: chunk,
            loteNome: 'Upload_Agil_' + new Date().toISOString().substring(0, 10)
          });

          if (!r.ok) {
            const msg = r.error || 'Erro ao gravar lote no banco de dados';
            if (errBox) {
              errBox.classList.remove('hidden');
              errBox.innerHTML = `⚠️ Falha na importação: ${esc(msg)}`;
            }
            toast(msg, true);
            btn.disabled = false;
            btn.textContent = 'Tentar Novamente';
            return;
          }

          totalInserted += (r.data.insertedCount || 0);
          totalUpdated += (r.data.updatedCount || 0);
          totalNps += (r.data.npsCount || 0);
          if (Array.isArray(r.data.dates)) importedDates.push(...r.data.dates);
        }

        const uniqueD = [...new Set(importedDates)];
        if (uniqueD.length === 1) {
          agenteDayFilter = uniqueD[0];
        }
        toast(`✅ Importado com sucesso! ${totalInserted} novos, ${totalUpdated} atualizados${totalNps ? ` • 🔵 ${totalNps} Alerta(s) NPS` : ''}.`);
        closeAgenteImportModal();
        loadAgenteData(false);
      } catch (e) {
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerHTML = `⚠️ Erro de comunicação com o servidor: ${esc(e.message || '')}`;
        }
        toast('Erro de comunicação com o servidor', true);
        btn.disabled = false;
        btn.textContent = 'Tentar Novamente';
      }
    }

    // Helper para formatar blocos por Data e Unidade nas abas de Convênio do Excel Oficial
    function buildConvenioSheetAoA(cName, convRows) {
      const HEADER = ['Data', 'Paciente', 'Horário', 'Status Ágil', 'Profissional', 'Especialidade', 'Procedimento', 'Sessão', 'CPF/Carteirinha', 'Guia', 'Ação / Lembrete', 'Situação', 'Validação', 'Observação'];
      const sheetData = [
        [`${cName.toUpperCase()} — OUTUBRO 2026   |   🔤 A–Z   🕐 HORÁRIO   👤 PROFISSIONAL   📋 STATUS`],
        []
      ];

      if (!convRows.length) {
        sheetData.push(HEADER);
        return sheetData;
      }

      // Agrupar por data em ordem cronológica
      const parseD = (s) => { const p = String(s || '').split('/'); return new Date(+p[2] || 2026, (+p[1] || 10) - 1, +p[0] || 1).getTime() || 0; };
      const uniqueDates = [...new Set(convRows.map(r => r.data))].sort((a, b) => parseD(a) - parseD(b));

      for (const dt of uniqueDates) {
        const dayRows = convRows.filter(r => r.data === dt);
        const paulistaRows = dayRows.filter(r => (r.unidade || '').toUpperCase().includes('PAULISTA')).sort((a, b) => (a.paciente || '').localeCompare(b.paciente || '', 'pt-BR'));
        const granjaRows = dayRows.filter(r => (r.unidade || '').toUpperCase().includes('GRANJA')).sort((a, b) => (a.paciente || '').localeCompare(b.paciente || '', 'pt-BR'));

        sheetData.push([`DATA ${dt} — TOTAL DO DIA: ${dayRows.length} ATENDIMENTO(S)`]);

        if (paulistaRows.length > 0) {
          sheetData.push([`UNIDADE PAULISTA — ${paulistaRows.length} ATENDIMENTO(S)`]);
          sheetData.push(HEADER);
          paulistaRows.forEach(row => {
            sheetData.push([
              row.data, row.paciente, row.horario, row.status_agil, row.profissional,
              row.especialidade, row.procedimento, row.sessao, row.cpf_carteirinha,
              row.guia, row.acao_lembrete, row.situacao, row.validacao, row.observacao
            ]);
          });
          sheetData.push([]);
        }

        if (granjaRows.length > 0) {
          sheetData.push([`UNIDADE GRANJA VIANA — ${granjaRows.length} ATENDIMENTO(S)`]);
          sheetData.push(HEADER);
          granjaRows.forEach(row => {
            sheetData.push([
              row.data, row.paciente, row.horario, row.status_agil, row.profissional,
              row.especialidade, row.procedimento, row.sessao, row.cpf_carteirinha,
              row.guia, row.acao_lembrete, row.situacao, row.validacao, row.observacao
            ]);
          });
          sheetData.push([]);
        }
      }

      return sheetData;
    }

    // Exportação Oficial em Excel (17 Abas Completas ou Relatório do Dia)

      if (typeof XLSX === 'undefined') {
        toast('Biblioteca XLSX carregando, tente novamente em 2 segundos...', true);
        return;
      }

      const targetDate = onlyCurrentDay
        ? (agenteDayFilter !== 'all' ? agenteDayFilter : ((agenteData && agenteData.dias && agenteData.dias[0] && agenteData.dias[0].data) || 'all'))
        : 'all';

      toast(targetDate !== 'all' ? `Gerando planilha oficial do dia ${targetDate}...` : 'Gerando Consolidado Oficial (17 Abas)...');

      try {
        const r = await api('agendamentos', {
          action: 'list',
          dataFilter: targetDate,

          ['Pendentes em Aberto', k.pendentes || 0],
