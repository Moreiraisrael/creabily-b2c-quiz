    function renderNpsView() {
      const container = document.getElementById('view-nps');
      if (!container) return;

      const allFeedbacks = npsFeedbacks || [];
      const total = allFeedbacks.length;

      // Promotores (9-10), Neutros (7-8), Detratores (0-6)
      const promoters = allFeedbacks.filter(f => f.score >= 9);
      const passives = allFeedbacks.filter(f => f.score >= 7 && f.score <= 8);
      const detractors = allFeedbacks.filter(f => f.score <= 6);

      const pCount = promoters.length;
      const nCount = passives.length;
      const dCount = detractors.length;

      const pPct = total > 0 ? Math.round((pCount / total) * 100) : 0;
      const nPct = total > 0 ? Math.round((nCount / total) * 100) : 0;
      const dPct = total > 0 ? Math.round((dCount / total) * 100) : 0;

      // NPS = % Promotores - % Detratores (-100 a +100)
      const npsScore = total > 0 ? Math.round(((pCount - dCount) / total) * 100) : 0;

      // Classificação da zona
      let zoneClass = 'zone-excellence';
      let zoneLabel = '🌟 Zona de Excelência';
      let zoneSub = 'Satisfação de padrão ouro (> 75)';
      if (npsScore < 0) {
        zoneClass = 'zone-danger';
        zoneLabel = '🚨 Zona Crítica';
        zoneSub = 'Mais detratores que promotores';
      } else if (npsScore < 50) {
        zoneClass = 'zone-warning';
        zoneLabel = '⚠️ Zona de Aperfeiçoamento';
        zoneSub = 'Oportunidade de correção clínica';
      } else if (npsScore < 75) {
        zoneClass = 'zone-quality';
        zoneLabel = '👍 Zona de Qualidade';
        zoneSub = 'Bom desempenho, expansão de promotores';
      }

      // Conversão para o Google Meu Negócio
      const googleCount = allFeedbacks.filter(f => f.redirected_to_google).length;
      const googlePct = pCount > 0 ? Math.round((googleCount / pCount) * 100) : 0;

      // Segmentação por Unidade
      const paulistaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('paulista'));
      const granjaFeedbacks = allFeedbacks.filter(f => (f.unit || '').includes('granja'));

      const calcUnitNps = arr => {
        if (!arr.length) return { score: '–', total: 0, promPct: 0 };
        const pr = arr.filter(f => f.score >= 9).length;
        const dt = arr.filter(f => f.score <= 6).length;
        return {
          score: Math.round(((pr - dt) / arr.length) * 100),
          total: arr.length,
          promPct: Math.round((pr / arr.length) * 100)
        };
      };
      const paulistaStats = calcUnitNps(paulistaFeedbacks);
      const granjaStats = calcUnitNps(granjaFeedbacks);

      // Filtragem dos feedbacks do mural
      let filteredList = allFeedbacks;
      if (npsCategoryFilter === 'promoter') filteredList = filteredList.filter(f => f.score >= 9);
      else if (npsCategoryFilter === 'passive') filteredList = filteredList.filter(f => f.score >= 7 && f.score <= 8);
      else if (npsCategoryFilter === 'detractor') filteredList = filteredList.filter(f => f.score <= 6);

      if (npsUnitFilter === 'paulista') filteredList = filteredList.filter(f => (f.unit || '').includes('paulista'));
      else if (npsUnitFilter === 'granja_viana') filteredList = filteredList.filter(f => (f.unit || '').includes('granja'));

      // Render Cards
      const renderFeedbackCard = f => {
        const isProm = f.score >= 9;
        const isPass = f.score >= 7 && f.score <= 8;
        const chipCls = isProm ? 'promoter' : (isPass ? 'passive' : 'detractor');
        const chipText = isProm ? `⭐ ${f.score}/10 Promotor` : (isPass ? `⚡ ${f.score}/10 Neutro` : `⚠️ ${f.score}/10 Detrator`);
        const isGranja = (f.unit || '').includes('granja');
        const unitLabel = isGranja ? 'Granja Viana' : 'Av. Paulista';
        const unitCls = isGranja ? 'granja' : 'paulista';

        const phone = f.phone ? String(f.phone).replace(/\D/g, '') : '';
        const name = f.patient_name || 'Paciente Anônimo';
        const hora = f.created_at ? dateFmt(f.created_at) : '';

        const tagsHtml = Array.isArray(f.improvement_tags) && f.improvement_tags.length ? `
          <div class="nps-card-tags">
            ${f.improvement_tags.map(t => `<span class="nps-tag-pill">${esc(t)}</span>`).join('')}

        const commentHtml = f.feedback_text ? `
          <div class="nps-card-comment">“${esc(f.feedback_text)}”</div>
        ` : '';

        const googleBadge = f.redirected_to_google ? `
          <div class="nps-google-badge">⭐⭐⭐⭐⭐ Avaliou no Google Maps</div>
        ` : '';

        let waBtn = '';
        if (phone) {
          const waMsg = isProm
            ? `Olá, ${name}! Tudo bem? Passando para te agradecer com muito carinho pela sua avaliação e pelo carinho com a nossa equipe da Creabily ${unitLabel}. Muita saúde para você! 🙏`
            : `Olá, ${name}! Tudo bem? Aqui é da coordenação clínica da Creabily ${unitLabel}. Recebemos sua avaliação e gostaríamos de te ouvir com muita atenção para garantir que sua experiência com a gente seja nota 10. Como podemos te ajudar?`;
          const waUrl = `https://wa.me/${phone.startsWith('55') ? phone : '55' + phone}?text=${encodeURIComponent(waMsg)}`;
          waBtn = `<a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-nps-wa" title="Conversar no WhatsApp">${ic('wa', 'icon-sm')}Responder no WhatsApp</a>`;
        }

        return `
          <div class="nps-card">
            <div class="nps-card-head">
              <div class="nps-card-who">
                <div class="avatar">${esc(name.slice(0, 2).toUpperCase())}</div>
                <div>
                  <div class="nps-card-name">${esc(name)}</div>
                  <div class="nps-card-meta">${phone ? esc(phone) : 'Sem telefone'}</div>
                </div>
              </div>
              <span class="nps-score-chip ${chipCls}">${chipText}</span>
            </div>

            ${googleBadge}
            ${tagsHtml}
            ${commentHtml}

            <div class="nps-card-foot">
              <div>
                <span class="unit-tag ${unitCls}">📍 ${unitLabel}</span>
                <span style="margin-left: 6px; color: var(--text-3);">${esc(f.service || 'Fisioterapia')}</span>
                <span style="margin-left: 6px; color: var(--text-3);">· ${hora}</span>
              </div>
              ${waBtn}
            </div>
          </div>
        `;
      };

      container.innerHTML = `
        <!-- HERO NPS -->
        <div class="nps-hero">
          <div class="nps-hero-grid">
            <div class="nps-score-badge ${zoneClass}">
              <div class="nps-score-val">${total > 0 ? (npsScore > 0 ? '+' : '') + npsScore : '–'}</div>
              <div class="nps-score-label">NPS Creabily</div>
              <div class="nps-score-sub">${zoneLabel}</div>
              <div style="font-size:11px; opacity:0.75; margin-top:2px;">${zoneSub}</div>
            </div>

            <div class="nps-breakdown">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <h3 style="margin:0; font-size:16px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px;">
                  ${ic('star')} Distribuição da Satisfação dos Pacientes
                </h3>
                <span style="font-size:13px; font-weight:600; color:var(--text-3);">${total} avaliações registradas</span>
              </div>

              <div class="nps-bar-container" title="Promotores: ${pPct}% | Neutros: ${nPct}% | Detratores: ${dPct}%">
                <div class="nps-bar-seg promoters" style="width: ${pPct}%"></div>
                <div class="nps-bar-seg passives" style="width: ${nPct}%"></div>
                <div class="nps-bar-seg detractors" style="width: ${dPct}%"></div>
              </div>

              <div class="nps-stats-row">
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#0D9488;">🌟 Promotores (9-10)</div>
                  <div class="nps-stat-number">${pCount} <span class="nps-stat-pct">(${pPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#D97706;">⚡ Neutros (7-8)</div>
                  <div class="nps-stat-number">${nCount} <span class="nps-stat-pct">(${nPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#DC2626;">⚠️ Detratores (0-6)</div>
                  <div class="nps-stat-number">${dCount} <span class="nps-stat-pct">(${dPct}%)</span></div>
                </div>
                <div class="nps-stat-box">
                  <div class="nps-stat-title" style="color:#B45309;">⭐⭐⭐⭐⭐ No Google</div>
                  <div class="nps-stat-number">${googleCount} <span class="nps-stat-pct">(${googlePct}% conv.)</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- COMPARATIVO POR UNIDADE -->
        <div class="nps-unit-grid">
          <div class="nps-unit-card">
            <div class="nps-unit-info">
              <h4>🏙️ Unidade Av. Paulista</h4>
              <p>${paulistaStats.total} avaliações • ${paulistaStats.promPct}% promotores</p>
              <div style="margin-top: 8px;">
                <a href="https://www.google.com/maps/search/?api=1&query=Creabily+Fisioterapia+e+Pilates+Av+Paulista" target="_blank" rel="noopener noreferrer" style="font-size:12px; color:var(--brand); text-decoration:none; font-weight:600;">Ver no Google Maps ↗</a>
              </div>
            </div>
            <div class="nps-unit-score" style="color:${paulistaStats.score >= 75 ? '#0D9488' : '#D97706'};">
              ${paulistaStats.score !== '–' ? (paulistaStats.score > 0 ? '+' : '') + paulistaStats.score : '–'}
            </div>
          </div>

          <div class="nps-unit-card">
            <div class="nps-unit-info">
              <h4>🌿 Unidade Granja Viana</h4>
              <p>${granjaStats.total} avaliações • ${granjaStats.promPct}% promotores</p>
              <div style="margin-top: 8px;">
                <a href="https://www.google.com/maps/search/?api=1&query=Creabily+Fisioterapia+e+Pilates+Granja+Viana" target="_blank" rel="noopener noreferrer" style="font-size:12px; color:var(--brand); text-decoration:none; font-weight:600;">Ver no Google Maps ↗</a>
              </div>
            </div>
            <div class="nps-unit-score" style="color:${granjaStats.score >= 75 ? '#0D9488' : '#D97706'};">
              ${granjaStats.score !== '–' ? (granjaStats.score > 0 ? '+' : '') + granjaStats.score : '–'}
            </div>
          </div>
        </div>

        <!-- FILTROS DO MURAL -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
          <div class="nps-filters">
            <button class="nps-filter-btn ${npsCategoryFilter === 'all' ? 'active' : ''}" onclick="setNpsCategoryFilter('all')">Todos (${total})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'promoter' ? 'active' : ''}" onclick="setNpsCategoryFilter('promoter')">🌟 Promotores (${pCount})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'passive' ? 'active' : ''}" onclick="setNpsCategoryFilter('passive')">⚡ Neutros (${nCount})</button>
            <button class="nps-filter-btn ${npsCategoryFilter === 'detractor' ? 'active' : ''}" onclick="setNpsCategoryFilter('detractor')">⚠️ Detratores (${dCount})</button>
          </div>

          <div class="nps-filters">
            <button class="nps-filter-btn ${npsUnitFilter === 'all' ? 'active' : ''}" onclick="setNpsUnitFilter('all')">Todas Unidades</button>
            <button class="nps-filter-btn ${npsUnitFilter === 'paulista' ? 'active' : ''}" onclick="setNpsUnitFilter('paulista')">🏙️ Paulista</button>
            <button class="nps-filter-btn ${npsUnitFilter === 'granja_viana' ? 'active' : ''}" onclick="setNpsUnitFilter('granja_viana')">🌿 Granja</button>
          </div>
        </div>

        <!-- GRID DE CARDS DE FEEDBACK -->
        <div class="nps-feed-grid">
          ${filteredList.length ? filteredList.map(renderFeedbackCard).join('') : `
            <div style="grid-column: 1 / -1; text-align:center; padding:40px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); color:var(--text-3);">
              ${ic('star')}
              <div style="font-weight:600; margin-top:8px;">Nenhuma avaliação encontrada com os filtros selecionados.</div>
            </div>
          `}
        </div>
      `;
    }

    // =========================================================
    // Agente Creabily Outubro 2026 (Planilha Google Sheets Live)
    // =========================================================
    async function loadAgenteData(forceRefresh = false) {
      if (!sessionPassword) return;
      agenteLoading = true;
      if (view === 'agente') renderAgenteView();
      try {
        const r = await api('get-agente-sheets', { forceRefresh });
        if (r.ok && r.data) {
          agenteData = r.data;
          const totalVal = (agenteData.kpis && agenteData.kpis.totalAgendamentos) || agenteData.totalRegistros || 0;
          const badge = document.getElementById('nav-agente');
          if (badge) badge.textContent = totalVal;
          const tabBadge = document.getElementById('tab-agente');
          if (tabBadge) {
            tabBadge.textContent = totalVal;
            tabBadge.classList.toggle('hidden', !totalVal);
          }
          if (forceRefresh) toast('Planilha sincronizada ao vivo com Google Sheets!');
        } else {
          console.warn('Erro ao carregar dados do Agente:', r.error);
          if (forceRefresh) toast(r.error || 'Erro ao sincronizar planilha', true);
        }
      } catch (e) {
        console.warn('Exceção ao carregar Agente:', e);
        if (forceRefresh) toast('Falha de conexão com a planilha', true);
      } finally {
        agenteLoading = false;
        if (view === 'agente') renderAgenteView();
      }
    }

    function setAgenteUnitFilter(val) {
      agenteUnitFilter = val;
      agenteCurrentPage = 1;
      renderAgenteView();
    }

    function setAgenteConvenioFilter(val) {
      agenteConvenioFilter = val;
      agenteCurrentPage = 1;
      renderAgenteView();
    }

    function setAgenteStatusFilter(val) {
      agenteStatusFilter = val;
      agenteCurrentPage = 1;
      renderAgenteView();
    }

    function setAgenteDayFilter(val) {
      agenteDayFilter = val;
      agenteCurrentPage = 1;
      renderAgenteView();
    }

    function onAgenteSearch(val) {
      agenteSearchQuery = (val || '').toLowerCase().trim();
      agenteCurrentPage = 1;
      renderAgenteView();
    }

    function setAgentePage(p) {
      agenteCurrentPage = p;
      renderAgenteView();
      const el = document.getElementById('agente-table-anchor');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderAgenteView() {
      const container = document.getElementById('view-agente');
      if (!container) return;

      if (!agenteData && agenteLoading) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);">
            <div style="font-size:32px; animation:spin 1s linear infinite; display:inline-block;">🔄</div>
            <h3 style="margin-top:16px; font-size:16px; color:var(--text);">Sincronizando com o Google Sheets...</h3>
            <p style="color:var(--text-3); font-size:13px; margin-top:4px;">Carregando os dados de Agente_Creabily_Outubro_2026_consolidado.xlsx</p>
          </div>
        `;
        return;
      }

      if (!agenteData) {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);">
            <div style="font-size:32px;">📊</div>
            <h3 style="margin-top:14px; font-size:16px; color:var(--text);">Nenhum dado sincronizado da planilha ainda</h3>
            <p style="color:var(--text-3); font-size:13px; margin:6px 0 16px;">Clique no botão abaixo para forçar o download e processamento ao vivo da planilha.</p>
            <button class="btn btn-primary" onclick="loadAgenteData(true)">🔄 Sincronizar Agora com Google Sheets</button>
          </div>
        `;
        return;
      }

      const k = agenteData.kpis || {};
      const allRows = agenteData.auditoria || [];
      const dias = agenteData.dias || [];
      const convenios = agenteData.convenios || [];

      // Filtragem
      const q = agenteSearchQuery;
      const filteredRows = allRows.filter(r => {
        // Unidade
        if (agenteUnitFilter === 'paulista' && !r.unidade.includes('PAULISTA')) return false;
        if (agenteUnitFilter === 'granja' && !r.unidade.includes('GRANJA')) return false;

        // Convênio
        if (agenteConvenioFilter !== 'all' && r.convenio !== agenteConvenioFilter) return false;

        // Status
        if (agenteStatusFilter !== 'all') {
          const s = ((r.status_agil || '') + ' ' + (r.validacao || '')).toLowerCase();
          if (agenteStatusFilter === 'concluido' && !s.includes('finalizado')) return false;
          if (agenteStatusFilter === 'pendente' && (!s.includes('pendente') && !s.includes('agendado'))) return false;
          if (agenteStatusFilter === 'falta' && (!s.includes('falta') && !s.includes('não compareceu') && !s.includes('nao compareceu'))) return false;
          if (agenteStatusFilter === 'cancelado' && (!s.includes('desmarcado') && !s.includes('cancelado'))) return false;
        }

        // Dia
        if (agenteDayFilter !== 'all' && r.data !== agenteDayFilter) return false;

        // Busca
        if (q) {
          const rowStr = `${r.data} ${r.horario} ${r.unidade} ${r.convenio} ${r.profissional} ${r.status_agil} ${r.validacao}`.toLowerCase();
          if (!rowStr.includes(q)) return false;
        }

        return true;
      });

      // Paginação
      const totalFiltered = filteredRows.length;
      const totalPages = Math.max(1, Math.ceil(totalFiltered / AGENTE_PAGE_SIZE));
      if (agenteCurrentPage > totalPages) agenteCurrentPage = totalPages;
      if (agenteCurrentPage < 1) agenteCurrentPage = 1;
      const startIdx = (agenteCurrentPage - 1) * AGENTE_PAGE_SIZE;
      const pageRows = filteredRows.slice(startIdx, startIdx + AGENTE_PAGE_SIZE);

      // Status Badge Helper
      const getStatusBadge = (status, val) => {
        const text = (status || val || '—');
        const low = text.toLowerCase();
        if (low.includes('finalizado')) {
          return `<span class="badge-status-concluido">✓ ${esc(text)}</span>`;
        }
        if (low.includes('pendente') || low.includes('agendado')) {
          return `<span class="badge-status-pendente">⏳ ${esc(text)}</span>`;
        }
        if (low.includes('falta') || low.includes('não compareceu') || low.includes('nao compareceu')) {
          return `<span class="badge-status-falta">✕ ${esc(text)}</span>`;
        }
        return `<span style="font-size:11px; padding:2px 6px; border-radius:4px; background:var(--surface-subtle); color:var(--text-2); font-weight:600;">${esc(text)}</span>`;
      };

      const sourceLabel = agenteData.source === 'google_sheets_live' 
        ? '🟢 Sincronizado ao vivo do Google Sheets' 
        : (agenteData.source === 'google_sheets_cache' ? '⚡ Cache inteligente (Google Sheets)' : '💾 Cópia local de contingência');

      const updatedStr = agenteData.updatedAt ? new Date(agenteData.updatedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';

      container.innerHTML = `
        <div class="agente-container">
          <!-- HERO GERENCIAL -->
          <div class="agente-hero">
            <div class="agente-hero-top">
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <div class="agente-live-badge">

                  <span>${sourceLabel}</span>
                </div>
                ${updatedStr ? `<span style="font-size:11.5px; color:var(--text-3);">Última sincronização: ${updatedStr}</span>` : ''}
              </div>
              <div class="agente-actions">
                <button class="btn-agente btn-agente-primary" onclick="loadAgenteData(true)" ${agenteLoading ? 'disabled' : ''}>
                  <span style="${agenteLoading ? 'animation:spin 1s linear infinite; display:inline-block;' : ''}">🔄</span>
                  ${agenteLoading ? 'Sincronizando...' : 'Sincronizar Agora'}
                </button>
                <a href="${agenteData.sheetUrl || 'https://docs.google.com/spreadsheets/d/1wjNWNjYG_7O2k2nVGuXOmd7WXQOWdcyS/edit?gid=816342701#gid=816342701'}" target="_blank" rel="noopener noreferrer" class="btn-agente btn-agente-sheets">
                  📊 Abrir no Google Sheets
                </a>
              </div>
            </div>

            <!-- KPIS GRID -->
            <div class="agente-kpis">
              <div class="agente-kpi-card">
                <div class="agente-kpi-title">Agendamentos Totais</div>
                <div class="agente-kpi-value">${(k.totalAgendamentos || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Paulista: <b>${(k.paulistaTotal || 1306).toLocaleString('pt-BR')}</b> | Granja: <b>${(k.granjaTotal || 352).toLocaleString('pt-BR')}</b></div>
              </div>
              <div class="agente-kpi-card">
                <div class="agente-kpi-title">Concluídos / Realizados</div>
                <div class="agente-kpi-value" style="color:#059669;">${(k.concluidos || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Taxa de conferência: <b>${k.taxaConclusao || 92.5}%</b></div>
              </div>
              <div class="agente-kpi-card">
                <div class="agente-kpi-title">Pendentes de Validação</div>
                <div class="agente-kpi-value" style="color:#D97706;">${(k.pendentes || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Auditoria em andamento</div>
              </div>
              <div class="agente-kpi-card">
                <div class="agente-kpi-title">Faltas / Não Compareceu</div>
                <div class="agente-kpi-value" style="color:#DC2626;">${((k.naoCompareceu || 0) + (k.faltasJustificadas || 0)).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">${k.naoCompareceu || 0} ausências + ${k.faltasJustificadas || 0} justificadas</div>
              </div>
              <div class="agente-kpi-card">
                <div class="agente-kpi-title">Cancelamentos</div>
                <div class="agente-kpi-value" style="color:var(--text-3);">${k.cancelamentos || 0}</div>
                <div class="agente-kpi-sub">Baixa taxa de desistência</div>
              </div>
            </div>

            <!-- BARRA DE SELEÇÃO POR DIA -->
            ${dias.length ? `
              <div style="margin-top:16px; font-size:11.5px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px;">Navegar por dia de Outubro/2026:</div>
              <div class="agente-days-bar">
                <button class="agente-day-chip ${agenteDayFilter === 'all' ? 'active' : ''}" onclick="setAgenteDayFilter('all')">
                  Todos os Dias (${(k.totalAgendamentos || 0)})
                </button>
                ${dias.map(d => `
                  <button class="agente-day-chip ${agenteDayFilter === d.data ? 'active' : ''}" onclick="setAgenteDayFilter('${d.data}')">

          </div>

          <div id="agente-table-anchor"></div>

    function card(l) {

      const isB2B = view === 'b2b';

      const ans = isB2B ? (l.transformacao || '') : firstAnswer(l);
      const isNoShow = l.status === 'no_show';
      const isPerdido = l.status === 'perdido';
      const hasPre = !isB2B && hasPreAgendamento(l) && l.status !== 'agendado';
      const temp = leadTemperature(l);
      const att = isAttended(l);
      return `<div class="card" draggable="true" data-id="${esc(l.id)}" onclick="openDrawer('${esc(l.id)}')">
        <div class="top">${avatar(l)}<div class="name">${esc(nameOf(l))}</div></div>
        ${sub ? `<p class="svc">${esc(sub)}</p>` : ''}
        ${ans ? `<div class="answer">${esc(ans)}</div>` : ''}
        <div class="chips">
          ${isB2B ? '' : unitChip(l)}
          ${hasPre ? `<span class="chip pre-agendado">${ic('calendar', 'icon-sm')}Pré-agendado</span>` : ''}
          ${isB2B ? '' : `<span class="chip ${temp.cls}">${temp.icon} ${temp.label}</span>`}
          ${isB2B ? '' : `<span class="chip ${att ? 'attended' : 'pending'}">${att ? '✅ Atendido' : '⏳ Pendente'}</span>`}
          ${isNoShow ? `<span class="chip noshow">${ic('userX', 'icon-sm')}Faltou</span>` : ''}
          ${isPerdido ? `<span class="chip perdido">${ic('archive', 'icon-sm')}Frio</span>` : ''}
          ${o ? `<span class="chip ${o.cls}">${esc(o.label)}</span>` : ''}
          ${ageChip(l)}
        </div>
        ${l.status === 'consulta_realizada' ? `
          <div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between">
            <span class="chip" style="background:#ccfbf1;color:#0f766e;font-weight:700;font-size:10.5px">${l.notes && l.notes.includes('[NPS') ? '⭐ NPS OK' : '⏳ Enviar NPS'}</span>
            ${phoneOf(l) ? `<a class="btn-action-wa" style="background:#0d9488;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:4px;" 
               href="${waLink(l, templates(l).pesquisa_nps)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Enviar pesquisa NPS no WhatsApp">
               ${ic('wa', 'icon-sm')} ⭐ NPS
            </a>` : ''}

    function scrollToStage(stageKey) {
      const col = document.querySelector(`.col[data-stage="${stageKey}"]`);
      if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function renderBoard(list) {
      const board = document.getElementById('board');
      const isB2B = view === 'b2b';

      // Definir quais estágios exibir conforme o filtro da toolbar
      let stagesToShow = STAGES;
      if (!isB2B) {
        if (boardFilter === 'active') {
          // Apenas estágios ativos do funil (esconde No-Show e Perdidos para manter o funil enxuto)
          stagesToShow = STAGES.filter(s => !['no_show', 'perdido'].includes(s.key));
        } else if (boardFilter === 'cold') {
          // Apenas os estágios finais frios: No-Show e Perdidos
          stagesToShow = STAGES.filter(s => ['no_show', 'perdido'].includes(s.key));
        }
      }

      // Atualiza botões da toolbar do funil
      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === boardFilter));

      // Atualiza atalhos rápidos em pills no mobile
      const pillsBar = document.getElementById('mobile-pills-bar');
      if (pillsBar) {
        pillsBar.innerHTML = stagesToShow.map(s => {
          let count = list.filter(l => stageOf(l.status) === s.key);
          if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') count = count.filter(l => !isLeadStale(l));
          return `<button type="button" class="m-pill" onclick="scrollToStage('${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short} (${count.length})</button>`;
        }).join('');
      }

      board.innerHTML = stagesToShow.map(s => {
        let items = list.filter(l => stageOf(l.status) === s.key);
        // No filtro 'active', também ocultamos leads parados > 7 dias para que fiquem fora da poluição visual
        if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') {
          items = items.filter(l => !isLeadStale(l));
        }
        items.sort((a, b) => new Date(b.status_changed_at || b.created_at) - new Date(a.status_changed_at || a.created_at));

        const isColdCol = ['no_show', 'perdido'].includes(s.key);
        const colClass = isColdCol ? (s.key === 'no_show' ? 'col col-noshow' : 'col col-perdido') : 'col';

        return `<div class="${colClass}" data-stage="${s.key}">
          <div class="col-head">
            <span class="dot" style="background:${s.color}"></span>
            <h4>${s.label}</h4>
            <span class="pill ${isColdCol ? (s.key === 'no_show' ? 'orange' : 'slate') : ''}">${items.length}</span>
          </div>
          ${items.length ? items.map(card).join('') : `<div class="col-empty">Nenhum lead aqui</div>`}
        </div>`;
      }).join('');
      bindDnD(board);
    }

    // Arrastar e soltar
    function bindDnD(board) {
      board.querySelectorAll('.card').forEach(c => {
        c.addEventListener('dragstart', e => { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      board.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
        col.addEventListener('drop', e => {
          e.preventDefault(); col.classList.remove('drop');
          const id = e.dataTransfer.getData('text/plain');
          const l = findLead(id);
          if (l && stageOf(l.status) !== col.dataset.stage) moveLead(id, col.dataset.stage);
        });
      });
    }

    // =========================================================
    // Ações
    // =========================================================
    function findLead(id) { return (view === 'b2b' ? leadsB2B : leadsB2C).find(l => String(l.id) === String(id)); }

    async function moveLead(id, stageKey) {
      const l = findLead(id); if (!l) return;
      const prev = { status: l.status, status_changed_at: l.status_changed_at };
      const status = dbStatus(stageKey);
      l.status = status; l.status_changed_at = new Date().toISOString();
      render();
      const r = await api('manage-lead', { action: 'update_status', id, status, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { Object.assign(l, prev); render(); toast('Não foi possível mover: ' + r.error, true); return; }
      toast(`${nameOf(l).split(' ')[0]} → ${stageInfo(status).label}`);
    }

    async function autoOrganizeStaleLeads() {
      const all = leadsB2C;
      const stale = all.filter(isLeadStale);
      if (stale.length === 0) {
        toast('Nenhum lead parado há mais de 7 dias no funil ativo!');
        return;
      }

      const agendadosCount = stale.filter(l => l.status === 'agendado').length;
      const outrosCount = stale.length - agendadosCount;

      const ok = await modal({
        title: 'Organizar contatos parados (> 7 dias)?',
        text: `Identificamos <b>${stale.length} contatos</b> que estão há mais de 7 dias no funil ativo sem avanço:<br><br>
               • <b>${agendadosCount} agendados</b> sem comparecimento → irão para <b>No-Show</b><br>
               • <b>${outrosCount} contatos</b> parados em Novos/Conversa → irão para <b>Perdidos / Frios</b><br><br>
               Isso despolui seu funil imediatamente e prepara os leads para o reaquecimento. Deseja aplicar?`,
        confirmLabel: 'Sim, Mover para Perdidos / No-Show'
      });

      if (!ok) return;

      const updates = stale.map(l => ({
        id: l.id,
        status: l.status === 'agendado' ? 'no_show' : 'perdido'
      }));

      // Atualização otimista
      updates.forEach(u => {
        const l = findLead(u.id);
        if (l) {
          l.status = u.status;
          l.status_changed_at = new Date().toISOString();
        }
      });
      render();
      toast(`Organizando ${updates.length} leads...`);

      const r = await api('manage-lead', { action: 'bulk_update_status', updates, tableType: 'b2c' });
      if (r.ok) {
        toast(`${updates.length} leads organizados com sucesso em No-Show e Perdidos!`);
        refreshData(true);
      } else {
        toast('Erro ao organizar: ' + r.error, true);
        refreshData(true);
      }
    }

    async function saveFields(id) {
      const l = findLead(id); if (!l) return;
      const note = document.getElementById('d-note').value.trim();
      const nextAction = document.getElementById('d-next').value.trim();
      const nextAt = document.getElementById('d-next-at').value;
      const stamp = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const fields = {
        next_action: nextAction || null,
        next_action_at: nextAt ? new Date(nextAt + 'T09:00:00').toISOString() : null
      };
      if (note) fields.notes = `[${stamp}] ${note}` + (l.notes ? '\n' + l.notes : '');
      const btn = document.getElementById('d-save'); btn.disabled = true; btn.textContent = 'Salvando...';
      const r = await api('manage-lead', { action: 'update_fields', id, fields, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      btn.disabled = false; btn.textContent = 'Salvar';
      if (!r.ok) { toast(r.error, true); return; }
      Object.assign(l, fields);
      document.getElementById('d-note').value = '';
      render(); toast('Anotação salva');
    }

    async function deleteLead(id) {
      const l = findLead(id); if (!l) return;
      const first = nameOf(l).split(' ')[0];
      const ok = await modal({ title: 'Excluir lead?', text: `Isso apaga <b>${esc(nameOf(l))}</b> para sempre. Para confirmar, digite <b>${esc(first)}</b>.`, confirmLabel: 'Excluir', danger: true, input: { placeholder: first, match: first } });
      if (!ok) return;
      const r = await api('manage-lead', { action: 'delete', id, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { toast(r.error, true); return; }
      if (view === 'b2b') leadsB2B = leadsB2B.filter(x => x.id !== l.id); else leadsB2C = leadsB2C.filter(x => x.id !== l.id);
      closeDrawer(); render(); toast('Lead excluído');
    }

    // =========================================================

    // =========================================================
    function openDrawer(id) {
      const l = findLead(id); if (!l) return;
      openLeadId = id;
      fillDrawer(l, true);
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'false');
      document.getElementById('scrim').classList.add('open');
    }
    function closeDrawer() {
      openLeadId = null;
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'true');
      document.getElementById('scrim').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.modal')) closeDrawer(); });

    function fillDrawer(l, fresh = false) {
      const d = document.getElementById('drawer');
      const keepMsg = !fresh && document.getElementById('d-msg') ? document.getElementById('d-msg').value : null;

      const o = origin(l);

      const cur = stageOf(l.status);
      const ph = phoneOf(l);
      const isOptedOut = Boolean(l.opted_out_at || (l.notes && l.notes.includes('[OPT-OUT]')));
      const answers = Array.isArray(l.quiz_answers) ? l.quiz_answers : [];
      const b2bFields = [['Profissão / negócio', l.profissao], ['Faturamento', l.faturamento], ['Momento', l.momento], ['Dores', l.dores], ['Transformação', l.transformacao], ['E-mail', l.email], ['Instagram', l.instagram]].filter(x => x[1]);
      const origemRows = [['Origem', o ? o.label : 'Não identificada'], ['Campanha', l.utm_campaign], ['Meio', l.utm_medium], ['Palavra-chave', l.utm_term], ['Anúncio', l.utm_content], ['Entrou em', l.created_at ? dateFmt(l.created_at) : '']].filter(x => x[1]);
      const nextDate = l.next_action_at ? new Date(l.next_action_at).toLocaleDateString('en-CA') : '';

      d.innerHTML = `
        <div class="d-head">

          <div class="who"><h3>${esc(nameOf(l))}</h3>
            <div class="meta">${isB2B ? '<span class="chip">Mentoria B2B</span>' : unitChip(l)}<span>${esc(phoneFmt(ph))}</span>${ageChip(l)}</div></div>
          <button class="btn btn-ghost btn-icon" onclick="closeDrawer()" aria-label="Fechar">${ic('x')}</button>
        </div>
        <div class="d-body">
          <div class="d-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <h5 style="margin:0">Etapa do Lead</h5>
              <span class="chip" style="font-weight:600;background:${stageInfo(l.status).color}15;color:${stageInfo(l.status).color}">${stageInfo(l.status).label}</span>
            </div>
            <div class="stage-group-label">Funil Ativo</div>
            <div class="stages stages-active">
              ${STAGES.filter(s => !['consulta_realizada', 'no_show', 'perdido'].includes(s.key)).map(s => `<button class="stage ${cur === s.key ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short}</button>`).join('')}
            </div>
            <div class="stage-group-label">Desfecho / Conclusão</div>
            <div class="stages stages-outcomes">
              <button class="stage ${cur === 'consulta_realizada' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','consulta_realizada')"><span class="dot" style="background:#1f9d55"></span>Atendido</button>
              <button class="stage ${cur === 'no_show' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','no_show')"><span class="dot" style="background:#ea580c"></span>No-Show</button>
              <button class="stage ${cur === 'perdido' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','perdido')"><span class="dot" style="background:#64748b"></span>Perdido</button>
            </div>
            ${l.status === 'consulta_realizada' ? `
            <div style="margin-top:12px;padding:12px;background:rgba(13,148,136,0.08);border:1px solid rgba(13,148,136,0.25);border-radius:10px;">
              <div style="font-size:12px;font-weight:700;color:#0f766e;margin-bottom:4px;display:flex;align-items:center;gap:6px">
                ⭐ Pós-Atendimento & Avaliação de Satisfação
              </div>
              <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.4">Paciente atendido na clínica! Envie a pesquisa inteligente de NPS: notas 9-10 são direcionadas para avaliar no Google Maps e notas baixas geram acolhimento confidencial.</p>
              ${ph ? `<a class="btn btn-action-wa" style="background:#0d9488;color:#fff;width:100%;justify-content:center;display:flex;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(13,148,136,0.25);" 
                 href="${waLink(l, templates(l).pesquisa_nps)}" target="_blank" rel="noopener">
                ${ic('wa', 'icon-sm')} ⭐ Enviar Pesquisa NPS no WhatsApp
              </a>` : ''}
            </div>` : ''}
          </div>

          ${ph ? `<div class="d-section"><h5>Mensagem de WhatsApp</h5>
            ${isOptedOut ? `<div style="background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:8px">🚫 Paciente solicitou descadastro (PARAR). Não envie mensagens automáticas ou de reaquecimento.</div>` : ''}
            <div class="tpl">${Object.keys(tpls).map(k => `<button data-tpl="${k}" class="${k === tplKey ? 'on' : ''}" onclick="pickTpl('${k}')">${TPL_LABELS[k] || k}</button>`).join('')}</div>
            <textarea class="input" id="d-msg" rows="5">${esc(keepMsg ?? tpls[tplKey])}</textarea>
            <div class="grid2" style="margin-top:8px">
              <button class="btn" onclick="copyMsg()">${ic('copy', 'icon-sm')}Copiar</button>
              <a class="btn btn-wa" id="d-wa" target="_blank" rel="noopener" href="#" onclick="this.href=waLink(findLead('${esc(l.id)}'), document.getElementById('d-msg').value)">${ic('wa', 'icon-sm')}Abrir no WhatsApp</a>
            </div>
            <p class="muted" style="margin:8px 0 0">Depois de enviar, mova o lead de etapa para registrar o contato.</p>
          </div>` : ''}

          ${!isB2B ? `<div class="d-section"><h5>Respostas do quiz</h5>
            <div class="kv" style="margin-bottom:${answers.length ? 12 : 0}px"><dt>Interesse</dt><dd><b>${esc(service(l))}</b></dd></div>
            ${answers.length ? `<div class="qa">${answers.map(a => `<div><div class="q">${esc(a.pergunta)}</div><div class="a">${esc(a.resposta)}</div></div>`).join('')}</div>`
              : '<p class="muted" style="margin:0">Respostas detalhadas não registradas (lead anterior à atualização).</p>'}
            ${l.agendamento_resumo ? `<div class="note-old" style="margin-top:12px"><b>Pré-agendamento registrado:</b><br>${esc(String(l.agendamento_resumo).replace('AGENDADO_SUCESSO', '').trim())}</div>` : ''}
          </div>` : `<div class="d-section"><h5>Aplicação</h5><dl class="kv">${b2bFields.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`}

          <div class="d-section"><h5>Anotações e próximo passo</h5>
            ${l.notes && l.notes.includes('[NPS') ? `
              <div style="background:#ccfbf1;border:1px solid rgba(13,148,136,0.3);color:#0f766e;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px">
                ⭐ Avaliação de Satisfação (NPS) Registrada para este paciente
              </div>` : ''}
            ${l.notes ? `<div class="note-old">${esc(l.notes)}</div>` : ''}
            <textarea class="input" id="d-note" rows="3" placeholder="Ex.: Prefere horário à noite; vai ver com o marido.">${esc(keepNote)}</textarea>
            <div class="grid2" style="margin-top:8px">
              <input class="input" id="d-next" placeholder="Próximo passo" value="${esc(l.next_action || '')}">
              <input class="input" id="d-next-at" type="date" value="${nextDate}">
            </div>
            <button class="btn btn-primary btn-block" id="d-save" style="margin-top:8px" onclick="saveFields('${esc(l.id)}')">Salvar</button>
          </div>

          ${!isB2B ? `<div class="d-section"><h5>Origem</h5><dl class="kv">${origemRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
        </div>
        <div class="d-foot">
          <button class="btn btn-ghost btn-danger" onclick="deleteLead('${esc(l.id)}')">${ic('trash', 'icon-sm')}Excluir</button>
        </div>`;
    }
    function pickTpl(k) {
      const l = findLead(openLeadId); if (!l) return;
      document.getElementById('d-msg').value = templates(l)[k];
      document.querySelectorAll('.tpl button').forEach(b => b.classList.toggle('on', b.dataset.tpl === k));
    }
    async function copyMsg() {
      try { await navigator.clipboard.writeText(document.getElementById('d-msg').value); toast('Mensagem copiada'); }
      catch (e) { toast('Não foi possível copiar', true); }
    }
  </script>
</body>
</html>
