          ['Não Compareceu (Pendentes de Token/Assinatura)', k.naoCompareceu || 0],
          ['Cancelamentos', k.cancelamentos || 0],
          ['Alertas NPS 10ª Sessão (Pacientes Novos - Azul)', k.npsAlertas || 0]
        ]);
        wsPainel['!cols'] = [{ wch: 48 }, { wch: 24 }];
        XLSX.utils.book_append_sheet(wb, wsPainel, 'PAINEL GERENCIAL');

        // 17. AÇÕES ADMINISTRATIVAS (Lista EM ABERTO + Alertas NPS em Azul)
        const acoesRows = allRows.filter(x =>
          (x.acao_lembrete && x.acao_lembrete.trim() !== '') ||
          !/validado|finalizado|justificada/i.test(x.validacao || '')
        );
        const acoesData = [
          ['AÇÕES ADMINISTRATIVAS, PENDÊNCIAS EM ABERTO E ALERTAS DE NPS (10ª SESSÃO PACIENTES NOVOS)'],
          [],
          ['Data', 'Unidade', 'Convênio', 'Paciente', 'Horário', 'Sessão', 'Status Ágil', 'Validação Atual', 'Ação / Alerta Clínico', 'Observação']
        ];
        acoesRows.forEach(row => {
          acoesData.push([
            row.data, row.unidade, row.convenio, row.paciente, row.horario,
            row.sessao, row.status_agil, row.validacao, row.acao_lembrete, row.observacao
          ]);
        });
        const wsAcoes = XLSX.utils.aoa_to_sheet(acoesData);
        wsAcoes['!cols'] = [{ wch: 12 }, { wch: 16 }, { wch: 26 }, { wch: 32 }, { wch: 10 }, { wch: 10 }, { wch: 20 }, { wch: 22 }, { wch: 50 }, { wch: 28 }];
        XLSX.utils.book_append_sheet(wb, wsAcoes, 'AÇÕES ADMINISTRATIVAS');

        const fileSuffix = targetDate !== 'all' ? targetDate.replace(/\//g, '-') : 'Outubro_2026_consolidado';
        XLSX.writeFile(wb, `Agente_Creabily_${fileSuffix}.xlsx`);
        toast('✅ Planilha Excel exportada com sucesso!');
      } catch (err) {
        toast('Erro ao exportar Excel: ' + err.message, true);
      }
    }

    // Renderizador Principal da Interface do Agente
    function renderAgenteView() {
      const container = document.getElementById('view-agente');
      if (!container) return;

      if (!agenteData && agenteLoading) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);">
            <div style="font-size:32px; animation:spin 1s linear infinite; display:inline-block;">🔄</div>
            <h3 style="margin-top:16px; font-size:16px; color:var(--text);">Carregando dados do Supabase...</h3>
            <p style="color:var(--text-3); font-size:13px; margin-top:4px;">Conectando ao banco de dados PostgreSQL corporativo</p>
          </div>
        `;
        return;
      }

      if (!agenteData) {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);">
            <div style="font-size:32px;">📊</div>
            <h3 style="margin-top:14px; font-size:16px; color:var(--text);">Nenhum dado encontrado no banco</h3>
            <p style="color:var(--text-3); font-size:13px; margin:6px 0 16px;">Clique no botão abaixo para carregar os agendamentos auditados.</p>
            <button class="btn btn-primary" onclick="loadAgenteData(true)">🔄 Conectar ao Supabase</button>
          </div>
        `;
        return;
      }

      const k = agenteData.kpis || {};
      const rows = agenteData.rows || [];
      const dias = agenteData.dias || [];
      const convenios = agenteData.convenios || [];
      const totalFiltered = agenteData.total || 0;
      const totalPages = agenteData.totalPages || 1;

      // Mapeamento de Cores Oficiais do Prompt Mestre (Seção 7.1 a 7.6)
      const getRowClass = (r) => {
        const val = (r.validacao || '').toLowerCase();
        const st = (r.status_agil || '').toLowerCase();
        const acao = (r.acao_lembrete || '');
        // 7.1 e 7.6: Quando já validado, o verde de validação prevalece (mantendo o lembrete azul na coluna de ações)
        if (val.includes('finalizado') || val.includes('validado')) return 'row-val-validado';
        // 7.4: Falta justificada sempre em fundo branco, nunca pintar de vermelho, laranja ou verde
        if (val.includes('justificada') || st.includes('justificada')) return 'row-val-falta';
        // 7.5: Não compareceu em vermelho enquanto não houver validação de token ou assinatura
        if (val.includes('não compareceu') || val.includes('nao compareceu') || st.includes('não compareceu') || st.includes('nao compareceu')) return 'row-val-noshow';
        // 7.6: Alerta NPS em Azul para 10ª sessão de pacientes novos
        if (acao.includes('ALERTA NPS')) return 'row-val-nps';
        if (val.includes('cancelado') || val.includes('desmarcado') || st.includes('desmarcado')) return 'row-val-cancelado';
        return 'row-val-pendente';
      };

      const getAlertBadge = (alerta, r) => {
        if (!alerta) return '';
        const parts = String(alerta).split(/\s*(?:•|\|)\s*/).filter(Boolean);
        return `<div style="display:flex; flex-direction:column; gap:3px; align-items:flex-start;">` + parts.map(item => {
          if (item.includes('ALERTA NPS')) {
            const pSafe = r ? esc(r.paciente || '').replace(/'/g, "\\'") : '';
            const uSafe = r ? esc(r.unidade || '').replace(/'/g, "\\'") : '';
            return `
              <span class="alerta-nps" title="Paciente novo finalizando 10ª sessão — Enviar pesquisa de satisfação NPS">
                ${esc(item)}
              </span>
              ${r ? `<button type="button" class="btn-nps-inline" onclick="openNpsShareModal('${pSafe}', '${uSafe}')">📨 Enviar NPS (10ª Sessão)</button>` : ''}
            `;
          }
          if (item.includes('PACIENTE NOVO') || item.includes('Paciente Novo') || item.includes('Preparar NPS')) {
            return `<span class="alerta-novo-paciente">${esc(item)}</span>`;
          }
          if (item.includes('1ª') || item.includes('Avaliação Inicial')) {
            return `<span class="alerta-primeira-sessao">${esc(item)}</span>`;
          }
          if (item.includes('Renovação') || item.includes('ALERTA FINAL') || item.includes('MEDSENIOR') || item.includes('Token') || item.includes('Cancelamento')) {
            return `<span class="alerta-fim-ciclo">${esc(item)}</span>`;
          }
          return `<span style="font-size:10.5px; color:var(--text-2); font-weight:600;">${esc(item)}</span>`;
        }).join('') + `</div>`;
      };

      // ===== Gráficos (SVG puro, sem dependências) =====
      const statusSegs = [
        { key: 'validado', label: 'Validados', val: k.validados || 0, color: '#16A34A' },
        { key: 'pendente', label: 'Pendentes', val: k.pendentes || 0, color: '#F59E0B' },
        { key: 'falta_justificada', label: 'Falta justificada', val: k.faltasJustificadas || 0, color: '#9CA3AF' },
        { key: 'nao_compareceu', label: 'Não compareceu', val: k.naoCompareceu || 0, color: '#DC2626' },
        { key: 'nps', label: '🔵 Alerta NPS / Novos', val: k.npsCicloTotal || k.npsAlertas || 0, color: '#2563EB' },
        { key: 'cancelado', label: 'Cancelados', val: k.cancelamentos || 0, color: '#F97316' }
      ];
      const statusTotal = statusSegs.reduce((a, s) => a + s.val, 0) || 1;
      const R = 52, CIRC = 2 * Math.PI * R;
      let offAcc = 0;
      const donutCircles = statusSegs.map(s => {
        const len = (s.val / statusTotal) * CIRC;
        const c = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-offAcc}" transform="rotate(-90 70 70)"><title>${s.label}: ${s.val}</title></circle>`;
        offAcc += len;
        return c;
      }).join('');
      const donutSvg = `<svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
        ${donutCircles}
        <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor" class="donut-center">${k.taxaConclusao || 0}%</text>
        <text x="70" y="86" text-anchor="middle" font-size="9.5" font-weight="700" fill="#94A3B8">CONCLUÍDO</text>

      const maxConv = Math.max(1, ...convenios.map(c => c.count));
      const convBars = convenios.map(c => `
        <div class="hbar-row ${agenteConvenioFilter === c.convenio ? 'active' : ''}" onclick="setAgenteConvenioFilter('${agenteConvenioFilter === c.convenio ? 'all' : esc(c.convenio)}')" title="${esc(c.convenio)}: ${c.count}">
          <span class="hbar-label">${esc(c.convenio)}</span>
          <div class="hbar-track"><div class="hbar-seg" style="width:${(c.count / maxConv) * 100}%; background:linear-gradient(90deg,#8B5CF6,#6b308b);"></div></div>
          <span class="hbar-val">${c.count}</span>
        </div>`).join('');

      const parseD = (s) => { const p = String(s).split('/'); return new Date(+p[2], +p[1] - 1, +p[0]).getTime() || 0; };
      const diasAsc = [...dias].sort((a, b) => parseD(a.data) - parseD(b.data));
      const maxDia = Math.max(1, ...diasAsc.map(d => d.count));
      const dayCols = diasAsc.map(d => `
        <div class="col-item ${agenteDayFilter === d.data ? 'active' : ''}" onclick="setAgenteDayFilter('${agenteDayFilter === d.data ? 'all' : d.data}')" title="${d.data}: ${d.count} atendimentos">

          <span class="col-lbl">${d.data.substring(0, 2)}</span>
        </div>`).join('');

      const pTot = k.paulistaTotal || 0, gTot = k.granjaTotal || 0;
      const pPct = (pTot + gTot) ? Math.round((pTot / (pTot + gTot)) * 100) : 0;
      const openRate = k.totalAgendamentos ? Math.round(((k.pendentes || 0) / k.totalAgendamentos) * 100) : 0;

          <div class="agente-charts-head">
            <div class="agente-charts-title">📈 Visão Gráfica da Conferência <span style="font-size:11px; font-weight:600; color:var(--text-3);">(clique nos gráficos para filtrar)</span></div>
            <button class="btn-agente" onclick="toggleAgenteCharts()">${agenteChartsOpen ? '▾ Recolher' : '▸ Expandir'}</button>

          ${agenteChartsOpen ? `
          <div class="agente-charts-grid">
            <div class="chart-card">
              <h4>Situação dos atendimentos</h4>

                ${donutSvg}

                    <button class="legend-item ${agenteStatusFilter === s.key ? 'active' : ''}" onclick="setAgenteStatusFilter('${agenteStatusFilter === s.key ? 'all' : s.key}')">
                      <span><span class="legend-dot" style="background:${s.color};"></span>${s.label}</span><b>${s.val.toLocaleString('pt-BR')}</b>
                    </button>`).join('')}
                </div>
              </div>
            </div>

            <div class="chart-card">
              <h4>Atendimentos por convênio</h4>
              <div class="hbar-list">${convBars || '<span style="font-size:12px;color:var(--text-3);">Sem dados</span>'}</div>
            </div>

            <div class="chart-card">
              <h4>Unidades & pendências</h4>
              <div class="unit-split">
                <div class="unit-bar">
                  <div style="width:${pPct}%; background:#6b308b;" title="Paulista ${pTot}"></div>
                  <div style="width:${100 - pPct}%; background:#0E7490;" title="Granja ${gTot}"></div>
                </div>
                <div class="unit-legend">
                  <span><span class="legend-dot" style="background:#6b308b;"></span>🏙️ Paulista · ${pTot.toLocaleString('pt-BR')} (${pPct}%)</span>
                  <span><span class="legend-dot" style="background:#0E7490;"></span>🌿 Granja · ${gTot.toLocaleString('pt-BR')}</span>
                </div>
              </div>
              <div style="margin-top:6px;">
                <div style="display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--text-2); margin-bottom:5px;">
                  <span>⏳ Em aberto na recepção</span><span style="color:#D97706;">${(k.pendentes || 0).toLocaleString('pt-BR')} (${openRate}%)</span>
                </div>
                <div class="hbar-track" style="height:12px;"><div class="hbar-seg" style="width:${openRate}%; background:linear-gradient(90deg,#FBBF24,#F59E0B);"></div></div>
              </div>
            </div>

            <div class="chart-card wide">
              <h4>Volume diário de atendimentos</h4>
              <div class="col-chart">${dayCols || '<span style="font-size:12px;color:var(--text-3);">Sem dados</span>'}</div>
            </div>
          </div>` : ''}
        </div>`;

      const hasActiveFilters = agenteUnitFilter !== 'all' || agenteConvenioFilter !== 'all' || agenteStatusFilter !== 'all' || agenteDayFilter !== 'all' || agenteSearchQuery;
      const statusLabels = { validado: 'Validados', pendente: 'Pendentes', falta_justificada: 'Falta justificada', nao_compareceu: 'Não compareceu', cancelado: 'Cancelados', nps: '🔵 Alerta NPS / Pacientes Novos', nps_10: '🔵 ⭐ Alerta NPS (10ª Sessão)' };
      const activeFiltersHtml = hasActiveFilters ? `
        <div class="active-filters">
          <span style="color:var(--text-3); font-weight:700;">Filtros ativos:</span>
          ${agenteDayFilter !== 'all' ? `<span class="filter-chip">📅 ${esc(agenteDayFilter)}</span>` : ''}
          ${agenteConvenioFilter !== 'all' ? `<span class="filter-chip">🏥 ${esc(agenteConvenioFilter)}</span>` : ''}
          ${agenteUnitFilter !== 'all' ? `<span class="filter-chip">${agenteUnitFilter === 'paulista' ? '🏙️ Paulista' : '🌿 Granja'}</span>` : ''}
          ${agenteStatusFilter !== 'all' ? `<span class="filter-chip">${statusLabels[agenteStatusFilter] || esc(agenteStatusFilter)}</span>` : ''}
          ${agenteSearchQuery ? `<span class="filter-chip">🔍 ${esc(agenteSearchQuery)}</span>` : ''}
          <button class="btn-clear-filters" onclick="clearAgenteFilters()">✕ Limpar tudo</button>
        </div>` : '';

      const getValStatusBadge = (r) => {
        const val = (r.validacao || 'Pendente').trim();
        const valLow = val.toLowerCase();
        if (valLow.includes('validado') || valLow.includes('finalizado')) {
          return `<span style="color:#16A34A; font-weight:700;">🟢 ${esc(val)}</span>`;

        if (valLow.includes('justificada') || (r.status_agil || '').toLowerCase().includes('justificada')) {

        }
        if (valLow.includes('não compareceu') || valLow.includes('nao compareceu') || (r.status_agil || '').toLowerCase().includes('não compareceu')) {

        return '<span style="color:#D97706; font-weight:700;">⏳ Pendente</span>';

          <div class="agente-hero">

              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

                <span style="font-size:11.5px; color:var(--text-3);">Instância Corporativa • 100% Blindado</span>
              </div>
              <div class="agente-actions">
                <button class="btn-agente btn-agente-import" onclick="openAgenteImportModal()">
                  📥 Importar Relatório do Ágil

                  📄 Exportar Dia (${agenteDayFilter !== 'all' ? agenteDayFilter.substring(0, 5) : 'Hoje'})
                </button>
                <button class="btn-agente btn-agente-sheets" onclick="exportAgenteExcel(false)" title="Exportar planilha consolidada completa com todas as 17 abas oficiais">
                  📊 Exportar Consolidado (17 Abas)
                </button>
                <button class="btn-agente" onclick="loadAgenteData(true)">
                  🔄 Atualizar Dados
                </button>
              </div>
            </div>

            <!-- KPIS GRID DO PAINEL GERENCIAL -->
            <div class="agente-kpis">
              <div class="agente-kpi-card" style="cursor:pointer;" onclick="clearAgenteFilters()">
                <div class="agente-kpi-title">Total Atendimentos</div>
                <div class="agente-kpi-value">${(k.totalAgendamentos || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Paulista: <b>${(k.paulistaTotal || 0).toLocaleString('pt-BR')}</b> | Granja: <b>${(k.granjaTotal || 0).toLocaleString('pt-BR')}</b></div>
              </div>
              <div class="agente-kpi-card" style="border-left: 3px solid #16A34A; cursor:pointer;" onclick="setAgenteStatusFilter(agenteStatusFilter === 'validado' ? 'all' : 'validado')">
                <div class="agente-kpi-title" style="color:#16A34A;">Validados / Concluídos</div>
                <div class="agente-kpi-value" style="color:#16A34A;">${(k.validados || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Taxa: <b>${k.taxaConclusao || 0}%</b> auditado</div>
              </div>
              <div class="agente-kpi-card" style="border-left: 3px solid #F59E0B; cursor:pointer;" onclick="setAgenteStatusFilter(agenteStatusFilter === 'pendente' ? 'all' : 'pendente')">
                <div class="agente-kpi-title" style="color:#D97706;">Pendentes em Aberto</div>
                <div class="agente-kpi-value" style="color:#D97706;">${(k.pendentes || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Exigem ação da recepção</div>
              </div>
              <div class="agente-kpi-card" style="border-left: 3px solid #9CA3AF; cursor:pointer;" onclick="setAgenteStatusFilter(agenteStatusFilter === 'falta_justificada' ? 'all' : 'falta_justificada')">
                <div class="agente-kpi-title">Faltas Justificadas</div>
                <div class="agente-kpi-value" style="color:#4B5563;">${(k.faltasJustificadas || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Fundo branco • sem cobrança</div>
              </div>
              <div class="agente-kpi-card" style="border-left: 3px solid #DC2626; cursor:pointer;" onclick="setAgenteStatusFilter(agenteStatusFilter === 'nao_compareceu' ? 'all' : 'nao_compareceu')">
                <div class="agente-kpi-title" style="color:#DC2626;">Não Compareceu</div>
                <div class="agente-kpi-value" style="color:#DC2626;">${(k.naoCompareceu || 0).toLocaleString('pt-BR')}</div>
                <div class="agente-kpi-sub">Vermelho • validar token/assin.</div>
              </div>
              <div class="agente-kpi-card" style="border-left: 3px solid #2563EB; background:rgba(37,99,235,0.05); cursor:pointer;" onclick="setAgenteStatusFilter(agenteStatusFilter === 'nps' ? 'all' : 'nps')" title="Clique para filtrar Pacientes Novos em ciclo de 10 sessões e Alertas de NPS na 10ª sessão">
                <div class="agente-kpi-title" style="color:#2563EB;">🔵 Alerta NPS (Novos)</div>
                <div class="agente-kpi-value" style="color:#2563EB;">${(k.npsAlertas || 0).toLocaleString('pt-BR')} <span style="font-size:12px; font-weight:700; color:#1D4ED8;">(10ª sessão)</span></div>

              <div class="agente-days-bar">

                ${dias.map(d => `

    function card(l) {
      const o = origin(l);
      const isB2B = view === 'b2b';
      const sub = isB2B ? (l.profissao || l.faturamento || '') : service(l);
      const ans = isB2B ? (l.transformacao || '') : firstAnswer(l);
      const isNoShow = l.status === 'no_show';
      const isPerdido = l.status === 'perdido';
      const hasPre = !isB2B && hasPreAgendamento(l) && l.status !== 'agendado';
      const temp = leadTemperature(l);
      const att = isAttended(l);
      return `<div class="card" draggable="true" data-id="${esc(l.id)}" onclick="openDrawer('${esc(l.id)}')">
        <div class="top">${avatar(l)}<div class="name">${esc(nameOf(l))}</div></div>
        ${sub ? `<p class="svc">${esc(sub)}</p>` : ''}
        ${ans ? `<div class="answer">${esc(ans)}</div>` : ''}
        <div class="chips">
          ${isB2B ? '' : unitChip(l)}
          ${hasPre ? `<span class="chip pre-agendado">${ic('calendar', 'icon-sm')}Pré-agendado</span>` : ''}
          ${isB2B ? '' : `<span class="chip ${temp.cls}">${temp.icon} ${temp.label}</span>`}
          ${isB2B ? '' : `<span class="chip ${att ? 'attended' : 'pending'}">${att ? '✅ Atendido' : '⏳ Pendente'}</span>`}
          ${isNoShow ? `<span class="chip noshow">${ic('userX', 'icon-sm')}Faltou</span>` : ''}
          ${isPerdido ? `<span class="chip perdido">${ic('archive', 'icon-sm')}Frio</span>` : ''}
          ${o ? `<span class="chip ${o.cls}">${esc(o.label)}</span>` : ''}
          ${ageChip(l)}
        </div>
        ${l.status === 'consulta_realizada' ? `
          <div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between">
            <span class="chip" style="background:#ccfbf1;color:#0f766e;font-weight:700;font-size:10.5px">${l.notes && l.notes.includes('[NPS') ? '⭐ NPS OK' : '⏳ Enviar NPS'}</span>
            ${phoneOf(l) ? `<a class="btn-action-wa" style="background:#0d9488;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:4px;" 
               href="${waLink(l, templates(l).pesquisa_nps)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Enviar pesquisa NPS no WhatsApp">
               ${ic('wa', 'icon-sm')} ⭐ NPS
            </a>` : ''}
          </div>
        ` : ''}
      </div>`;
    }

    function scrollToStage(stageKey) {
      const col = document.querySelector(`.col[data-stage="${stageKey}"]`);
      if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function renderBoard(list) {
      const board = document.getElementById('board');
      const isB2B = view === 'b2b';

      // Definir quais estágios exibir conforme o filtro da toolbar
      let stagesToShow = STAGES;
      if (!isB2B) {
        if (boardFilter === 'active') {
          // Apenas estágios ativos do funil (esconde No-Show e Perdidos para manter o funil enxuto)
          stagesToShow = STAGES.filter(s => !['no_show', 'perdido'].includes(s.key));
        } else if (boardFilter === 'cold') {
          // Apenas os estágios finais frios: No-Show e Perdidos
          stagesToShow = STAGES.filter(s => ['no_show', 'perdido'].includes(s.key));
        }
      }

      // Atualiza botões da toolbar do funil
      document.querySelectorAll('#board-tabs button').forEach(b => b.classList.toggle('on', b.dataset.bfilter === boardFilter));

      // Atualiza atalhos rápidos em pills no mobile
      const pillsBar = document.getElementById('mobile-pills-bar');
      if (pillsBar) {
        pillsBar.innerHTML = stagesToShow.map(s => {
          let count = list.filter(l => stageOf(l.status) === s.key);
          if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') count = count.filter(l => !isLeadStale(l));
          return `<button type="button" class="m-pill" onclick="scrollToStage('${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short} (${count.length})</button>`;
        }).join('');
      }

      board.innerHTML = stagesToShow.map(s => {
        let items = list.filter(l => stageOf(l.status) === s.key);
        // No filtro 'active', também ocultamos leads parados > 7 dias para que fiquem fora da poluição visual
        if (!isB2B && boardFilter === 'active' && s.key !== 'consulta_realizada') {
          items = items.filter(l => !isLeadStale(l));
        }
        items.sort((a, b) => new Date(b.status_changed_at || b.created_at) - new Date(a.status_changed_at || a.created_at));

        const isColdCol = ['no_show', 'perdido'].includes(s.key);
        const colClass = isColdCol ? (s.key === 'no_show' ? 'col col-noshow' : 'col col-perdido') : 'col';

        return `<div class="${colClass}" data-stage="${s.key}">
          <div class="col-head">
            <span class="dot" style="background:${s.color}"></span>
            <h4>${s.label}</h4>
            <span class="pill ${isColdCol ? (s.key === 'no_show' ? 'orange' : 'slate') : ''}">${items.length}</span>
          </div>
          ${items.length ? items.map(card).join('') : `<div class="col-empty">Nenhum lead aqui</div>`}
        </div>`;
      }).join('');
      bindDnD(board);
    }

    // Arrastar e soltar
    function bindDnD(board) {
      board.querySelectorAll('.card').forEach(c => {
        c.addEventListener('dragstart', e => { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; });
        c.addEventListener('dragend', () => c.classList.remove('dragging'));
      });
      board.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
        col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
        col.addEventListener('drop', e => {
          e.preventDefault(); col.classList.remove('drop');
          const id = e.dataTransfer.getData('text/plain');
          const l = findLead(id);
          if (l && stageOf(l.status) !== col.dataset.stage) moveLead(id, col.dataset.stage);
        });
      });
    }

    // =========================================================
    // Ações
    // =========================================================
    function findLead(id) { return (view === 'b2b' ? leadsB2B : leadsB2C).find(l => String(l.id) === String(id)); }

    async function moveLead(id, stageKey) {
      const l = findLead(id); if (!l) return;
      const prev = { status: l.status, status_changed_at: l.status_changed_at };
      const status = dbStatus(stageKey);
      l.status = status; l.status_changed_at = new Date().toISOString();
      render();
      const r = await api('manage-lead', { action: 'update_status', id, status, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { Object.assign(l, prev); render(); toast('Não foi possível mover: ' + r.error, true); return; }
      toast(`${nameOf(l).split(' ')[0]} → ${stageInfo(status).label}`);
    }

    async function autoOrganizeStaleLeads() {
      const all = leadsB2C;
      const stale = all.filter(isLeadStale);
      if (stale.length === 0) {
        toast('Nenhum lead parado há mais de 7 dias no funil ativo!');
        return;
      }

      const agendadosCount = stale.filter(l => l.status === 'agendado').length;
      const outrosCount = stale.length - agendadosCount;

      const ok = await modal({
        title: 'Organizar contatos parados (> 7 dias)?',
        text: `Identificamos <b>${stale.length} contatos</b> que estão há mais de 7 dias no funil ativo sem avanço:<br><br>
               • <b>${agendadosCount} agendados</b> sem comparecimento → irão para <b>No-Show</b><br>
               • <b>${outrosCount} contatos</b> parados em Novos/Conversa → irão para <b>Perdidos / Frios</b><br><br>
               Isso despolui seu funil imediatamente e prepara os leads para o reaquecimento. Deseja aplicar?`,
        confirmLabel: 'Sim, Mover para Perdidos / No-Show'
      });

      if (!ok) return;

      const updates = stale.map(l => ({
        id: l.id,
        status: l.status === 'agendado' ? 'no_show' : 'perdido'
      }));

      // Atualização otimista
      updates.forEach(u => {
        const l = findLead(u.id);
        if (l) {
          l.status = u.status;
          l.status_changed_at = new Date().toISOString();
        }
      });
      render();
      toast(`Organizando ${updates.length} leads...`);

      const r = await api('manage-lead', { action: 'bulk_update_status', updates, tableType: 'b2c' });
      if (r.ok) {
        toast(`${updates.length} leads organizados com sucesso em No-Show e Perdidos!`);
        refreshData(true);
      } else {
        toast('Erro ao organizar: ' + r.error, true);
        refreshData(true);
      }
    }

    async function saveFields(id) {
      const l = findLead(id); if (!l) return;
      const note = document.getElementById('d-note').value.trim();
      const nextAction = document.getElementById('d-next').value.trim();
      const nextAt = document.getElementById('d-next-at').value;
      const stamp = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const fields = {
        next_action: nextAction || null,
        next_action_at: nextAt ? new Date(nextAt + 'T09:00:00').toISOString() : null
      };
      if (note) fields.notes = `[${stamp}] ${note}` + (l.notes ? '\n' + l.notes : '');
      const btn = document.getElementById('d-save'); btn.disabled = true; btn.textContent = 'Salvando...';
      const r = await api('manage-lead', { action: 'update_fields', id, fields, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      btn.disabled = false; btn.textContent = 'Salvar';
      if (!r.ok) { toast(r.error, true); return; }
      Object.assign(l, fields);
      document.getElementById('d-note').value = '';
      render(); toast('Anotação salva');
    }

    async function deleteLead(id) {
      const l = findLead(id); if (!l) return;
      const first = nameOf(l).split(' ')[0];
      const ok = await modal({ title: 'Excluir lead?', text: `Isso apaga <b>${esc(nameOf(l))}</b> para sempre. Para confirmar, digite <b>${esc(first)}</b>.`, confirmLabel: 'Excluir', danger: true, input: { placeholder: first, match: first } });
      if (!ok) return;
      const r = await api('manage-lead', { action: 'delete', id, tableType: view === 'b2b' ? 'b2b' : 'b2c' });
      if (!r.ok) { toast(r.error, true); return; }
      if (view === 'b2b') leadsB2B = leadsB2B.filter(x => x.id !== l.id); else leadsB2C = leadsB2C.filter(x => x.id !== l.id);
      closeDrawer(); render(); toast('Lead excluído');
    }

    // =========================================================
    // Mensagens de WhatsApp
    // =========================================================
    function templates(l) {
      const nome = firstName(l), svc = service(l), un = l.preferred_unit === 'granja_viana' ? 'Granja Viana' : 'Av. Paulista';
      const resp = firstAnswer(l);
      const quando = preAgendamentoTexto(l);
      const optOut = '\n\n_(Caso não queira mais receber nossos avisos, responda PARAR)_';
      if (view === 'b2b') return {
        primeiro: `Oi, ${nome}! Aqui é da Creabily. Recebemos sua aplicação para a mentoria e adoraríamos conversar. Qual o melhor dia e horário para uma ligação rápida de 15 minutos?`,
        retorno: `Oi, ${nome}! Passando para saber se ainda tem interesse na mentoria da Creabily. Posso te enviar os próximos horários disponíveis?` + optOut
      };
      return {
        primeiro: `Oi, ${nome}! Aqui é da Creabily ${un}. Vi que você fez nosso teste sobre ${svc}${resp ? ` e marcou "${resp}"` : ''}. Nossos especialistas realizam uma Avaliação Clínica Completa de 1 hora (valor de R$ 300 particular, com relatório e nota fiscal para reembolso pelo seu convênio). Você prefere atendimento pela manhã ou tarde?`,
        confirmar_pre: `Olá, ${nome}! Tudo bem? Aqui é da recepção da Creabily ${un}. Recebemos seu teste e seu pré-agendamento de preferência para ${quando} para ${svc}! Nossa primeira consulta é uma Avaliação Individualizada de 1 hora com especialista (valor de R$ 300 no particular, com suporte de NF e relatório para reembolso pelo seu plano de saúde). Podemos confirmar oficialmente esse horário na nossa grade para você?`,
        pos_quiz: `Oi, ${nome}! Tudo bem? Aqui é da Creabily ${un}. Vi que você concluiu nosso teste sobre ${svc}. Conseguiu ver a mensagem anterior? Nossos especialistas têm horários abertos esta semana para sua avaliação individualizada de 1h (com emissão de relatório para reembolso do seu convênio). Podemos garantir sua vaga?` + optOut,
        agendar_novo: `Oi, ${nome}! Tudo bem? Aqui é da Creabily ${un}. Vi que você concluiu nossa avaliação sobre ${svc}. Gostaria de agendar sua avaliação inicial de 1 hora com nosso fisioterapeuta especialista? Tenho horários abertos pela manhã ou tarde esta semana.`,
        retorno: `Oi, ${nome}! Tudo bem? Passando para checar se você prefere manter a preferência de horário que você indicou no teste para ${svc} ou se prefere que a gente encontre outro dia/turno na Creabily ${un}? As vagas com os especialistas preenchem rápido, queria te garantir prioridade!` + optOut,
        reaquecer_dor: `Olá, ${nome}! Tudo bem? Aqui é da equipe clínica da Creabily ${un}. Lembrei de você hoje: como está a sua queixa de ${svc}? Abrimos algumas vagas prioritárias de avaliação clínica de 1 hora esta semana e emitimos toda a documentação para reembolso pelo seu plano de saúde. Vamos cuidar disso juntos?` + optOut,
        reaquecer_noshow: `Oi, ${nome}, tudo bem? Aqui é da recepção da Creabily ${un}. Sei que imprevistos acontecem e você não conseguiu comparecer à sua avaliação. Como sua saúde e seu bem-estar vêm em primeiro lugar, quer que eu veja um novo horário mais tranquilo para você?` + optOut,
        ultimo: `Oi, ${nome}! Esta é minha última mensagem para não te incomodar. Quando quiser agendar sua avaliação de ${svc} na Creabily ${un}, é só responder por aqui que te recebo com todo carinho!` + optOut,
        pesquisa_nps: `Oi, ${nome}! Tudo bem? Aqui é da equipe da Creabily ${un}. Como foi sua sessão de ${svc} com a gente? Queremos sempre te oferecer o melhor cuidado: de 0 a 10, que nota você daria para o seu atendimento hoje? Leva menos de 30 segundos: https://avaliacao.creabily.com/nps.html?name=${encodeURIComponent(nome)}&unit=${encodeURIComponent(unitKey(l))}&service=${encodeURIComponent(svc)}&phone=${phoneOf(l)}`
      };
    }
    const TPL_LABELS = {
      primeiro: '1º contato',
      confirmar_pre: 'Confirmar pré-agendamento (R$ 300)',
      pos_quiz: 'Resgate Pós-Quiz (< 3h)',
      agendar_novo: 'Agendar horário',
      retorno: 'Retomar turno (3h-48h)',
      reaquecer_dor: 'Reaquecer (Frio / > 7d)',
      reaquecer_noshow: 'Reaquecer (No-Show)',
      ultimo: 'Última tentativa',
      pesquisa_nps: '⭐ Pesquisa NPS (Pós-Atendimento)'
    };
    function defaultTpl(l) {
      if (view === 'b2b') return l.status === 'novo_lead_quiz' ? 'primeiro' : 'retorno';
      if (l.status === 'consulta_realizada') return 'pesquisa_nps';
      if (l.status === 'no_show') return 'reaquecer_noshow';
      if (l.status === 'perdido') return 'reaquecer_dor';
      if (l.status === 'agendado') return 'confirmar_pre';
      if (hasPreAgendamento(l)) return 'confirmar_pre';
      if (l.status === 'followup_3') return 'ultimo';
      if (l.status === 'novo_lead_quiz') {
        const h = hoursSince(l.created_at);
        return (h !== null && h > 0.5) ? 'pos_quiz' : 'agendar_novo';
      }
      return 'retorno';
    }
    function waLink(l, text) { return `https://wa.me/${phoneOf(l)}?text=${encodeURIComponent(text ?? templates(l)[defaultTpl(l)])}`; }

    // =========================================================
    // Drawer
    // =========================================================
    function openDrawer(id) {
      const l = findLead(id); if (!l) return;
      openLeadId = id;
      fillDrawer(l, true);
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'false');
      document.getElementById('scrim').classList.add('open');
    }
    function closeDrawer() {
      openLeadId = null;
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'true');
      document.getElementById('scrim').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.modal')) closeDrawer(); });

    function fillDrawer(l, fresh = false) {
      const d = document.getElementById('drawer');
      const keepMsg = !fresh && document.getElementById('d-msg') ? document.getElementById('d-msg').value : null;
      const keepNote = !fresh && document.getElementById('d-note') ? document.getElementById('d-note').value : '';
      const isB2B = view === 'b2b';
      const o = origin(l);
      const tpls = templates(l), tplKey = defaultTpl(l);
      const cur = stageOf(l.status);
      const ph = phoneOf(l);
      const isOptedOut = Boolean(l.opted_out_at || (l.notes && l.notes.includes('[OPT-OUT]')));
      const answers = Array.isArray(l.quiz_answers) ? l.quiz_answers : [];
      const b2bFields = [['Profissão / negócio', l.profissao], ['Faturamento', l.faturamento], ['Momento', l.momento], ['Dores', l.dores], ['Transformação', l.transformacao], ['E-mail', l.email], ['Instagram', l.instagram]].filter(x => x[1]);
      const origemRows = [['Origem', o ? o.label : 'Não identificada'], ['Campanha', l.utm_campaign], ['Meio', l.utm_medium], ['Palavra-chave', l.utm_term], ['Anúncio', l.utm_content], ['Entrou em', l.created_at ? dateFmt(l.created_at) : '']].filter(x => x[1]);
      const nextDate = l.next_action_at ? new Date(l.next_action_at).toLocaleDateString('en-CA') : '';

      d.innerHTML = `
        <div class="d-head">
          ${avatar(l, 'lg')}
          <div class="who"><h3>${esc(nameOf(l))}</h3>
            <div class="meta">${isB2B ? '<span class="chip">Mentoria B2B</span>' : unitChip(l)}<span>${esc(phoneFmt(ph))}</span>${ageChip(l)}</div></div>
          <button class="btn btn-ghost btn-icon" onclick="closeDrawer()" aria-label="Fechar">${ic('x')}</button>
        </div>
        <div class="d-body">
          <div class="d-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <h5 style="margin:0">Etapa do Lead</h5>
              <span class="chip" style="font-weight:600;background:${stageInfo(l.status).color}15;color:${stageInfo(l.status).color}">${stageInfo(l.status).label}</span>
            </div>
            <div class="stage-group-label">Funil Ativo</div>
            <div class="stages stages-active">
              ${STAGES.filter(s => !['consulta_realizada', 'no_show', 'perdido'].includes(s.key)).map(s => `<button class="stage ${cur === s.key ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','${s.key}')"><span class="dot" style="background:${s.color}"></span>${s.short}</button>`).join('')}
            </div>
            <div class="stage-group-label">Desfecho / Conclusão</div>
            <div class="stages stages-outcomes">
              <button class="stage ${cur === 'consulta_realizada' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','consulta_realizada')"><span class="dot" style="background:#1f9d55"></span>Atendido</button>
              <button class="stage ${cur === 'no_show' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','no_show')"><span class="dot" style="background:#ea580c"></span>No-Show</button>
              <button class="stage ${cur === 'perdido' ? 'on' : ''}" onclick="moveLead('${esc(l.id)}','perdido')"><span class="dot" style="background:#64748b"></span>Perdido</button>
            </div>
            ${l.status === 'consulta_realizada' ? `
            <div style="margin-top:12px;padding:12px;background:rgba(13,148,136,0.08);border:1px solid rgba(13,148,136,0.25);border-radius:10px;">
              <div style="font-size:12px;font-weight:700;color:#0f766e;margin-bottom:4px;display:flex;align-items:center;gap:6px">
                ⭐ Pós-Atendimento & Avaliação de Satisfação
              </div>
              <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.4">Paciente atendido na clínica! Envie a pesquisa inteligente de NPS: notas 9-10 são direcionadas para avaliar no Google Maps e notas baixas geram acolhimento confidencial.</p>
              ${ph ? `<a class="btn btn-action-wa" style="background:#0d9488;color:#fff;width:100%;justify-content:center;display:flex;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(13,148,136,0.25);" 
                 href="${waLink(l, templates(l).pesquisa_nps)}" target="_blank" rel="noopener">
                ${ic('wa', 'icon-sm')} ⭐ Enviar Pesquisa NPS no WhatsApp
              </a>` : ''}
            </div>` : ''}
          </div>

          ${ph ? `<div class="d-section"><h5>Mensagem de WhatsApp</h5>
            ${isOptedOut ? `<div style="background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:8px">🚫 Paciente solicitou descadastro (PARAR). Não envie mensagens automáticas ou de reaquecimento.</div>` : ''}
            <div class="tpl">${Object.keys(tpls).map(k => `<button data-tpl="${k}" class="${k === tplKey ? 'on' : ''}" onclick="pickTpl('${k}')">${TPL_LABELS[k] || k}</button>`).join('')}</div>
            <textarea class="input" id="d-msg" rows="5">${esc(keepMsg ?? tpls[tplKey])}</textarea>
            <div class="grid2" style="margin-top:8px">
              <button class="btn" onclick="copyMsg()">${ic('copy', 'icon-sm')}Copiar</button>
              <a class="btn btn-wa" id="d-wa" target="_blank" rel="noopener" href="#" onclick="this.href=waLink(findLead('${esc(l.id)}'), document.getElementById('d-msg').value)">${ic('wa', 'icon-sm')}Abrir no WhatsApp</a>
            </div>
            <p class="muted" style="margin:8px 0 0">Depois de enviar, mova o lead de etapa para registrar o contato.</p>
          </div>` : ''}

          ${!isB2B ? `<div class="d-section"><h5>Respostas do quiz</h5>
            <div class="kv" style="margin-bottom:${answers.length ? 12 : 0}px"><dt>Interesse</dt><dd><b>${esc(service(l))}</b></dd></div>
            ${answers.length ? `<div class="qa">${answers.map(a => `<div><div class="q">${esc(a.pergunta)}</div><div class="a">${esc(a.resposta)}</div></div>`).join('')}</div>`
              : '<p class="muted" style="margin:0">Respostas detalhadas não registradas (lead anterior à atualização).</p>'}
            ${l.agendamento_resumo ? `<div class="note-old" style="margin-top:12px"><b>Pré-agendamento registrado:</b><br>${esc(String(l.agendamento_resumo).replace('AGENDADO_SUCESSO', '').trim())}</div>` : ''}
          </div>` : `<div class="d-section"><h5>Aplicação</h5><dl class="kv">${b2bFields.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`}

          <div class="d-section"><h5>Anotações e próximo passo</h5>
            ${l.notes && l.notes.includes('[NPS') ? `
              <div style="background:#ccfbf1;border:1px solid rgba(13,148,136,0.3);color:#0f766e;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px">
                ⭐ Avaliação de Satisfação (NPS) Registrada para este paciente
              </div>` : ''}
            ${l.notes ? `<div class="note-old">${esc(l.notes)}</div>` : ''}
            <textarea class="input" id="d-note" rows="3" placeholder="Ex.: Prefere horário à noite; vai ver com o marido.">${esc(keepNote)}</textarea>
            <div class="grid2" style="margin-top:8px">
              <input class="input" id="d-next" placeholder="Próximo passo" value="${esc(l.next_action || '')}">
              <input class="input" id="d-next-at" type="date" value="${nextDate}">
            </div>
            <button class="btn btn-primary btn-block" id="d-save" style="margin-top:8px" onclick="saveFields('${esc(l.id)}')">Salvar</button>
          </div>

          ${!isB2B ? `<div class="d-section"><h5>Origem</h5><dl class="kv">${origemRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>` : ''}
        </div>
        <div class="d-foot">
          <button class="btn btn-ghost btn-danger" onclick="deleteLead('${esc(l.id)}')">${ic('trash', 'icon-sm')}Excluir</button>
        </div>`;
    }
    function pickTpl(k) {
      const l = findLead(openLeadId); if (!l) return;
      document.getElementById('d-msg').value = templates(l)[k];
      document.querySelectorAll('.tpl button').forEach(b => b.classList.toggle('on', b.dataset.tpl === k));
    }
    async function copyMsg() {
      try { await navigator.clipboard.writeText(document.getElementById('d-msg').value); toast('Mensagem copiada'); }
      catch (e) { toast('Não foi possível copiar', true); }
    }
  </script>
</body>
</html>
