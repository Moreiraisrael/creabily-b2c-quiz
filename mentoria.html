<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aplicação Mentoria B2B | Creabily</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8fafc; /* bg-slate-50 */
      color: #1e293b; /* text-slate-800 */
      font-family: 'Inter', sans-serif;
    }
    .form-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .input-field {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: #0d9488; /* teal-600 */
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
      outline: none;
      background: #ffffff;
    }
    .input-field::placeholder { color: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Decoração sutil ao fundo -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>
  </div>

  <div class="max-w-3xl w-full form-container rounded-2xl p-8 md:p-12 relative z-10 my-8">
    
    <div class="text-center mb-10">
      <img src="assets/logo-icon.png" alt="Creabily" class="h-16 mx-auto mb-6 drop-shadow-sm" onerror="this.style.display='none'">
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
        Aplicação para Mentoria
      </h1>
      <p class="text-slate-500 text-sm md:text-base max-w-xl mx-auto">
        Preencha o formulário abaixo para analisarmos o perfil do seu negócio na área da saúde. Vagas limitadas e exclusivas.
      </p>
    </div>

    <form id="mentoria-form" class="space-y-6">
      
      <!-- Dados Pessoais -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Nome Completo <span class="text-teal-600">*</span></label>
          <input type="text" id="nome" required placeholder="Ex: Dr. João Silva" class="w-full px-4 py-3 rounded-xl input-field">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">WhatsApp <span class="text-teal-600">*</span></label>
          <input type="tel" id="whatsapp" required placeholder="(11) 99999-9999" class="w-full px-4 py-3 rounded-xl input-field" oninput="maskPhone(this)">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">E-mail <span class="text-teal-600">*</span></label>
          <input type="email" id="email" required placeholder="contato@seunegocio.com" class="w-full px-4 py-3 rounded-xl input-field">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Instagram</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 font-bold">@</span>
            <input type="text" id="instagram" placeholder="seunegocio" class="w-full pl-10 pr-4 py-3 rounded-xl input-field">
          </div>
        </div>
      </div>

      <!-- Negócio -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Faturamento Mensal <span class="text-teal-600">*</span></label>
        <select id="faturamento" required class="w-full px-4 py-3 rounded-xl input-field appearance-none">
          <option value="" disabled selected>Selecione uma faixa...</option>
          <option value="Abaixo de R$ 5.000">Abaixo de R$ 5.000</option>
          <option value="R$ 5.000 a R$ 15.000">R$ 5.000 a R$ 15.000</option>
          <option value="R$ 15.000 a R$ 30.000">R$ 15.000 a R$ 30.000</option>
          <option value="R$ 30.000 a R$ 50.000">R$ 30.000 a R$ 50.000</option>
          <option value="Acima de R$ 50.000">Acima de R$ 50.000</option>
        </select>
      </div>

      <!-- Perguntas Abertas -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Descreva de forma objetiva o que você faz e qual o seu negócio na saúde? <span class="text-teal-600">*</span></label>
        <textarea id="negocio" required rows="3" placeholder="Ex: Sou fisioterapeuta e tenho uma clínica focada em RPG e Pilates..." class="w-full px-4 py-3 rounded-xl input-field resize-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Por que você acredita que participar da Mentoria é a oportunidade ideal para você e para o crescimento do seu negócio? <span class="text-teal-600">*</span></label>
        <textarea id="motivo" required rows="4" placeholder="Ex: Preciso estruturar meus processos de captação de pacientes e organizar minha gestão..." class="w-full px-4 py-3 rounded-xl input-field resize-none"></textarea>
      </div>

      <!-- Botão de Envio -->
      <div class="pt-4">
        <button type="submit" id="btn-submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2">
          <span>Enviar Aplicação</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
      
      <div id="status-message" class="text-center text-sm font-medium mt-4 hidden"></div>

    </form>
  </div>

  <script>
    function maskPhone(input) {
      let v = input.value.replace(/\D/g, "");
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 2) v = `(${v.substring(0, 2)}) ${v.substring(2)}`;
      if (v.length > 9) v = `${v.substring(0, 10)}-${v.substring(10)}`;
      input.value = v;
    }

    document.getElementById('mentoria-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      const statusMsg = document.getElementById('status-message');
      
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
      btn.disabled = true;
      statusMsg.classList.add('hidden');

      const payload = {
        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        email: document.getElementById('email').value,
        instagram: document.getElementById('instagram').value,
        faturamento: document.getElementById('faturamento').value,
        negocio: document.getElementById('negocio').value,
        motivo: document.getElementById('motivo').value
      };

      try {
        const response = await fetch('/.netlify/functions/webhook-b2b', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          document.getElementById('mentoria-form').innerHTML = `
            <div class="text-center py-10 space-y-4">
              <div class="w-20 h-20 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm border border-teal-100">
                <i class="fas fa-check text-4xl"></i>
              </div>
              <h2 class="text-2xl font-bold text-slate-900">Aplicação Recebida com Sucesso!</h2>
              <p class="text-slate-500">Agradecemos o seu interesse. Nossa equipe irá analisar o perfil do seu negócio e entrará em contato em breve através do WhatsApp cadastrado.</p>
            </div>
          `;
        } else {
          throw new Error('Falha no envio');
        }
      } catch (err) {
        statusMsg.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-triangle"></i> Ocorreu um erro ao enviar sua aplicação. Tente novamente.</span>';
        statusMsg.classList.remove('hidden');
        btn.innerHTML = '<span>Tentar Novamente</span><i class="fas fa-arrow-right"></i>';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
